вы хотите, чтобы мы платили вам за признание, и ничего более?! Хорошо, тогда выплатите нам за ущерб, нанесённый российским землям!", "src": 1891, "w": "ross", "e": {"ross": "angry"}, "p": "Москва, Министерство иностранных дел", "h": "ea7ce28a"}, {"k": "say", "t": "Если вы хотите «просто признать» страну за деньги — идите к китайским кликам! И ещё… при всём неуважении к вам: идите вы… сами знаете куда!", "src": 1891, "w": "ross", "e": {"ross": "angry"}, "p": "Москва, Министерство иностранных дел", "h": "8fc64eb3"}, {"k": "say", "t": "…Что ж… Я вас понял. Тогда Британия вводит блокаду ваших портов в Европе.", "src": 1891, "w": "getsberg", "p": "Москва, Министерство иностранных дел", "h": "a96ab692"}, {"k": "say", "t": "Удачи вам в этом. Идите отсюда. Дорогу вы знаете.", "src": 1891, "w": "ross", "e": {"ross": "unhappy"}, "p": "Москва, Министерство иностранных дел", "h": "f4748743"}, {"k": "say", "t": "Дипломаты уходят. Росс достаёт трубку и закуривает. И вовремя вспоминает про гарнизон.", "src": 1891, "p": "Москва, Министерство иностранных дел", "fx": "smoke", "h": "97425ede"}, {"k": "say", "t": "Алло? Да, это снова я. Направьте гарнизон на задержку британских дипломатов.", "src": 1891, "w": "ross", "e": {"ross": "thinking"}, "p": "Москва, Министерство иностранных дел", "h": "aa5c701a"}, {"k": "say", "t": "Павлов приходит в себя.", "src": 1896, "p": "Москва, больница", "bg": "bolnitsa", "on": ["pavlov"], "x": {}, "fx": "none", "cg": "", "music": "Ну полная Лодка!", "e": {"pavlov": "sad"}, "id": "pavlov", "h": "6dbf4ee4"}, {"k": "say", "t": "Врач!", "src": 1896, "w": "pavlov", "e": {"pavlov": "unhappy"}, "p": "Москва, больница", "h": "af081d92"}, {"k": "say", "t": "Да, ваше высокопревосходительство.", "src": 1896, "w": "doctor", "p": "Москва, больница", "h": "54d66ea7"}, {"k": "say", "t": "Мне нужен телефон. Позвоните в Кремль. Пусть оттуда кто-нибудь приедет ко мне.", "src": 1896, "w": "pavlov", "e": {"pavlov": "original"}, "p": "Москва, больница", "h": "24df4bda"}, {"k": "say", "t": "В больницу к Павлову приезжает Кашубский.", "src": 1913, "p": "Москва, больница", "on": ["pavlov", "kashubski"], "x": {}, "e": {"kashubski": "original"}, "h": "4796e79b"}, {"k": "say", "t": "Здравствуйте, Александр Васильевич.", "src": 1915, "w": "kashubski", "e": {"kashubski": "original"}, "p": "Москва, больница", "h": "85bd9efe"}, {"k": "say", "t": "Скажите, британских дипломатов задержали?", "src": 1928, "w": "pavlov", "e": {"pavlov": "thinking"}, "p": "Москва, больница", "h": "b804df0a"}, {"k": "say", "t": "Как самочувствие?", "src": 1987, "w": "kashubski", "e": {"kashubski": "sad"}, "p": "Москва, больница", "h": "b200408b"}, {"k": "say", "t": "Сойдёт. Мне нужно в Красноярск! Чем быстрее, тем лучше!", "src": 1988, "w": "pavlov", "e": {"pavlov": "unhappy"}, "p": "Москва, больница", "h": "929f8cb0"}, {"k": "say", "t": "Подождите, пожалуйста, со своим Красноярском. Я всё понимаю, но вам сначала нужно вылечиться. Я сообщу, что встреча в Красноярске переносится, не волнуйтесь.", "src": 1993, "w": "kashubski", "e": {"kashubski": "unhappy"}, "p": "Москва, больница", "h": "55ff7bdb"}, {"k": "say", "t": "К чёрту! Я собираюсь и еду в Красноярск!", "src": 1996, "w": "pavlov", "e": {"pavlov": "angry"}, "p": "Москва, больница", "h": "60c6ccca"}, {"k": "say", "t": "Попрошу вас сообщить императору и Табуретову, что в ближайшее время я жду их в Красноярске.", "src": 1998, "w": "pavlov", "e": {"pavlov": "original"}, "p": "Москва, больница", "h": "c79e0779"}, {"k": "say", "t": "Стойте! Вы куда? Вы еле ходите!", "src": 2000, "w": "kashubski", "e": {"kashubski": "shocked"}, "p": "Москва, больница", "h": "0e2a5532"}, {"k": "say", "t": "Павлов, прихрамывая, идёт по коридору к лестнице.", "src": 2002, "p": "Москва, больница", "h": "357600ab"}, {"k": "say", "t": "Ну и что? Я вам всё сказал!", "src": 2002, "w": "pavlov", "e": {"pavlov": "angry"}, "p": "Москва, больница", "h": "00c24c6c"}, {"k": "say", "t": "Кашубский хватает его за рукав и уводит обратно в больницу.", "src": 2005, "p": "Москва, больница", "h": "e9be4c2e"}, {"k": "say", "t": "Кашубский звонит Крюкову.", "src": 2008, "p": "Москва, больница", "on": ["kashubski", "kryukov"], "x": {}, "h": "8056349a"}, {"k": "say", "t": "Здравствуйте. Павлов чуть из больницы не сбежал. Он уже хотел ехать в Красноярск, я с ним в коридоре.", "src": 2012, "w": "kashubski", "e": {"kashubski": "embarassed"}, "p": "Москва, больница", "h": "9a9af615"}, {"k": "say", "t": "Вы издеваетесь? Я занят. Разбирайтесь сами со своим Павловым… И да: он остаётся в Москве, это приказ. И звоните по важным вопросам. До свидания.", "src": 2016, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, больница", "h": "5f01aad9"}, {"k": "say", "t": "Оставайтесь в Москве. Крюков приказал.", "src": 2019, "w": "kashubski", "e": {"pavlov": "unhappy", "kashubski": "unhappy"}, "p": "Москва, больница", "on": ["kashubski", "pavlov"], "x": {}, "h": "a8896e1a"}, {"k": "say", "t": "Нет! В Красноярске слишком много работы, которую, кроме меня, никто не сделает. Извините.", "src": 2027, "w": "pavlov", "e": {"pavlov": "emberassed"}, "p": "Москва, больница", "h": "0757d7c1"}, {"k": "say", "t": "Павлов садится в машину и уезжает.", "src": 2029, "p": "Москва, больница", "h": "690af566"}, {"k": "say", "t": "Ещё чего. Я, мать его, Александр Васильевич Павлов! А не кто-то там, чтобы не работать и в больнице лежать!", "src": 2038, "w": "pavlov", "e": {"pavlov": "angry"}, "p": "Москва, больница", "h": "1dd0ebcb"}, {"k": "say", "t": "…Меня убьют.", "src": 2031, "w": "kashubski", "e": {"kashubski": "shocked"}, "p": "Москва, больница", "on": ["kashubski"], "x": {}, "h": "08ad4fcd"}, {"k": "say", "t": "В Генштабе звонит телефон.", "src": 2059, "p": "Москва, больница", "bg": "genshtab", "on": ["taburetov"], "x": {}, "cg": "", "h": "6fafe835"}, {"k": "say", "t": "Табуретов, скажи: где бриты?", "src": 2062, "w": "pavlov", "e": {"pavlov": "thinking"}, "p": "Москва, больница", "h": "7508d07b"}, {"k": "say", "t": "Бриты? Уехали уже.", "src": 2063, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Москва, больница", "h": "7881b248"}, {"k": "say", "t": "Лучше звоните насчёт этого Россу, он последний с ними говорил.", "src": 2064, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Москва, больница", "h": "cb20920a"}, {"k": "say", "t": "Какого чёрта! Я же говорил задержать их!", "src": 2066, "w": "pavlov", "e": {"pavlov": "angry"}, "p": "Москва, больница", "h": "01d1c2f8"}, {"k": "say", "t": "Крюков слушает.", "src": 2096, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Москва, больница", "bg": "kabinet_emperor", "on": ["kryukov"], "x": {}, "cg": "", "h": "a204dd4d"}, {"k": "say", "t": "Ваше императорское величество. Прошу, скажите мне, где эти британцы?", "src": 2097, "w": "pavlov", "e": {"pavlov": "original"}, "p": "Москва, больница", "h": "c16d7da6"}, {"k": "say", "t": "Какие британцы?", "src": 2101, "w": "kryukov", "e": {"kryukov": "thinking"}, "p": "Москва, больница", "h": "c9008e4a"}, {"k": "say", "t": "Дипломаты.", "src": 2103, "w": "pavlov", "e": {"pavlov": "unhappy"}, "p": "Москва, больница", "h": "567b0ac0"}, {"k": "say", "t": "О их судьбе мне ничего не известно. Я только знаю, что Росс с ними не договорился.", "src": 2104, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Москва, больница", "h": "5ef34935"}, {"k": "say", "t": "Вашу мать! Просил же задержать. Ладно, не отвлекаю. Честь имею!", "src": 2107, "w": "pavlov", "e": {"pavlov": "angry"}, "p": "Москва, больница", "h": "767bc294"}, {"k": "say", "t": "Павлов грузит машину на паром и уходит в Красноярск.", "src": 2114, "p": "Москва, больница", "h": "2c52716e"}, {"k": "say", "t": "Генеральный штаб. К Табуретову приезжают Кашубский и генерал-фельдмаршал Глюг.", "src": 2112, "p": "Москва, 2 сентября 1923", "bg": "genshtab", "on": ["taburetov", "kashubski", "glug"], "x": {}, "fx": "none", "cg": "", "music": "Спокойные дни военного", "e": {"kashubski": "original", "glug": "original"}, "id": "sentyabr", "h": "18187d82"}, {"k": "say", "t": "Здравия желаю, уважаемый Владислав Табуретов!", "src": 2112, "w": "kashubski", "e": {"kashubski": "happy"}, "p": "Москва, 2 сентября 1923", "h": "bfb869b8"}, {"k": "say", "t": "Глюг выходит на крыльцо. Выстрел. Маршал хватается за грудь.", "src": 2122, "p": "Москва, 2 сентября 1923", "once": ["shake"], "music": "Ужас ужасный", "sfx": "shot", "e": {"glug": "shocked"}, "h": "fd481951"}, {"k": "say", "t": "Табуретов отпивает чай.", "src": 2129, "p": "Москва, 2 сентября 1923", "on": ["taburetov"], "x": {}, "h": "d7b71fdb"}, {"k": "say", "t": "Какой-то горький вкус… Странно…", "src": 2129, "w": "taburetov", "e": {"taburetov": "thinking"}, "p": "Москва, 2 сентября 1923", "h": "86123998"}, {"k": "say", "t": "Сильный кашель.", "src": 2129, "p": "Москва, 2 сентября 1923", "h": "2d1cb4c1"}, {"k": "say", "t": "В кабинете звонит телефон. Это Ружик.", "src": 2098, "p": "Москва, 2 сентября 1923", "h": "feca501a"}, {"k": "say", "t": "…Алло? Что у вас там? Опять кого-то подстрелили?", "src": 2130, "w": "ruzhik", "e": {"ruzhik": "shocked"}, "p": "Москва, 2 сентября 1923", "h": "adf0ab38"}, {"k": "say", "t": "Не знаю… Глюг…", "src": 2136, "w": "taburetov", "e": {"taburetov": "shocked"}, "p": "Москва, 2 сентября 1923", "h": "79a8c1eb"}, {"k": "say", "t": "Табуретов падает без сознания с кружкой в руках.", "src": 2140, "p": "Москва, 2 сентября 1923", "h": "ce145555"}, {"k": "say", "t": "Алло, скорая! Наших убивают, приезжайте скорее! Табуретову и Глюгу плохо!", "src": 2144, "w": "kashubski", "e": {"glug": "sad", "kashubski": "shocked"}, "p": "Москва, 2 сентября 1923", "on": ["kashubski", "glug"], "x": {}, "h": "1ce4a0f7"}, {"k": "say", "t": "Пуля попадает Кашубскому в левую руку. Он выхватывает револьвер и стреляет в нападавшего.", "src": 2144, "p": "Москва, 2 сентября 1923", "once": ["shake"], "sfx": "shot", "h": "992ffb94"}, {"k": "say", "t": "Расстреляйте их!", "src": 2146, "w": "glug", "e": {"glug": "angry"}, "p": "Москва, 2 сентября 1923", "h": "57c14127"}, {"k": "say", "t": "Вторая пуля — в ногу, третья — в бок.", "src": 2154, "p": "Москва, 2 сентября 1923", "h": "c2824547"}, {"k": "say", "t": "Будьте прокляты!", "src": 2155, "w": "kashubski", "e": {"kashubski": "angry"}, "p": "Москва, 2 сентября 1923", "h": "5bc3cf3f"}, {"k": "say", "t": "Глюг отрывает рукав кителя и зажимает рану Кашубского.", "src": 2156, "p": "Москва, 2 сентября 1923", "h": "4ea4fb31"}, {"k": "say", "t": "…Спасибо…", "src": 2157, "w": "kashubski", "e": {"kashubski": "sad"}, "p": "Москва, 2 сентября 1923", "h": "781c4a84"}, {"k": "say", "t": "Глюг стреляет в стрелка.", "src": 2158, "p": "Москва, 2 сентября 1923", "h": "29a297a3"}, {"k": "say", "t": "Табуретов кое-как поднимается.", "src": 2149, "p": "Москва, 2 сентября 1923", "on": ["taburetov"], "x": {}, "h": "8f8ed7e1"}, {"k": "say", "t": "Годы практики не прошли даром. Яд кобры, тридцать процентов концентрата… У меня к нему иммунитет.", "src": 2153, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Москва, 2 сентября 1923", "h": "b0b5a10e"}, {"k": "say", "t": "Услышав выстрелы, он выглядывает в окно и берёт пистолет.", "src": 2159, "p": "Москва, 2 сентября 1923", "h": "6a892104"}, {"k": "say", "t": "Получайте, твари! Я побеждал врагов и получше!", "src": 2159, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Москва, 2 сентября 1923", "h": "6a780ff9"}, {"k": "say", "t": "Глюг втаскивает Кашубского в здание, доводит до кабинета Табуретова и падает без сознания.", "src": 2164, "p": "Москва, 2 сентября 1923", "h": "47fb9edc"}, {"k": "say", "t": "Алло! Скорая! Генштаб, срочно!", "src": 2167, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Москва, 2 сентября 1923", "h": "61d5f250"}, {"k": "say", "t": "Ружик! На нас всех совершили покушение! Глюг, я, Владимир Кашубский! Код Красный!", "src": 2183, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Москва, 2 сентября 1923", "h": "78d97824"}, {"k": "say", "t": "Боже мой… Позвоните Крюкову и вводите военное положение в Москве! А лучше армию. Я отправлю телеграмму Зарывалову. Срочно!", "src": 2196, "w": "ruzhik", "e": {"ruzhik": "shocked"}, "p": "Москва, 2 сентября 1923", "h": "b1200605"}, {"k": "say", "t": "Приезжают врачи. Кашубского и Глюга уносят на носилках.", "src": 2187, "p": "Москва, 2 сентября 1923", "h": "38a1f6c8"}, {"k": "say", "t": "Крюков слушает.", "src": 2202, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Москва, 2 сентября 1923", "bg": "kabinet_emperor", "on": ["taburetov", "kryukov"], "x": {}, "cg": "", "music": "Императорские проблемы", "h": "3bfb56e2"}, {"k": "say", "t": "Это Табуретов! На меня, Глюга и Владимира Кашубского совершили покушение! Вводите код Красный в Москве! А лучше вообще везде!", "src": 2203, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Москва, 2 сентября 1923", "h": "ee9fff7e"}, {"k": "say", "t": "Боже…", "src": 2204, "w": "kryukov", "e": {"kryukov": "shocked"}, "p": "Москва, 2 сентября 1923", "h": "969a519c"}, {"k": "say", "t": "Крюков звонит Ружику.", "src": 2212, "p": "Москва, 2 сентября 1923", "on": ["kryukov"], "x": {}, "h": "7d782775"}, {"k": "say", "t": "Ружик, срочно: ввести чрезвычайное положение от Смоленска до Владивостока! Паковать всех подозрительных. Пора раз и навсегда разобраться с этой напастью, потому что следующими, возможно, будете вы.", "src": 2212, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, 2 сентября 1923", "h": "77212352"}, {"k": "say", "t": "Наделяю Зарывалова особыми полномочиями.", "src": 2212, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, 2 сентября 1923", "h": "3b5d2657"}, {"k": "say", "t": "Так точно, ваше величество! Я отправил Зарывалову срочную телеграмму. Завтра экстренное заседание Думы. Думаю, к ночи положение введём. Слава России!", "src": 2216, "w": "ruzhik", "e": {"ruzhik": "original"}, "p": "Москва, 2 сентября 1923", "h": "532fa70f"}, {"k": "say", "t": "Я лично буду на этом заседании, Ружик.", "src": 2219, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Москва, 2 сентября 1923", "h": "45556f6d"}, {"k": "wire", "src": 2207, "from": "В. Ф. Ружик", "to": "Н. А. Зарывалову. Секретно", "tape": ["ПОХОДУ У ВАС В МОСКВЕ ОТКРЫТ СЕЗОН ОХОТЫ", "НА ТАБУРЕТОВА ГЛЮГА И КАШУБСКОГО СОВЕРШЕНЫ ПОКУШЕНИЯ", "ВСЕ РЕСУРСЫ В ВАШЕМ РАСПОРЯЖЕНИИ", "ГОВОРИТЕ ЧТО ВАМ НАДО ДУМА ДАСТ ТЧК"], "p": "Москва, 2 сентября 1923", "h": "daff59fc"}, {"k": "paper", "src": 2238, "mast": "Радио «Русь»", "date": "Москва", "hd": "В Москву введены войска", "bd": ["В связи с покушениями на первых лиц государства в Москву введены 15 000 солдат, 15 кавалерийских полков и 10 артиллерийских."], "q": ["«Сегодня на меня, Глюга и Кашубского были совершены покушения, и я официально ввожу эти войска для безопасности столицы. Дальнейшие указания армия Москвы будет получать от ОГПУ и Министерства обороны». — Табуретов"], "p": "Москва, 2 сентября 1923", "h": "a1e4dfd4"}, {"k": "say", "t": "Разговор Алексея II и Калвина Кулиджа.", "src": 2246, "p": "Москва, Кремль, сентябрь 1923", "on": ["kryukov"], "x": {}, "fx": "none", "cg": "", "music": "Московские вечера РП", "id": "kulidzh", "h": "84ff0c5f"}, {"k": "say", "t": "Здравствуйте! Поздравляю вас с избранием на трон России!", "src": 2246, "w": "coolidge", "p": "Москва, Кремль, сентябрь 1923", "h": "eac66ce7"}, {"k": "say", "t": "Благодарю. А вас — с избранием в президенты США!", "src": 2246, "w": "kryukov", "e": {"kryukov": "happy"}, "p": "Москва, Кремль, сентябрь 1923", "h": "cbcfc973"}, {"k": "say", "t": "Скажите, пожалуйста: у нас тут появилась информация, что у вас в стране постоянные теракты. Это правда?", "src": 2246, "w": "coolidge", "p": "Москва, Кремль, сентябрь 1923", "h": "3721a7cb"}, {"k": "say", "t": "Боюсь, что да… Возможно, бывшие красные или ещё кто.", "src": 2246, "w": "kryukov", "e": {"kryukov": "sad"}, "p": "Москва, Кремль, сентябрь 1923", "h": "ce80b655"}, {"k": "say", "t": "Мы можем помочь вам с расследованием. Как вы помогали нам в трудную минуту.", "src": 2246, "w": "coolidge", "p": "Москва, Кремль, сентябрь 1923", "h": "69c376b5"}, {"k": "say", "t": "Было бы неплохо, знаете ли.", "src": 2246, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Москва, Кремль, сентябрь 1923", "h": "5a58abfc"}, {"k": "say", "t": "По секрету: вы же понимаете, что нам с вами выгодно?", "src": 2246, "w": "coolidge", "p": "Москва, Кремль, сентябрь 1923", "h": "d76db61f"}, {"k": "say", "t": "Догадывался.", "src": 2246, "w": "kryukov", "e": {"kryukov": "thinking"}, "p": "Москва, Кремль, сентябрь 1923", "h": "45104e09"}, {"k": "say", "t": "Мы бы тоже хотели от вас помощи. Британия совсем обнаглела: возвращать нам долги отказывается, а с вас, как мы узнали, требует.", "src": 2246, "w": "coolidge", "p": "Москва, Кремль, сентябрь 1923", "h": "1f9eed1c"}, {"k": "say", "t": "Интересно… И что же вы предлагаете?", "src": 2246, "w": "kryukov", "e": {"kryukov": "thinking"}, "p": "Москва, Кремль, сентябрь 1923", "h": "ce9b9750"}, {"k": "say", "t": "Хотим её наказать. Все знают, что у Британии нет друзей, только выгодные партнёры.", "src": 2246, "w": "coolidge", "p": "Москва, Кремль, сентябрь 1923", "h": "25836075"}, {"k": "say", "t": "У вас есть идеи?", "src": 2246, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Москва, Кремль, сентябрь 1923", "h": "82940994"}, {"k": "say", "t": "Есть. Торговая блокада Британии: мы — на Атлантике, вы — в Северном Ледовитом океане.", "src": 2246, "w": "coolidge", "p": "Москва, Кремль, сентябрь 1923", "h": "cf2c69e8"}, {"k": "say", "t": "Мы подумаем…", "src": 2246, "w": "kryukov", "e": {"kryukov": "thinking"}, "p": "Москва, Кремль, сентябрь 1923", "h": "9928321e"}, {"k": "say", "t": "Дальше было много любезностей.", "src": 2246, "p": "Москва, Кремль, сентябрь 1923", "h": "4c3e088f"}, {"k": "say", "t": "Крюков вызывает к телефону Зарывалова.", "src": 2268, "p": "Москва, Кремль, сентябрь 1923", "on": ["kryukov", "zaryvalov"], "x": {}, "music": "Товарищ полицейский", "e": {"zaryvalov": "thinking"}, "h": "ccc66e7f"}, {"k": "say", "t": "Господин Зарывалов, вы читали сегодняшние новости? Я про разговор с Калвином Кулиджем.", "src": 2272, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Москва, Кремль, сентябрь 1923", "h": "6125f41d"}, {"k": "say", "t": "Ладно, не суть. Есть зацепка, кто стоит за всем этим.", "src": 2275, "w": "kryukov", "e": {"kryukov": "thinking"}, "p": "Москва, Кремль, сентябрь 1923", "h": "02debf4a"}, {"k": "say", "t": "Британия. Британия стоит за этим всем. Она пытается вывернуться из долгов США за наш счёт. Постоянно они лезут…", "src": 2280, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, Кремль, сентябрь 1923", "h": "4d2ba82d"}, {"k": "say", "t": "Красные тоже участвуют, но вы же понимаете, кто конечный выгодоприобретатель. Подключайте всех, кого считаете нужным. Я буду договариваться с другими странами.", "src": 2285, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Москва, Кремль, сентябрь 1923", "h": "d22abf39"}, {"k": "say", "t": "Звонок в кабинете Табуретова.", "src": 2297, "p": "Москва, Генеральный штаб", "bg": "genshtab", "on": ["taburetov"], "x": {}, "fx": "none", "cg": "", "music": "Хитрость Табуретова", "id": "getsberg", "h": "16644fe2"}, {"k": "say", "t": "Да? Слушаю.", "src": 2297, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Москва, Генеральный штаб", "h": "a0d925be"}, {"k": "say", "t": "Влад! Они узнали правду! Я вывез из консульства всё, они ломятся ко мне. Мне конец…", "src": 2297, "w": "getsberg", "p": "Москва, Генеральный штаб", "h": "07d04dd8"}, {"k": "say", "t": "Что?! Как тебе помочь? Ты же не зря ещё при Николае помогал следить за Британией, и сейчас тоже очень помогаешь.", "src": 2297, "w": "taburetov", "e": {"taburetov": "shocked"}, "p": "Москва, Генеральный штаб", "h": "afe55b9c"}, {"k": "say", "t": "Прости… Они не должны знать, что я ваш человек. Прощай… Там же и те, кто покушался на вас…", "src": 2297, "w": "getsberg", "p": "Москва, Генеральный штаб", "h": "0cdb7385"}, {"k": "say", "t": "Выстрел.", "src": 2297, "p": "Москва, Генеральный штаб", "h": "48958fdc"}, {"k": "say", "t": "…", "src": 2297, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Москва, Генеральный штаб", "h": "c35daed7"}, {"k": "say", "t": "Табуретову приносят ящики с документами. Он их просматривает.", "src": 2297, "p": "Москва, Генеральный штаб", "h": "23a8d2cb"}, {"k": "say", "t": "Ого… Так это всё они.", "src": 2297, "w": "taburetov", "e": {"taburetov": "shocked"}, "p": "Москва, Генеральный штаб", "h": "694871b4"}, {"k": "say", "t": "Табуретов звонит Крюкову.", "src": 2297, "p": "Москва, Генеральный штаб", "h": "524f55e2"}, {"k": "say", "t": "Ну кто ещё?", "src": 2301, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Москва, Генеральный штаб", "on": ["taburetov", "kryukov"], "x": {}, "h": "78fa1729"}, {"k": "say", "t": "Владислав Табуретов. Я знаю, кто это! У меня есть все доказательства против них!", "src": 2302, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Москва, Генеральный штаб", "h": "c4114130"}, {"k": "say", "t": "Кто.", "src": 2303, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Москва, Генеральный штаб", "h": "5863003d"}, {"k": "say", "t": "Британцы! Чёртовы британцы! Помните Вильяма Гетсберга? Из делегации?", "src": 2304, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Москва, Генеральный штаб", "h": "e703ee08"}, {"k": "say", "t": "Британия… Как мне и сказали американцы. Помню.", "src": 2305, "w": "kryukov", "e": {"kryukov": "thinking"}, "p": "Москва, Генеральный штаб", "h": "fbeeba64"}, {"k": "say", "t": "Он ещё при Романовых был нашим агентом в Британии, выведывал мелочи. Потом я с ним подружился, и он возил мне информацию из консульства, из МИДа, откуда мог.", "src": 2307, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Москва, Генеральный штаб", "h": "460c224a"}, {"k": "say", "t": "Соберите всю информацию и передайте ОГПУ. Нам надо собрать альянс против Британии и предъявить все доказательства. США на нашей стороне. Нас будет представлять Росс.", "src": 2310, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Москва, Генеральный штаб", "h": "95e08bf8"}, {"k": "say", "t": "Отлично. Кстати, я узнал о заседании Думы. Могу я присутствовать?", "src": 2311, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Москва, Генеральный штаб", "h": "babf9271"}, {"k": "say", "t": "Можете.", "src": 2312, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Москва, Генеральный штаб", "h": "017d0d87"}, {"k": "paper", "src": 2334, "mast": "Московская Правда", "date": "Москва", "hd": "Убит Максим Горький", "bd": ["Сегодня в Москве жестоко убит Максим Горький — писатель и драматург, пользовавшийся большим уважением среди большевиков."], "q": [], "p": "Москва, Генеральный штаб", "on": [], "x": {}, "music": "Ужас ужасный", "h": "9e1d7873"}, {"k": "say", "t": "Зарывалов, это Крюков. Горького убили. Похоже, британцы хотят нас запутать.", "src": 2346, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, Кремль, кабинет императора", "bg": "kabinet_emperor", "on": ["kryukov", "zaryvalov"], "x": {}, "fx": "none", "cg": "", "music": "Товарищ полицейский", "id": "rossi_kryukov", "h": "03aaae34"}, {"k": "say", "t": "Британцев — геть. Всех. Мы покажем им нашу силу, товарищ Зарывалов.", "src": 2351, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, Кремль, кабинет императора", "h": "b846755d"}, {"k": "say", "t": "Кстати, попрошу вас лично поехать со мной в Госдуму. Безопасность… И ещё кое-что обговорим.", "src": 2351, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Москва, Кремль, кабинет императора", "h": "ad574e9a"}, {"k": "say", "t": "Росс стучит в дверь императорского кабинета и открывает её.", "src": 2353, "p": "Москва, Кремль, кабинет императора", "on": ["kryukov", "ross"], "x": {}, "music": "Донской бальзам", "h": "87737750"}, {"k": "say", "t": "Здравствуй, Крюк. Что звал?", "src": 2353, "w": "ross", "e": {"ross": "original"}, "p": "Москва, Кремль, кабинет императора", "h": "154850ab"}, {"k": "say", "t": "Здравствуй, Росс. Переговорил я, значит, с Америкой… Британцы хороший план подготовили, но просчитались.", "src": 2357, "w": "kryukov", "e": {"kryukov": "happy"}, "p": "Москва, Кремль, кабинет императора", "h": "03a5193f"}, {"k": "say", "t": "Крюков наливает себе чаю.", "src": 2357, "p": "Москва, Кремль, кабинет императора", "h": "28671462"}, {"k": "say", "t": "Кстати, будешь?", "src": 2357, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Москва, Кремль, кабинет императора", "h": "e39c367b"}, {"k": "say", "t": "Откажусь. Что за «план» у островных крыс?", "src": 2359, "w": "ross", "e": {"ross": "unhappy"}, "p": "Москва, Кремль, кабинет императора", "h": "b4640d1b"}, {"k": "say", "t": "У них нет денег. Они хотят вынудить нас, фактически, выплатить их долг США. Ты понимаешь, что это значит?", "src": 2361, "w": "kryukov", "e": {"kryukov": "happy"}, "p": "Москва, Кремль, кабинет императора", "h": "8be2ae51"}, {"k": "say", "t": "Много чего это значит. В данной ситуации под этим подразумевается…?", "src": 2365, "w": "ross", "e": {"ross": "thinking"}, "p": "Москва, Кремль, кабинет императора", "h": "3dda43fa"}, {"k": "say", "t": "Неспособность Британии противостоять Америке. Они поставили не на того кандидата. Новый президент США не жмот, которому нужны лишь деньги, а очень умный человек.", "src": 2369, "w": "kryukov", "e": {"kryukov": "thinking"}, "p": "Москва, Кремль, кабинет императора", "h": "35cc70b5"}, {"k": "say", "t": "Нам надо собрать вокруг себя ряд стран и наконец показать острову, что он не такой уж сильный, как думает.", "src": 2369, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Москва, Кремль, кабинет императора", "h": "8884791a"}, {"k": "say", "t": "Ха… Помнится, первым такое сделал Бонапарт. Что ж, с европейскими странами я договорюсь без проблем.", "src": 2375, "w": "ross", "e": {"ross": "happy"}, "p": "Москва, Кремль, кабинет императора", "h": "aabbed8d"}, {"k": "say", "t": "Вот и замечательно. А сейчас мы едем в Думу.", "src": 2376, "w": "kryukov", "e": {"kryukov": "happy"}, "p": "Москва, Кремль, кабинет императора", "h": "be45dd3a"}, {"k": "say", "t": "Машины едут по Москве. На улицах полки солдат, кое-где идут бои с охотниками за головами.", "src": 2386, "p": "Москва, Кремль, кабинет императора", "h": "ec867eb4"}, {"k": "say", "t": "Господа депутаты, прошу занять места. Скоро к нам приедет государь император.", "src": 2366, "w": "ruzhik", "e": {"ruzhik": "original"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "bg": "gosduma", "on": ["ruzhik"], "x": {}, "fx": "none", "cg": "", "music": "Спокойные дни военного", "id": "duma", "h": "ada2bba8"}, {"k": "say", "t": "О, Ружик, здравствуй! Дождался. Сегодня мне точно надо будет выступить.", "src": 2368, "w": "taburetov", "e": {"kashubski": "original", "taburetov": "original"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "on": ["taburetov", "ruzhik", "kashubski"], "x": {}, "h": "b25d38ae"}, {"k": "say", "t": "У меня такая информация, что вся планета в шоке будет.", "src": 2370, "w": "taburetov", "e": {"taburetov": "thinking"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "f7335a1c"}, {"k": "say", "t": "Какая?", "src": 2371, "w": "kashubski", "e": {"kashubski": "thinking"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "88b7a67b"}, {"k": "say", "t": "А вот пока не стоит её говорить. А то вдруг и тут охотники за моей головой найдутся.", "src": 2372, "w": "taburetov", "e": {"taburetov": "embarrased"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "428be9df"}, {"k": "say", "t": "В зал входит император. За ним — Зарывалов.", "src": 2395, "p": "Москва, Государственная Дума, 3 сентября 1923", "on": ["kryukov", "ruzhik", "zaryvalov"], "x": {}, "music": "Товарищ полицейский", "e": {"kryukov": "unhappy", "zaryvalov": "original"}, "h": "af1ab6dd"}, {"k": "say", "t": "Прошу тишины в зале!", "src": 2397, "w": "ruzhik", "e": {"ruzhik": "angry"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "5b49625a"}, {"k": "say", "t": "Господа присяжные и ваше величество! Как вам уже известно, на наших руководителей совершены покушения: на Павлова, Табуретова, Глюга и Кашубского. Это неприемлемо!", "src": 2398, "w": "ruzhik", "e": {"ruzhik": "angry"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "889c3de9"}, {"k": "say", "t": "В связи с этими событиями подготовлен закон номер два от третьего сентября 1923 года. Сейчас будет зачитан его текст.", "src": 2398, "w": "ruzhik", "e": {"ruzhik": "original"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "0fc0ce10"}, {"k": "say", "t": "Господин Ружик, убили ещё и Максима Горького. Я уверен, это дело рук террористов.", "src": 2399, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "f85e947c"}, {"k": "say", "t": "Что?! Меня об этом не оповестили! Это возмутительно!", "src": 2400, "w": "ruzhik", "e": {"ruzhik": "shocked"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "c047a2e5"}, {"k": "say", "t": "Террористов… Хм. Британцев так ещё никто не называл.", "src": 2401, "w": "taburetov", "e": {"taburetov": "thinking"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "on": ["taburetov"], "x": {}, "h": "f7380dbd"}, {"k": "doc", "src": 2402, "title": "Закон №2 от 3 сентября 1923 года", "items": ["1. В связи с ухудшением внутриполитической ситуации ввести военное положение во всех населённых пунктах.", "1.1. Ввести комендантский час с 18:00 до 09:00.", "1.2. Во время комендантского часа предоставить сотрудникам ОГПУ и ВЧК полную свободу действий.", "2. Главе ОГПУ Н. А. Зарывалову временно, сроком на один год, предоставляется право вносить правки в данный закон без согласования с Думой.", "3. Ко всем чиновникам и депутатам приставить личную охрану от двух человек.", "4. Все сроки в документе могут быть продлены голосованием Думы.", "5. Закон может быть изменён в любой момент без переголосования.", "6. Закон вступает в силу с момента подписания государем императором и может быть отменён сопутствующим актом."], "p": "Москва, Государственная Дума, 3 сентября 1923", "on": ["kryukov", "ruzhik", "zaryvalov"], "x": {}, "h": "2e4020e3"}, {"k": "say", "t": "Крюков подписывает закон.", "src": 2403, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "b687d117"}, {"k": "say", "t": "Я понимаю, для некоторых это выглядит как деспотизм. Но поверьте мне: сейчас нам нужна твёрдая рука господина Зарывалова и нашего государя императора!", "src": 2404, "w": "ruzhik", "e": {"zaryvalov": "thinking", "ruzhik": "embarassed"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "6656f8e8"}, {"k": "say", "t": "Все депутаты за?", "src": 2406, "w": "ruzhik", "e": {"ruzhik": "original"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "8493259f"}, {"k": "say", "t": "Все голосуют за.", "src": 2406, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "464bc9c1"}, {"k": "say", "t": "Слово берёт император Алексей II.", "src": 2409, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "56725b35"}, {"k": "say", "t": "Ружик подходит к Зарывалову и шепчет:", "src": 2410, "p": "Москва, Государственная Дума, 3 сентября 1923", "on": ["ruzhik", "zaryvalov"], "x": {}, "e": {"zaryvalov": "original"}, "h": "45939841"}, {"k": "say", "t": "Николай Александрович, мяч теперь на вашей стороне поля. Я верю в вас. Вам дарованы безграничные возможности. Искорените эту заразу.", "src": 2410, "w": "ruzhik", "e": {"ruzhik": "thinking"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "82d360f2"}, {"k": "say", "t": "Ваше величество, можно мне предоставить документы и доказательства, которые собрал мой агент, скорбно погибший?", "src": 2412, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "on": ["taburetov", "kryukov"], "x": {}, "music": "Спокойные дни военного", "h": "ab6a2cf4"}, {"k": "say", "t": "Конечно.", "src": 2414, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "10db6a55"}, {"k": "say", "t": "Табуретов выступает перед Думой.", "src": 2418, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "24483620"}, {"k": "say", "t": "Табуретов кашляет и ставит на трибуну большой чемодан с замками, набитый бумагами.", "src": 2419, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "2d54ac1e"}, {"k": "say", "t": "Вот, уважаемые, все документы.", "src": 2419, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "f382066f"}, {"k": "say", "t": "Господа чиновники и офицеры, друзья, соотечественники! Вы, наверное, думаете, что я буду говорить о внешней политике, об ужасных терактах в нашей великой стране… Вы ошибаетесь. Я хочу поговорить о нашей экономике.", "src": 2437, "w": "ross", "e": {"ross": "original"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "on": ["ross"], "x": {}, "h": "d0d1db79"}, {"k": "say", "t": "Россия — аграрная страна со слабыми и устаревшими заводами, верфями и фабриками. Мы не можем противопоставить западным державам равную армию: у нас плохой военно-промышленный комплекс.", "src": 2437, "w": "ross", "e": {"ross": "unhappy"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "e65f7259"}, {"k": "say", "t": "Из-за слабого сельского хозяйства над народом висит, как огромная чёрная туча, угроза голода.", "src": 2437, "w": "ross", "e": {"ross": "sad"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "b90b174c"}, {"k": "say", "t": "Что же делать? Нужны деньги, ресурсы на продажу и культурное развитие. Деньги — на новые станки и сельхозтехнику. Получить их — через огромную продажу наших ресурсов: лес, металлы, пшено — всё на продажу!", "src": 2437, "w": "ross", "e": {"ross": "thinking"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "0c94d3c8"}, {"k": "say", "t": "А под культурным развитием подразумевается… общая собственность и труд во благо государства…", "src": 2437, "w": "ross", "e": {"ross": "embarassed"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "102bce61"}, {"k": "say", "t": "Да. Я предлагаю внедрить в нашей стране социалистические институты власти. Признайте: здесь мало либералов и много консерваторов. Для успеха индустриализации нужны социалисты. У меня всё.", "src": 2437, "w": "ross", "e": {"ross": "original"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "d1965b5a"}, {"k": "say", "t": "Э… Чего?", "src": 2438, "w": "taburetov", "e": {"ross": "original", "taburetov": "shocked"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "on": ["ross", "taburetov"], "x": {}, "h": "f4a500f5"}, {"k": "say", "t": "Предлагаю провести мои плановые реформы экономики ещё раз и усилить их! А ещё хочу высказаться о нашем образовании.", "src": 2439, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "0bf81a32"}, {"k": "say", "t": "Господин Табуретов, это будет вынесено на голосование после всех выступлений. Сейчас слово господину Кашубскому.", "src": 2443, "w": "ruzhik", "e": {"ruzhik": "original"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "d5a0042e"}, {"k": "say", "t": "Насчёт покушений. Помимо покушений на меня, Глюга и Табуретова было ещё покушение на Ткаченко. Стрелял Болеслав Ковальчук, который вёл себя неадекватно и даже чуть не придушил полицейского.", "src": 2448, "w": "kashubski", "e": {"kashubski": "original"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "on": ["kashubski"], "x": {}, "h": "121668fd"}, {"k": "say", "t": "Возможно, он нарочно притворялся душевнобольным, чтобы вместо расстрела получить срок или принудительное лечение и сбежать.", "src": 2448, "w": "kashubski", "e": {"kashubski": "thinking"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "d0bd3b06"}, {"k": "say", "t": "Судя по тому, что рассказал господин Табуретов, получается, что Ковальчука могли отправить спецслужбы Польши или Британии. Планируется расследование.", "src": 2448, "w": "kashubski", "e": {"kashubski": "angry"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "c6e160bd"}, {"k": "say", "t": "В любом случае призываю вас быть начеку. Судя по терактам последних дней, может случиться всё что угодно. Спасибо за внимание!", "src": 2448, "w": "kashubski", "e": {"kashubski": "unhappy"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "81ba10a8"}, {"k": "say", "t": "Благодарю, господин Кашубский.", "src": 2451, "w": "ruzhik", "e": {"ruzhik": "happy"}, "p": "Москва, Государственная Дума, 3 сентября 1923", "h": "072b0192"}, {"k": "say", "t": "Казачий эшелон уходит в Монголию. С ним едет генерал-фельдмаршал Ческидов.", "added": true, "p": "Москва, Ярославский вокзал, сентябрь 1923", "bg": "vokzal", "on": ["chapaev"], "x": {}, "fx": "none", "cg": "", "id": "mongoliya", "h": "2a0f50e3"}, {"k": "say", "t": "Казак обращается к Ческидову.", "added": true, "p": "Москва, Ярославский вокзал, сентябрь 1923", "h": "363fd8da"}, {"k": "say", "t": "Товарищ Чапа… То есть Ческидов. Куда мы направляемся?", "added": true, "w": "kazak", "p": "Москва, Ярославский вокзал, сентябрь 1923", "h": "7e562f3c"}, {"k": "say", "t": "На Дальний Восток, товарищ. Земли некогда великой Монгольской империи.", "added": true, "w": "chapaev", "p": "Москва, Ярославский вокзал, сентябрь 1923", "h": "35e3531b"}, {"k": "say", "t": "Далековато… Вы уверены, что мы оттуда вообще вернёмся?", "added": true, "w": "kazak", "p": "Москва, Ярославский вокзал, сентябрь 1923", "h": "a04063ef"}, {"k": "say", "t": "Что ты говоришь? Мы обязательно вернёмся, и в полном сборе!", "added": true, "w": "chapaev", "p": "Москва, Ярославский вокзал, сентябрь 1923", "h": "060c7c3b"}, {"k": "say", "t": "Казак — себе под нос:", "added": true, "p": "Москва, Ярославский вокзал, сентябрь 1923", "h": "71d6e867"}, {"k": "say", "t": "Он уже не тот…", "added": true, "w": "kazak", "p": "Москва, Ярославский вокзал, сентябрь 1923", "h": "27affef9"}, {"k": "say", "t": "Мы покажем этим узкоглазым всю силушку русского богатыря!", "added": true, "w": "chapaev", "p": "Москва, Ярославский вокзал, сентябрь 1923", "h": "fbe86116"}, {"k": "say", "t": "Кабинет императора. Марков просит принять его по делу, которое, как он говорит, не терпит отлагательств.", "added": true, "p": "Москва, Кремль, сентябрь 1923", "bg": "kabinet_emperor", "on": ["kryukov", "markov"], "x": {}, "fx": "none", "cg": "", "music": "Московские вечера РП", "e": {"kryukov": "original", "markov": "thinking"}, "id": "berlin", "h": "3db65279"}, {"k": "say", "t": "Ваше Величество, я думаю, что для перевооружения нашей армии и индустриализации нужно связаться со странами, имеющими более высокие технологии. Например, с Веймарской республикой.", "src": 2744, "w": "markov", "e": {"markov": "thinking"}, "p": "Москва, Кремль, сентябрь 1923", "h": "e7ebcfbe"}, {"k": "say", "t": "Согласен, свяжитесь.", "src": 2748, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Москва, Кремль, сентябрь 1923", "h": "f80495fe"}, {"k": "say", "t": "Так точно! Завтра отправлюсь в Берлин для заключения соглашения.", "src": 2750, "w": "markov", "e": {"markov": "happy"}, "p": "Москва, Кремль, сентябрь 1923", "h": "def77f05"}, {"k": "paper", "src": 3669, "mast": "Ведомости России", "date": "октябрь 1923 г.", "hd": "Визит генерала Маркова в Германию", "bd": ["Генерал Марков посетил с официальным визитом Веймарскую республику. В ходе визита достигнуты соглашения о дружбе; решено провести повторную встречу в Москве с участием Крюкова."], "q": [], "p": "Москва, Кремль, сентябрь 1923", "on": [], "x": {}, "h": "973f84f8"}, {"k": "say", "t": "Вашингтон. Росс вторично за год сидит напротив американцев. На этот раз — с цифрами.", "added": true, "p": "Вашингтон, октябрь 1923", "bg": "usa_president_kabinet", "on": ["ross"], "x": {}, "fx": "none", "cg": "", "e": {"ross": "original"}, "id": "kellog", "h": "90d93a48"}, {"k": "say", "t": "Что ж, подведём итоги: Россия предоставляет сырьевые ресурсы, а США взамен помогает или полноценно строит современный промышленный комплекс и предоставляет современную и качественную сельхозтехнику? И этот «контракт» заключается на десять лет с возможностью продления?", "src": 3514, "w": "kellogg", "p": "Вашингтон, октябрь 1923", "h": "7dd015f6"}, {"k": "say", "t": "Всё верно. И да, я прекрасно понимаю, что это очень недешёвое удовольствие и одного сырья, я так понимаю, не хватит. Какую сумму, в долларах, разумеется, нужно доплатить?", "src": 3514, "w": "ross", "e": {"ross": "original"}, "p": "Вашингтон, октябрь 1923", "h": "0bbaa530"}, {"k": "say", "t": "С учётом предложенного сырья — тридцать пять миллионов долларов.", "src": 3514, "w": "kellogg", "p": "Вашингтон, октябрь 1923", "h": "8d3958bb"}, {"k": "say", "t": "Что ж… Сколько примерно заводов будет построено за это время?", "src": 3514, "w": "ross", "e": {"ross": "thinking"}, "p": "Вашингтон, октябрь 1923", "h": "a56cf69e"}, {"k": "say", "t": "Не переживайте, мы обеспечим России мощную промышленную базу.", "src": 3514, "w": "kellogg", "p": "Вашингтон, октябрь 1923", "h": "a4a00700"}, {"k": "say", "t": "Сильно надеюсь.", "src": 3514, "w": "ross", "e": {"ross": "unhappy"}, "p": "Вашингтон, октябрь 1923", "h": "4869800f"}, {"k": "paper", "src": 2760, "mast": "Ведомости России", "date": "октябрь 1923 г.", "hd": "Павлов во главе реформ", "bd": ["Сегодня генерал Павлов получил задание запустить реформу армии. Вместе с Табуретовым он будет работать во благо России."], "q": ["«Как говорил Александр III, у России есть только два союзника — армия и флот. Мы прибавим и авиацию». — Павлов"], "p": "Красноярск, октябрь 1923", "bg": "genshtab", "on": [], "x": {}, "fx": "none", "cg": "", "music": "Хитрость Табуретова", "id": "krasnoyarsk", "h": "68ab6ba6"}, {"k": "say", "t": "Генеральный штаб. Телефон. Табуретов зевает в трубку.", "added": true, "p": "Красноярск, октябрь 1923", "on": ["taburetov"], "x": {}, "e": {"taburetov": "unhappy"}, "h": "2343a295"}, {"k": "say", "t": "Слушаю вас.", "src": 2767, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Красноярск, октябрь 1923", "h": "407cf4c1"}, {"k": "say", "t": "Голос Павлова в трубке: «Пришёл приказ! Реформировать армию. Я жду вас в Красноярске!»", "src": 2768, "p": "Красноярск, октябрь 1923", "h": "bb7bb63f"}, {"k": "say", "t": "Ох, ладно… Реформируем ещё больше армию.", "src": 2770, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Красноярск, октябрь 1923", "h": "f9a854c6"}, {"k": "say", "t": "Табуретов собирает вещи, садится с охраной на поезд Москва — Красноярск и засыпает.", "src": 2770, "p": "Красноярск, октябрь 1923", "bg": "train", "on": [], "x": {}, "cg": "", "h": "1ad88467"}, {"k": "say", "t": "Красноярск. Павлов ждёт на вокзале.", "src": 2771, "p": "Красноярск, октябрь 1923", "bg": "vokzal", "on": ["pavlov", "taburetov"], "x": {"pavlov": 30.0, "taburetov": 70.0}, "cg": "", "e": {"pavlov": "original", "taburetov": "original"}, "h": "256341c9"}, {"k": "say", "t": "Табуретов выходит из вагона в пальто, с чемоданом и двумя охранниками.", "src": 2773, "p": "Красноярск, октябрь 1923", "h": "db783eec"}, {"k": "say", "t": "Здравствуйте, Павлов.", "src": 2773, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Красноярск, октябрь 1923", "h": "59a2045c"}, {"k": "say", "t": "Здравствуй. С охраной ходишь? С чего бы?", "src": 2774, "w": "pavlov", "e": {"pavlov": "original"}, "p": "Красноярск, октябрь 1923", "h": "b2d7f32f"}, {"k": "say", "t": "Павлов протягивает руку.", "src": 2776, "p": "Красноярск, октябрь 1923", "h": "e5c79912"}, {"k": "say", "t": "Да ты что! А четыре покушения на меня говорят, что она мне нужна?", "src": 2779, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Красноярск, октябрь 1923", "h": "4e7000af"}, {"k": "say", "t": "Рукопожатие.", "src": 2780, "p": "Красноярск, октябрь 1923", "h": "9d0e4c74"}, {"k": "say", "t": "Ну что ты, я ж шучу. Пройдём.", "src": 2781, "w": "pavlov", "e": {"pavlov": "happy"}, "p": "Красноярск, октябрь 1923", "h": "c7e9f302"}, {"k": "say", "t": "Павлов свистит. Подъезжает машина.", "src": 2782, "p": "Красноярск, октябрь 1923", "h": "a07bc49a"}, {"k": "say", "t": "Садись.", "src": 2783, "w": "pavlov", "e": {"pavlov": "original"}, "p": "Красноярск, октябрь 1923", "h": "a1763910"}, {"k": "say", "t": "Охране придётся ехать отдельно.", "src": 2789, "w": "pavlov", "e": {"pavlov": "original"}, "p": "Красноярск, октябрь 1923", "h": "b1a00503"}, {"k": "say", "t": "Чемодан с вещами и документами — в багажник. Охрана садится в соседний автомобиль. Павлов — вперёд.", "src": 2790, "p": "Красноярск, октябрь 1923", "h": "d0e49b4f"}, {"k": "say", "t": "Поехали!", "src": 2791, "w": "pavlov", "e": {"pavlov": "original"}, "p": "Красноярск, октябрь 1923", "h": "9356fe9f"}, {"k": "say", "t": "Машина трогается. Автомобиль с охраной — следом.", "added": true, "p": "Красноярск, октябрь 1923", "h": "ad1a6bd4"}, {"k": "say", "t": "Ваше высокопревосходительство. Есть у меня к вам дело, которое не терпит отлагательств.", "src": 2793, "w": "pavlov", "e": {"pavlov": "thinking"}, "p": "Красноярск, октябрь 1923", "h": "4613fdf0"}, {"k": "say", "t": "Слушаю вас.", "src": 2794, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Красноярск, октябрь 1923", "h": "d2917835"}, {"k": "say", "t": "Табуретов закуривает и открывает окно.", "src": 2794, "p": "Красноярск, октябрь 1923", "h": "3057409a"}, {"k": "say", "t": "Вы доверяете монарху?", "src": 2795, "w": "pavlov", "e": {"pavlov": "thinking"}, "p": "Красноярск, октябрь 1923", "h": "e1d4aeda"}, {"k": "say", "t": "Да, во всех смыслах и замыслах.", "src": 2797, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Красноярск, октябрь 1923", "h": "7dfc0a41"}, {"k": "say", "t": "Кроме тех, что вредят стране и отдают её в руки интервентов. То есть таких случаев нет.", "src": 2799, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Красноярск, октябрь 1923", "h": "392d87a4"}, {"k": "say", "t": "Не кажется ли вам, что его вспыльчивость опасна для России?", "src": 2801, "w": "pavlov", "e": {"pavlov": "unhappy"}, "p": "Красноярск, октябрь 1923", "h": "d634e257"}, {"k": "say", "t": "Не думаю. Его остальные качества — расчётливость, ум — закрывают это. Да и его народ выбрал.", "src": 2802, "w": "taburetov", "e": {"taburetov": "thinking"}, "p": "Красноярск, октябрь 1923", "h": "d6c7ee41"}, {"k": "say", "t": "Порой мне кажется, что до добра это не доведёт. А про союз с Америкой я молчу.", "src": 2805, "w": "pavlov", "e": {"pavlov": "unhappy"}, "p": "Красноярск, октябрь 1923", "h": "b5403455"}, {"k": "say", "t": "Вы ж поймите, это для нашего блага. Сотрудничество, выгодное обоим. Общий враг у нас даже есть!", "src": 2809, "w": "taburetov", "e": {"taburetov": "happy"}, "p": "Красноярск, октябрь 1923", "h": "ebfc88a9"}, {"k": "say", "t": "Я с вами согласен, но что потом? Они же обложат нас долгами и заберут Сибирь!", "src": 2815, "w": "pavlov", "e": {"pavlov": "unhappy"}, "p": "Красноярск, октябрь 1923", "h": "41b5be94"}, {"k": "say", "t": "Вы как будто с дуба рухнули! Не обложат! Не смогут: у нас они покупают ресурсы, мы у них — технологии и развитие. Без ресурсов они как без воздуха! А у них ресурсов всё меньше.", "src": 2818, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Красноярск, октябрь 1923", "h": "981f40da"}, {"k": "say", "t": "Вы наивны. Я знаю, о чём говорю: сегодня друг, а завтра вторглись в Сибирь!", "src": 2821, "w": "pavlov", "e": {"pavlov": "angry"}, "p": "Красноярск, октябрь 1923", "h": "f5621160"}, {"k": "say", "t": "Это Павлов говорит громко.", "src": 2821, "p": "Красноярск, октябрь 1923", "h": "a2f1af43"}, {"k": "say", "t": "И что вы хотите от меня? Я будущее не предсказываю, и вы тоже. Мы не можем его знать.", "src": 2822, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Красноярск, октябрь 1923", "h": "d2489716"}, {"k": "say", "t": "Уж кто-кто, а я знаю: как я тогда их гнал отсюда, своими силами. Надо уговорить Алексея не подписывать договора!", "src": 2823, "w": "pavlov", "e": {"pavlov": "angry"}, "p": "Красноярск, октябрь 1923", "h": "98424e8b"}, {"k": "say", "t": "Нет и ещё раз нет! Я за сотрудничество!", "src": 2825, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Красноярск, октябрь 1923", "h": "bfbc208a"}, {"k": "say", "t": "Табуретов докуривает и выкидывает окурок в окно.", "src": 2825, "p": "Красноярск, октябрь 1923", "h": "4780c499"}, {"k": "say", "t": "Если бы им эта Сибирь была нужна, давно бы войну объявили!", "src": 2826, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Красноярск, октябрь 1923", "h": "5cbbb119"}, {"k": "say", "t": "Подумайте, что вы говорите! С кем вы собираетесь сотрудничать? С теми, кто поддержал японцев в русско-японскую?! Кто снабжал немцев?", "src": 2827, "w": "pavlov", "e": {"pavlov": "angry"}, "p": "Красноярск, октябрь 1923", "h": "35373d43"}, {"k": "say", "t": "Но они идут на сотрудничество и мир!", "src": 2828, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Красноярск, октябрь 1923", "h": "5ff7d3f8"}, {"k": "say", "t": "Антанта тоже шла нам навстречу.", "src": 2829, "w": "pavlov", "e": {"pavlov": "unhappy"}, "p": "Красноярск, октябрь 1923", "h": "00a0f854"}, {"k": "say", "t": "Это уже давно в прошлом! Это ещё Николай Второй был. Потому что у нас был общий враг — Центральные державы.", "src": 2830, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Красноярск, октябрь 1923", "h": "9d26bf05"}, {"k": "say", "t": "Да, Табуретов, расстроили вы меня. Где была Антанта, когда Россия погибала?", "src": 2833, "w": "pavlov", "e": {"pavlov": "sad"}, "p": "Красноярск, октябрь 1923", "h": "9074d948"}, {"k": "say", "t": "Мы не должны изолировать себя от мира! Там, где надо, — на Западном фронте!", "src": 2835, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Красноярск, октябрь 1923", "h": "9737a88b"}, {"k": "say", "t": "Чёрта с два! Они убили Россию.", "src": 2838, "w": "pavlov", "e": {"pavlov": "angry"}, "p": "Красноярск, октябрь 1923", "h": "e52ba334"}, {"k": "say", "t": "Это была Германия, Ленин, большевики, Николай Второй и его окружение.", "src": 2839, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Красноярск, октябрь 1923", "h": "c9aaba23"}, {"k": "say", "t": "И Антанта!", "src": 2840, "w": "pavlov", "e": {"pavlov": "angry"}, "p": "Красноярск, октябрь 1923", "h": "2ff08d5f"}, {"k": "say", "t": "США даже в Антанту вступили только тогда, когда им стали угрожать Мексикой!", "src": 2842, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Красноярск, октябрь 1923", "h": "d28555ab"}, {"k": "say", "t": "Не надо! Я-то знаю! Но, видно, договориться с вами не получится…", "src": 2844, "w": "pavlov", "e": {"pavlov": "unhappy"}, "p": "Красноярск, октябрь 1923", "h": "0f006d01"}, {"k": "say", "t": "Только через мой труп.", "src": 2845, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Красноярск, октябрь 1923", "h": "2e69608e"}, {"k": "say", "t": "Да будет так!", "src": 2846, "w": "pavlov", "e": {"pavlov": "angry"}, "p": "Красноярск, октябрь 1923", "h": "b747a2d4"}, {"k": "say", "t": "Удар ножом. Павлов вылетает из машины — как ошпаренный, в неизвестном направлении.", "src": 2846, "p": "Красноярск, октябрь 1923", "on": [], "x": {}, "once": ["shake", "flash"], "music": "Ужас ужасный", "sfx": "hit", "h": "d31e24a3"}, {"k": "say", "t": "«Охрана!» Из второго автомобиля выбегает охрана и увозит Табуретова в больницу.", "src": 2847, "p": "Красноярск, октябрь 1923", "h": "308b8873"}, {"k": "say", "t": "Павлов не бегал. Он сам пришёл на Лубянку и сидит в кабинете Зарывалова.", "src": 3303, "p": "Москва, Лубянка, октябрь 1923", "bg": "kabinet_mgb", "on": ["pavlov"], "x": {}, "fx": "none", "cg": "", "music": "Товарищ полицейский", "e": {"pavlov": "unhappy"}, "id": "lubyanka_pavlov", "h": "1ca0321b"}, {"k": "say", "t": "В дверь стучат. Табуретов — тихо, прихрамывая, с тростью.", "src": 3269, "p": "Москва, Лубянка, октябрь 1923", "h": "cf1b82e0"}, {"k": "say", "t": "«Министерство обороны, можно?»", "src": 3269, "p": "Москва, Лубянка, октябрь 1923", "h": "a81aae55"}, {"k": "say", "t": "Но калеке, да ещё и министру обороны, можно? Я как-никак пострадавший.", "src": 3281, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Москва, Лубянка, октябрь 1923", "on": ["pavlov", "taburetov"], "x": {}, "h": "6ab2d36c"}, {"k": "say", "t": "Здравствуй, Николай.", "src": 3283, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Москва, Лубянка, октябрь 1923", "h": "8adce40c"}, {"k": "say", "t": "Живой…", "src": 3285, "w": "pavlov", "e": {"pavlov": "sad"}, "p": "Москва, Лубянка, октябрь 1923", "h": "ef1ae687"}, {"k": "say", "t": "Ну, я узнал, что у вас тут товарищ Павлов. А вот и он, покуситель.", "src": 3286, "w": "taburetov", "e": {"taburetov": "happy"}, "p": "Москва, Лубянка, октябрь 1923", "h": "e37eaa0a"}, {"k": "say", "t": "Живой! Яд ты выбрал слабый, а я к нему, помимо этого, имел иммунитет!", "src": 3287, "w": "taburetov", "e": {"taburetov": "happy"}, "p": "Москва, Лубянка, октябрь 1923", "h": "58296306"}, {"k": "say", "t": "Я знаю. Поэтому его и выбрал.", "src": 3288, "w": "pavlov", "e": {"pavlov": "original"}, "p": "Москва, Лубянка, октябрь 1923", "h": "326df243"}, {"k": "say", "t": "А зачем вообще меня пырнул-то? Если смерти мне не хотел?", "src": 3292, "w": "taburetov", "e": {"taburetov": "thinking"}, "p": "Москва, Лубянка, октябрь 1923", "h": "f80fbaf2"}, {"k": "say", "t": "Дверь. «Охрана, оставьте меня». Крюков.", "src": 3291, "p": "Москва, Лубянка, октябрь 1923", "h": "37335f6b"}, {"k": "say", "t": "Батюшки, сам царь прибыл.", "src": 3294, "w": "pavlov", "e": {"kryukov": "angry", "pavlov": "unhappy"}, "p": "Москва, Лубянка, октябрь 1923", "on": ["pavlov", "taburetov", "kryukov"], "x": {}, "h": "c0d53b8b"}, {"k": "say", "t": "Я постою, у меня спина после больницы колом.", "src": 3295, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Москва, Лубянка, октябрь 1923", "h": "5b66d2d0"}, {"k": "say", "t": "А-а, вот ты, собака. Не прилизывайся, любитель Романовых. Доложили уже всё.", "src": 3298, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, Лубянка, октябрь 1923", "h": "ddfa9fd3"}, {"k": "say", "t": "Здравствуй, Алексеюшка. Садись.", "src": 3299, "w": "taburetov", "e": {"taburetov": "happy"}, "p": "Москва, Лубянка, октябрь 1923", "h": "d503b004"}, {"k": "say", "t": "Табуретов, убрав трость, хлопает императора по плечу.", "src": 3299, "p": "Москва, Лубянка, октябрь 1923", "h": "ddbfc563"}, {"k": "say", "t": "Здравствуйте, товарищ Зарывалов. Отличная работа!", "src": 3300, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Москва, Лубянка, октябрь 1923", "h": "8e6d2691"}, {"k": "say", "t": "Да я и не пытаюсь.", "src": 3301, "w": "pavlov", "e": {"pavlov": "unhappy"}, "p": "Москва, Лубянка, октябрь 1923", "h": "ab7c5470"}, {"k": "say", "t": "Хах. Сколько бы они меня искали, если б я сам не сдался.", "src": 3303, "w": "pavlov", "e": {"pavlov": "thinking"}, "p": "Москва, Лубянка, октябрь 1923", "h": "33624623"}, {"k": "say", "t": "Ага, здорово. Слава богу, живой, а то уже половину завещания написал.", "src": 3304, "w": "taburetov", "e": {"taburetov": "happy"}, "p": "Москва, Лубянка, октябрь 1923", "h": "028f6625"}, {"k": "say", "t": "Ну ты как всегда — медлишь.", "src": 3306, "w": "pavlov", "e": {"pavlov": "original"}, "p": "Москва, Лубянка, октябрь 1923", "h": "e4a67de9"}, {"k": "say", "t": "Ну ты и гадёныш… А ведь я тебе сердцем доверял, столько прошли… Британцам продался, мразь.", "src": 3307, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, Лубянка, октябрь 1923", "h": "decf6ff9"}, {"k": "say", "t": "Хах, так он ещё был за то, чтобы делегацию посадить. Не, он не за них.", "src": 3309, "w": "taburetov", "e": {"taburetov": "thinking"}, "p": "Москва, Лубянка, октябрь 1923", "h": "f5cb2112"}, {"k": "say", "t": "Верю, верю.", "src": 3310, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Москва, Лубянка, октябрь 1923", "h": "06afbdd8"}, {"k": "say", "t": "Британцам? Ты в своём уме? Вы ведь их так и не задержали.", "src": 3311, "w": "pavlov", "e": {"pavlov": "shocked"}, "p": "Москва, Лубянка, октябрь 1923", "h": "adb69c14"}, {"k": "say", "t": "Ага, а кому? Ты меня за идиота держишь? В стране теракты, везде британцы, а ты, типа, самоволен? Тогда ты ещё глупее. Тогда ты не просто предатель меня — ты предатель Родины. В такой сложный час…", "src": 3315, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, Лубянка, октябрь 1923", "h": "9fa7f697"}, {"k": "say", "t": "А войны с ними нам не нужно было ни сейчас, ни тогда.", "src": 3316, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Москва, Лубянка, октябрь 1923", "h": "8dd32d53"}, {"k": "say", "t": "Фронтовой… А я в штабе сидел, да?", "src": 3317, "w": "pavlov", "e": {"pavlov": "angry"}, "p": "Москва, Лубянка, октябрь 1923", "h": "018f6d9a"}, {"k": "say", "t": "Может, обыщем жильё его на наличие улик, что шпион? Или ещё каких-нибудь?", "src": 3318, "w": "taburetov", "e": {"taburetov": "thinking"}, "p": "Москва, Лубянка, октябрь 1923", "h": "0f6b7baf"}, {"k": "say", "t": "Да пожалуйста. Это уже без меня.", "src": 3320, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Москва, Лубянка, октябрь 1923", "h": "81938a4d"}, {"k": "say", "t": "Я просто хотел, чтобы Россия вновь стала великой…", "src": 3321, "w": "pavlov", "e": {"pavlov": "sad"}, "p": "Москва, Лубянка, октябрь 1923", "h": "83f0c5b9"}, {"k": "say", "t": "Убив своих товарищей? Вот это да… Герой, не иначе.", "src": 3323, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, Лубянка, октябрь 1923", "h": "51f28f08"}, {"k": "say", "t": "Вот и помалкивай, фронтовик херов.", "src": 3324, "w": "pavlov", "e": {"pavlov": "angry"}, "p": "Москва, Лубянка, октябрь 1923", "h": "d364b9b2"}, {"k": "say", "t": "Я не собирался его убивать…", "src": 3325, "w": "pavlov", "e": {"pavlov": "sad"}, "p": "Москва, Лубянка, октябрь 1923", "h": "4ec16c3f"}, {"k": "say", "t": "Николай Александрович, никаких судов. Никаких. В комнатушку и в затылок. Время сейчас военное.", "src": 3327, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, Лубянка, октябрь 1923", "h": "21c3507b"}, {"k": "say", "t": "Убив меня, а кто следующий был бы?! Алексей?! Глюг?!", "src": 3328, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Москва, Лубянка, октябрь 1923", "h": "60616096"}, {"k": "say", "t": "Ты, наверное, и нож в него не совал? И ядом не смазывал, ну, чтобы наверняка? Гениально. Бог накажет тебя, дьявол.", "src": 3331, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, Лубянка, октябрь 1923", "h": "a42a51d1"}, {"k": "say", "t": "Я с ума схожу… И сколько у нас ещё предателей в руководстве? Надо бы проверить на вшивость…", "src": 3334, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Москва, Лубянка, октябрь 1923", "h": "50020f26"}, {"k": "say", "t": "Честно, стоит… Не хватало, чтобы следующий нож был для кого-то последним! Это же конец будет!", "src": 3335, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Москва, Лубянка, октябрь 1923", "h": "cfdd1d83"}, {"k": "say", "t": "Знал бы ты, что у нас на Дону с такими делали…", "src": 3337, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Москва, Лубянка, октябрь 1923", "h": "d02d3d22"}, {"k": "say", "t": "У меня бы ты тоже узнал, что хивинцы или уральцы делали с такими.", "src": 3339, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Москва, Лубянка, октябрь 1923", "h": "c4e6d5ec"}, {"k": "say", "t": "Я знал, что ты перенесёшь яд. Поэтому я взял слабый яд, и взял его мало. Я хотел, чтобы меня просто услышали: союз с Америкой — это опасно для России.", "src": 3340, "w": "pavlov", "e": {"pavlov": "unhappy"}, "p": "Москва, Лубянка, октябрь 1923", "h": "6ac126c7"}, {"k": "say", "t": "А если бы врачи не успели и я бы кровью истёк?! Меня еле откачали, кровь лилась ручьём!", "src": 3344, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Москва, Лубянка, октябрь 1923", "h": "07443ce7"}, {"k": "say", "t": "Он больной? Не, ну он же больной! Ты, сволочь, военный. Чё ты лезешь, куда не требуется?", "src": 3345, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, Лубянка, октябрь 1923", "h": "e26b3924"}, {"k": "say", "t": "Когда ты, Алексей, стал новоизбранным царём, мне пришла телеграмма от американцев. Она в Красноярске, вы её найдёте.", "src": 3349, "w": "pavlov", "e": {"pavlov": "sad"}, "p": "Москва, Лубянка, октябрь 1923", "h": "d187655b"}, {"k": "say", "t": "Я должен был убить вас. Я отказался, но мне пригрозили убийством семьи. Я сделал это и написал письмо, что Алексей мёртв. Но не отправил. Оно так и лежит в Марьине.", "src": 3349, "w": "pavlov", "e": {"pavlov": "sad"}, "p": "Москва, Лубянка, октябрь 1923", "h": "a502eac8"}, {"k": "say", "t": "Да, военный. А ещё я русский. И не хочу, чтоб в Сибири были вновь американские и английские войска.", "src": 3352, "w": "pavlov", "e": {"pavlov": "unhappy"}, "p": "Москва, Лубянка, октябрь 1923", "h": "59bae0b9"}, {"k": "say", "t": "Ты серьёзно думаешь, что я в это поверю? Я лично общался с американскими коллегами. Я больше не намерен его слушать.", "src": 3353, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, Лубянка, октябрь 1923", "h": "fa7031e9"}, {"k": "say", "t": "Так! Отправьте людей и прошерстите там всё до краёв и крыши!", "src": 3354, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Москва, Лубянка, октябрь 1923", "h": "233af4c6"}, {"k": "say", "t": "Алексей… Прошу.", "src": 3355, "w": "pavlov", "e": {"pavlov": "sad"}, "p": "Москва, Лубянка, октябрь 1923", "h": "6737cff1"}, {"k": "say", "t": "А там и доказательства будут. Если они вообще есть.", "src": 3358, "w": "taburetov", "e": {"taburetov": "thinking"}, "p": "Москва, Лубянка, октябрь 1923", "h": "82be328e"}, {"k": "say", "t": "Прежде чем кто-то прикажет всадить мне свинец в грудь — почитайте письмо, пришедшее из Америки.", "src": 3359, "w": "pavlov", "e": {"pavlov": "unhappy"}, "p": "Москва, Лубянка, октябрь 1923", "h": "ecc6db1d"}, {"k": "say", "t": "Значит, ты идиот, которого обманули британцы. Если что, американцы тоже на английском разговаривают. При чём тут Сибирь? У нас сделка с США её вообще не касалась — лишь инвестиций в нашу промышленность за счёт добытых нами ресурсов, отправленных на продажу в США.", "src": 3362, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, Лубянка, октябрь 1923", "h": "c25e24c4"}, {"k": "say", "t": "Алексей, вы наивны как мальчишка.", "src": 3363, "w": "pavlov", "e": {"pavlov": "unhappy"}, "p": "Москва, Лубянка, октябрь 1923", "h": "c50f1489"}, {"k": "say", "t": "А вы — ещё больший наивный идиот.", "src": 3364, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, Лубянка, октябрь 1923", "h": "41160d51"}, {"k": "say", "t": "Павлов послушно встаёт.", "src": 3366, "p": "Москва, Лубянка, октябрь 1923", "h": "9c3e37d0"}, {"k": "say", "t": "Зарывалов кивает конвою. Павлова уводят. Куда — в этой истории не сказано.", "added": true, "p": "Москва, Лубянка, октябрь 1923", "on": ["taburetov", "kryukov"], "x": {}, "h": "dc451b04"}, {"k": "say", "t": "Господа, кофе кто-нибудь хочет? А то я, пока ехал, устал безумно. А ещё над реформами работать надо…", "src": 3378, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Москва, Лубянка, октябрь 1923", "h": "c0885115"}, {"k": "say", "t": "Нет, спасибо.", "src": 3379, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Москва, Лубянка, октябрь 1923", "h": "5300257a"}, {"k": "say", "t": "Ладно. Выпью — и в Генштаб, работать. А то военные реформы так и не доделаны.", "src": 3381, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Москва, Лубянка, октябрь 1923", "h": "f80fc19e"}, {"k": "say", "t": "Ладно, господа, я в Генштаб. Сообщите мне потом как-нибудь там телеграммой по Павлову.", "src": 3392, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Москва, Лубянка, октябрь 1923", "h": "099ac354"}, {"k": "say", "t": "Табуретов выходит и, прихрамывая, с тростью идёт к машине. Охрана уже на месте.", "src": 3392, "p": "Москва, Лубянка, октябрь 1923", "h": "8f06cfc3"}, {"k": "paper", "src": 2498, "mast": "Ведомости России", "date": "октябрь 1923 г.", "hd": "Пограничный конфликт", "bd": ["Сегодня в шесть утра китайские войска пересекли границу в Хасанской области. Пограничные войска под командованием Ческидова быстро отреагировали и отразили китайцев; китайское правительство извинилось перед нашим. Стычка показала эффективность российских войск и дала какой-никакой военный опыт."], "q": [], "p": "Москва, Кремль, ноябрь 1923", "bg": "kabinet_emperor", "on": [], "x": {}, "fx": "none", "cg": "", "music": "Спокойные дни военного", "id": "vostok", "h": "e8f66fc0"}, {"k": "paper", "src": 3397, "mast": "Ведомости России", "date": "ноябрь 1923 г.", "hd": "Серия терактов в Монголии", "bd": ["В Монголии произошла серия терактов: подорваны цементный завод компании «Мунхин Баян Гал», угольная электростанция и завод порошковой металлургии «Талын метал нунтаг». Заведено расследование.", "Российские власти заявляют, что это, вероятнее всего, было спланировано китайскими властями; те отрицают причастность к терроризму. Положение на Востоке всё больше накаляется."], "q": ["Китайская сторона заявила: «Монгольский народ увидел все ужасы русской оккупации и показывает своё сопротивление»."], "p": "Москва, Кремль, ноябрь 1923", "h": "7a4a7f37"}, {"k": "wire", "src": 3460, "from": "Крюков", "to": "Ружику", "tape": ["НАДО НАПРАВИТЬ ПОМОЩЬ В МОНГОЛИЮ", "ТАМ ТЕРАКТЫ И КИТАЙСКИЕ ПОГРОМЫ", "ВСЕ ВОПРОСЫ ПО МОНГОЛИИ ТОВАРИЩУ ЧЕСКИДОВУ ТЧК"], "p": "Москва, Кремль, ноябрь 1923", "h": "aa5137e7"}, {"k": "paper", "src": 4248, "mast": "Ведомости России", "date": "ноябрь 1923 г.", "hd": "Самолёт с пропагандой над Россией", "bd": ["Сегодня в полдень самолёт с китайскими обозначениями пересёк воздушную границу и направлялся к Урге. По пути его сбили российские силы. На месте падения найдены двое погибших пилотов и десять тысяч листовок о том, что Монголия — историческая часть китайской цивилизации, а монголы и китайцы — братья. Китайская сторона заявила, что это провокация России."], "q": ["Из рассказа солдата: «Ну, короче, видим самолёт, а он летит низко-низко. Начали по нему шмалять из винтовок, и тут я сообразил, взял «максимку» и начал очередями ему на путь. Куда-то попал — и он начал падать»."], "p": "Москва, Кремль, ноябрь 1923", "h": "9ba964ab"}, {"k": "say", "t": "Кремль. Марков только что из Берлина.", "added": true, "p": "Москва, Кремль, ноябрь 1923", "on": ["kryukov", "markov"], "x": {"kryukov": 30.0, "markov": 70.0}, "e": {"kryukov": "thinking", "markov": "original"}, "h": "cd8a3e34"}, {"k": "say", "t": "Вопрос такой: не могли бы вы на Дальний Восток отправиться? Китайцы совсем охренели, Ческидова бьют. Надо бы дивизий пять в Монголию. А вас бы я попросил отправиться во Владивосток — курировать торговлю с Америкой да на японцев меч точить.", "src": 4245, "w": "kryukov", "e": {"kryukov": "thinking"}, "p": "Москва, Кремль, ноябрь 1923", "h": "778c51a3"}, {"k": "say", "t": "Прямо сейчас готов! Опыт, полученный в Японии, пригодится.", "src": 4249, "w": "markov", "e": {"markov": "happy"}, "p": "Москва, Кремль, ноябрь 1923", "h": "c2a79c89"}, {"k": "letter", "src": 1529, "head": "Глубокоуважаемому Его Императорскому Величеству Алексею II и всему Великому Русскому Народу", "sign": "Юрий Александрович Луненко, представитель Волынского подполья", "body": ["Ваше Императорское Величество! Примите самые сердечные поздравления от меня и от всех русских людей Волыни. Весть о Вашем избрании на Смоленском соборе долетела до нас, как свет маяка в кромешной тьме.", "Мы здесь, на Волыни, всегда знали, что наш дом — Россия. Нас угнетали, нас стремились оторвать от корней, но никакие репрессии не убили в нас любви к Отечеству.", "Мой покойный отец, которого поляки казнили за верность России, всегда говорил: «Волынь — земля русская. И быть ей в России!»", "Да здравствует Вторая Российская Империя! Да здравствует Император Алексей II!"], "p": "Волынь, осень 1923", "bg": "volhynia_ambar", "on": [], "x": {}, "fx": "dust", "cg": "", "music": "Волынянка", "id": "volyn", "h": "e3bed536"}, {"k": "say", "t": "Тайное собрание в сердце Волыни. Амбар на окраине села, сентябрьский вечер.", "src": 3576, "p": "Волынь, осень 1923", "h": "6e8def17"}, {"k": "say", "t": "Здесь, где обычно хранят сено, собрались десятки людей: крестьяне, рабочие, бывшие солдаты. Все пришли послушать Юрия Луненко.", "src": 3576, "p": "Волынь, осень 1923", "h": "ace56dcf"}, {"k": "say", "t": "Под балкой висит польский флаг — изорванный, в грязи и дырах. Под ним на досках написано: «Геть польського пана!»", "added": true, "p": "Волынь, осень 1923", "h": "c421b150"}, {"k": "say", "t": "В воздухе запах сена, земли и тревожного ожидания. Луненко стоит на старом перевёрнутом бочонке. Свет единственной свечи выхватывает его лицо — измождённое, но исполненное непоколебимой решимости.", "src": 3576, "p": "Волынь, осень 1923", "on": ["lunenko"], "x": {}, "e": {"lunenko": "original"}, "h": "a7ba2333"}, {"k": "say", "t": "Братья! Сёстры! Мы собрались здесь сегодня, потому что не можем больше молчать. Снова над нашей землёй нависла чужая власть.", "src": 3576, "w": "lunenko", "e": {"lunenko": "angry"}, "p": "Волынь, осень 1923", "h": "b3d9a9c0"}, {"k": "say", "t": "Когда-то были немцы, австрийцы, а теперь… теперь снова поляки. Они пришли к нам не как господа — как угнетатели!", "src": 3576, "w": "lunenko", "e": {"lunenko": "unhappy"}, "p": "Волынь, осень 1923", "h": "4d38387b"}, {"k": "say", "t": "Они называют наши земли своими, а нас — своими рабами. Они берут наши деньги, забирают наш хлеб, а взамен дают только кнут и тюрьму.", "src": 3576, "w": "lunenko", "e": {"lunenko": "angry"}, "p": "Волынь, осень 1923", "h": "4ffdd4c9"}, {"k": "say", "t": "Разве за это воевали наши отцы? Разве за это они проливали свою кровь?", "src": 3576, "w": "lunenko", "e": {"lunenko": "angry"}, "p": "Волынь, осень 1923", "h": "6556f95e"}, {"k": "say", "t": "Нет! Господи, помоги!", "src": 3576, "w": "crowd", "p": "Волынь, осень 1923", "h": "da41699c"}, {"k": "say", "t": "Я понимаю ваше горе. Я знаю вашу боль. Потому что она — и моя боль тоже.", "src": 3576, "w": "lunenko", "e": {"lunenko": "sad"}, "p": "Волынь, осень 1923", "h": "e98ed903"}, {"k": "say", "t": "Моего отца убили они! Расстреляли, как собаку, за то, что он любил Россию, за то, что верил в нашу общую Родину!", "src": 3576, "w": "lunenko", "e": {"lunenko": "sad"}, "p": "Волынь, осень 1923", "h": "00a84e5b"}, {"k": "say", "t": "Но с нами наша вера. Вера в то, что справедливость восторжествует!", "src": 3576, "w": "lunenko", "e": {"lunenko": "original"}, "p": "Волынь, осень 1923", "h": "cb576a97"}, {"k": "say", "t": "Луненко делает паузу. Взгляд его становится мягче, но ещё решительнее.", "src": 3576, "p": "Волынь, осень 1923", "e": {"lunenko": "original"}, "h": "42c4a39c"}, {"k": "say", "t": "Но сегодня у нас есть надежда. Не просто надежда, а маяк в этой кромешной тьме! Государь Император Алексей II!", "src": 3576, "w": "lunenko", "e": {"lunenko": "happy"}, "p": "Волынь, осень 1923", "h": "5970f665"}, {"k": "say", "t": "Он объединил Россию. Он собрал её земли. Он показал всему миру, что русский медведь не спит, а ждёт своего часа.", "src": 3576, "w": "lunenko", "e": {"lunenko": "happy"}, "p": "Волынь, осень 1923", "h": "17297ce0"}, {"k": "say", "t": "Это знак! Знак, что он сильный. Знак, что он помнит о нас и вернёт наши земли! Наша Волынь — часть России, и он это знает!", "src": 3576, "w": "lunenko", "e": {"lunenko": "happy"}, "p": "Волынь, осень 1923", "h": "57f0b2b9"}, {"k": "say", "t": "По амбару проходит восторженный шёпот. Несколько человек крестятся.", "src": 3576, "p": "Волынь, осень 1923", "h": "03d2cc50"}, {"k": "say", "t": "Поэтому, друзья, мы должны действовать. Они собирают с нас налоги, чтобы строить свои дворцы и держать в тюрьмах таких, как мы!", "src": 3576, "w": "lunenko", "e": {"lunenko": "angry"}, "p": "Волынь, осень 1923", "h": "52a3ff48"}, {"k": "say", "t": "С завтрашнего дня ни один грош, ни одна копейка не должна попасть в их казну! Бойкотируйте налоги! Скажите «нет!» их сборщикам!", "src": 3576, "w": "lunenko", "e": {"lunenko": "angry"}, "p": "Волынь, осень 1923", "h": "84cf8f9e"}, {"k": "say", "t": "Пусть видят, что здесь, на Волыни, они ничего не получат! Это будет наш маленький удар, но в Варшаве его услышат, как гром!", "src": 3576, "w": "lunenko", "e": {"lunenko": "happy"}, "p": "Волынь, осень 1923", "h": "92c35278"}, {"k": "say", "t": "Да их-то там много! Власти-то! Что нам делать, если придут с оружием?", "src": 3576, "w": "peasant", "p": "Волынь, осень 1923", "h": "19c8fdfc"}, {"k": "say", "t": "А мы тоже не с пустыми руками. Подпольщики будут защищать вас!", "src": 3576, "w": "lunenko", "e": {"lunenko": "thinking"}, "p": "Волынь, осень 1923", "h": "f05c5c21"}, {"k": "say", "t": "Но главное — наша воля. Она должна быть сильнее их штыков! Наш народ должен показать им, что он не сломлен. Мы не рабы, мы — русские!", "src": 3576, "w": "lunenko", "e": {"lunenko": "angry"}, "p": "Волынь, осень 1923", "h": "4e148e0d"}, {"k": "say", "t": "Готовьтесь, братья, к возвращению домой. К тому дню, когда над нашей землёй снова будет развеваться флаг России. Мы верим в нашего Государя. Мы верим в нашу Родину.", "src": 3576, "w": "lunenko", "e": {"lunenko": "happy"}, "p": "Волынь, осень 1923", "h": "d2055b0a"}, {"k": "say", "t": "А теперь — за работу! Да здравствует Император Алексей II! Да здравствует Волынь! Да здравствует Россия!", "src": 3576, "w": "lunenko", "e": {"lunenko": "happy"}, "p": "Волынь, осень 1923", "h": "8fbc99c5"}, {"k": "say", "t": "Амбар взрывается криками «Ура!» и «Слава России!»", "src": 3576, "p": "Волынь, осень 1923", "h": "2828de87"}, {"k": "paper", "src": 3584, "mast": "Варшавский Вестник", "date": "Восточные Кресы", "hd": "Налоговый бойкот", "bd": ["Призывы подпольщиков к налоговому бойкоту достигли цели: поступление средств в Варшаву почти прекратилось. Сборщиков налогов встречают открытым сопротивлением, а тех, кто пытается выбить деньги силой, обстреливают снайперы."], "q": ["В правительстве и высших военных кругах звучат призывы ввести в мятежный регион армию."], "p": "Волынь, осень 1923", "on": [], "x": {}, "h": "e5c31be0"}, {"k": "say", "t": "Осенний день. Премьер-министр Польши Владислав Г   }
  const CPS = [10, 15, 20, 30, 40, 50, 65, 85, 120, Infinity]; // characters per second for the speed setting 1..10
  const seen = new Set(store.get('seen', []));
  let seenTimer = null;
  function markSeen(i) {

  }

  const sceneOf = (i) => { let label = SCRIPT.scenes[0].label; for (const sc of SCRIPT.scenes) { if (at(sc.id) <= i) label = sc.label; } return label; };
  function lineText(s) {
    if (s.k === 'say') return (s.w ? CH[s.w].n + ': ' : '') + s.t;
    if (s.k === 'paper') return (s.mast || 'Ведомости России') + ': ' + s.hd;

  }
  // The autosave (every step; «Продолжить» on the title screen) remembers the step and also the line itself: when the

  function snapshot() {

  const CARD_HINT = { paper: (s) => s.mast || 'Ведомости России', wire: () => 'Телеграмма', letter: () => 'Письмо', doc: () => 'Документ' };

  // A long card shrinks its type until it fits the space it has: no scrolling, nothing cut off.
  // Measured by the card's own height: its tilt and its drop-in animation swell the layer's scroll height by a few
  // px (the end card showed a scroll bar for 3 px, 14.10), so 1.5% of the layer is kept free for the tilted corners.
  function fitCard() {
    const art = layer.firstElementChild;

  // A line longer than the box holds is shown in parts, as in Ren'Py games: each part fills the box, a click

  const CUTS = [/(?<=[.!?…][»"')]*)\s+/, /(?<=[,;:])\s+|\s+(?=—)/, /\s+/];

  function paginate(el, text) {

    if (fits(text)) return [text];
    // a window too small for even one word (a hidden tab, a collapsed pane): leave the line whole, repage() cuts it
    // when the window gets its size

    };

  let pages = [''], pg = 0;

  }
  // Moves to the next part of the current line; false when the line has no more parts.

  }

  // ---------- the chapter shelf ----------
  // One chapter so far; the list is ready for more: each entry is a `title` line (name, years, cover, theme).
  // after the last chapter a card that says «Скоро» (the organizer, 17.10): nothing to start, only a promise
  const CHAPTERS = [{ id: SCRIPT.title.cover || 'prolog', t: SCRIPT.title, cover: COVERS[SCRIPT.title.cover] || '' }, { id: 'soon', soon: true, t: { name: 'Скоро', span: '', theme: '' } }];
  let shelfOpen = false, shelfAt = 0;
  let mark = -1;  // the step left behind by a jump through «Сцены» (17.10)
  const sh = $('sh');
  // Between the title and the shelf, both ways (the organizer, 17.10: not «моментально», the march must not cut straight
  // into another tune): the music goes, the curtain falls with a short loading line, the other screen is drawn under it.
  function loadThen(apply) {
    music.set('');
    clearTimeout(curtainTimer);

    curtain.classList.add('on');

  }

  function shelfScreen() {
