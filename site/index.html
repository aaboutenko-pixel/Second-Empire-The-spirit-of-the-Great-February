    $('tm').hidden = true; menu.hidden = true; menu.innerHTML = ''; layer.hidden = true; layer.innerHTML = ''; box.innerHTML = '';
    const ch = CHAPTERS[shelfAt], last = store.get('auto', null), done = !!store.get('done', {})[ch.id];
    music.set(ch.t.theme || SHELF_MUSIC || '');
    const btns = [];
    if (ch.soon) { /* no buttons: there is nothing to start yet */ } else {
    if (last && !done) btns.push({ t: 'Продолжить', on: () => startChapter(() => loadThen(() => restore(last))) });
    btns.push({ t: last && !done ? 'Сначала' : 'Начать', ghost: !!(last && !done), on: () => startChapter(() => loadThen(() => jumpTo('restart'))) });
    if (done) btns.push({ t: 'Титры', ghost: true, on: () => startChapter(() => { const i = steps.findIndex((s) => s.k === 'credits'); if (i >= 0) loadThen(() => goNow(i)); }) });
    }
    const chevron = (d) => '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + (d < 0 ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7') + '" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    sh.innerHTML = '<h2 class="sh-h">Главы</h2>'
      + (shelfAt > 0 ? '<button class="sh-arrow l" type="button" aria-label="Предыдущая глава">' + chevron(-1) + '</button>' : '')
      + (ch.soon ? '<div class="sh-card soon" aria-label="Скоро"><span>Скоро</span></div>'
                 : '<div class="sh-card" role="button" tabindex="0" aria-label="' + esc(ch.t.name) + '">' + (ch.cover ? '<img src="' + ch.cover + '" alt="">' : '') + '</div>')
      + (shelfAt < CHAPTERS.length - 1 ? '<button class="sh-arrow r" type="button" aria-label="Следующая глава">' + chevron(1) + '</button>' : '')
      + '<p class="sh-info"><b>' + esc(ch.t.span) + '</b></p>'  // only the years: the organizer wants no «не начато / сцена N» here (17.10)
      + '<nav class="sh-nav">' + btns.map((b, n) => '<button class="sh-btn' + (b.ghost ? ' ghost' : '') + '" type="button" data-n="' + n + '">' + esc(b.t) + '</button>').join('') + '</nav>'
      + '<button class="sh-back" type="button">← На титул</button>';
    sh.querySelectorAll('.sh-btn').forEach((el) => el.addEventListener('click', (e) => { e.stopPropagation(); btns[+el.dataset.n].on(); }));
    if (btns.length) sh.querySelector('.sh-card').addEventListener('click', (e) => { e.stopPropagation(); btns[0].on(); });
    const al = sh.querySelector('.sh-arrow.l'), ar = sh.querySelector('.sh-arrow.r');
    if (al) al.addEventListener('click', (e) => { e.stopPropagation(); shelfMove(-1); });
    if (ar) ar.addEventListener('click', (e) => { e.stopPropagation(); shelfMove(1); });
    sh.querySelector('.sh-back').addEventListener('click', (e) => { e.stopPropagation(); shelfToTitle(); });
  }
  // a swipe across the shelf turns the page
  let swipeX = null;
  sh.addEventListener('touchstart', (e) => { swipeX = e.touches[0].clientX; }, { passive: true });
  sh.addEventListener('touchend', (e) => {
    if (swipeX === null) return;
    const dx = e.changedTouches[0].clientX - swipeX; swipeX = null;
    if (Math.abs(dx) > 40) shelfMove(dx < 0 ? 1 : -1);
  }, { passive: true });

  // «Поделиться» (the organizer, 17.10: «нам нужна аудитория») and «Отзыв» (a chat with the organizer). Inside Telegram
  // the links open through the app; in a browser, the share sheet where there is one, else Telegram's share page.
  const GAME_URL = () => LINKS.share || location.href.split(/[?#]/)[0];
  function openLink(url) {
    if (TG && TG.openTelegramLink && /^https:\/\/t\.me\//.test(url)) { try { TG.openTelegramLink(url); return; } catch (e) { /* fall through */ } }
    window.open(url, '_blank', 'noopener');
  }
  function shareGame() {
    const url = GAME_URL(), text = 'Second Empire — визуальная новелла по ролевой «Российская империя»';
    if (!TG && navigator.share) { navigator.share({ title: 'Second Empire', text, url }).catch(() => {}); return; }
    openLink('https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text));
  }

  function titleScreen() {
    setBg(-1);
    setCg(-1);
    setCast(-1, null);
    fx.set('motes');
    music.set(musicOf(-1));
    stage.classList.add('title');
    stage.classList.remove('dim', 'cards', 'decide', 'shelf');
    menu.hidden = true; menu.innerHTML = '';
    layer.hidden = true; layer.innerHTML = '';
    box.innerHTML = '';
    const last = store.get('auto', null);
    if (last && last.cur < steps.length) warm(last.cur);
    warm(0);
    const items = (last ? [{ t: 'Продолжить', on: () => { goFull(); loadThen(() => restore(last)); } }] : [])  // the loading curtain, as everywhere (17.10)
      .concat([{ t: 'Начать', on: () => { goFull(); openShelf(); } }])
      .concat(bioOpen.size ? [{ t: 'Персонажи', on: () => openGM('bios') }] : [])  // its own screen, once someone has been met (17.10)
      .concat([{ t: 'Настройки', on: () => openGM('prefs') }, { t: 'Выйти', on: exitGame }]);
    CHAPTERS.forEach((ch) => { if (ch.cover) { const im = new Image(); im.src = ch.cover; } });  // the cover is ready before the shelf opens
    const tm = $('tm');
    if (!music.unlocked()) {
      tm.innerHTML = '<div class="tm-gate"><span>Нажмите, чтобы войти</span></div>';
      tm.querySelector('.tm-gate').addEventListener('click', (e) => { e.stopPropagation(); goFull(); titleScreen(); });
      tm.hidden = false;
      return;
    }
    tm.innerHTML = '<div class="tm-lamp"></div><div class="tm-scrim"></div><div class="tm-vig"></div>'
      + (LOGO ? '<h1 class="tm-h" style="--logo:url(&quot;' + LOGO + '&quot;)"><div class="tm-burst"></div>'
                + '<img class="tm-logo" src="' + LOGO + '" alt="Second Empire — The Spirit of the Great February"><div class="tm-glint"></div></h1>'
              : '<h1 class="tm-h tm-name">' + esc(SCRIPT.title.name) + '</h1>')
      + '<nav class="tm-nav" aria-label="Главное меню">'
      + items.map((b, n) => '<button class="tm-btn" type="button" data-n="' + n + '">' + esc(b.t) + '</button>').join('') + '</nav>'
      + '<p class="tm-links"><button class="tm-link" type="button" data-link="share">Поделиться</button><span>·</span><button class="tm-link" type="button" data-link="feedback">Отзыв</button></p>'
      + '<div class="tm-fade"></div>';
    tm.querySelectorAll('.tm-btn').forEach((el) => el.addEventListener('click', (e) => { e.stopPropagation(); items[+el.dataset.n].on(); }));
    tm.querySelectorAll('.tm-link').forEach((el) => el.addEventListener('click', (e) => { e.stopPropagation(); if (el.dataset.link === 'share') shareGame(); else openLink(LINKS.feedback); }));
    tm.hidden = false;
  }


  // backdrop, illustration, effect and cast of step i
  function scenery(i) {
    const s = steps[i];
    setBg(i);
    setCg(i);
    warm(i);
    fx.set(fxOf(i));
    setCast(i, s.k === 'say' ? s.w : null);
  }

  function render() {
    const fromBehind = atEnd;  // came back from the next step: a line in parts opens at its last part
    atEnd = false;
    if (cur < 0) { leaveRoll(); if (shelfOpen) shelfScreen(); else titleScreen(); return; }
    const s = steps[cur];
    stage.classList.remove('title', 'shelf');
    $('tm').hidden = true;
    if (s.k === 'credits') { rollCredits(s); return; }  // not autosaved: «Продолжить» opens on the end card, not inside the roll
    leaveRoll();
    markSeen(cur);
    openBios(cur);
    store.set('auto', snapshot());
    music.set(musicOf(cur));
    if (forward && !mode.skip) playOnce(s);
    forward = false;
    layer.hidden = true; layer.innerHTML = '';
    menu.hidden = true; menu.innerHTML = '';
    stage.classList.toggle('dim', ['choice', 'fork', 'end', 'letter', 'doc'].includes(s.k));
    stage.classList.toggle('cards', !!CARD_HINT[s.k]);
    stage.classList.toggle('decide', ['fork', 'end'].includes(s.k));  // a card with buttons under it
    scenery(cur);

    if (CARD_HINT[s.k]) {
      layer.innerHTML = cardHTML(s, cur);
      layer.hidden = false;
      fitCard();
      narrBox(CARD_HINT[s.k](s), s.t || 'Нажмите, чтобы листать дальше.', true);
      shown();
      return;
    }

    if (s.k === 'say') {
      const c = s.w ? CH[s.w] : null, role = c ? roleOf(cur, s.w) : '';
      box.innerHTML = '<div class="who">' + (c ? '<span class="nm" style="--c:' + c.c + '">' + esc(c.n) + '</span>' + (role ? '<span class="role">' + esc(role) + '</span>' : '') : '') + placeTag() + '</div>'
        + '<p class="tx' + (c ? '' : ' narr') + '" id="tx" aria-hidden="true"></p>'
        + '<span class="sr" aria-live="polite">' + esc((c ? c.n + ': ' : '') + s.t) + '</span>'
        + '<span class="more" id="more" hidden>▾</span>';
      pages = paginate($('tx'), s.t);
      pg = fromBehind ? pages.length - 1 : 0;
      showPage();
      return;
    }

    setSkip(false);
    clearTimeout(autoTimer);
    if (s.k === 'choice') {
      narrBox('Развилка', s.ask, false);
      menu.innerHTML = s.opts.map((o) => '<button class="opt" type="button" data-go="' + esc(o.go) + '">' + esc(o.t) + '</button>').join('');
      menu.hidden = false;
      menu.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => jumpTo(b.dataset.go)));
      return;
    }
    if (s.k === 'fork') {
      noteCard('<span class="stamp">' + esc(s.stamp) + '</span>', '', s.paras, s.note);
      buttonsBox('Развилка', scriptButtons(s.buttons));
      return;
    }
    if (s.k === 'end') {
      noteCard('<div class="mast">ВЕДОМОСТИ РОССИИ</div><div class="dl"><span>' + esc(s.date) + '</span><span></span></div>', s.title, s.paras, s.note);
      buttonsBox(SCRIPT.title.name, scriptButtons(s.buttons));
    }
  }

  function advance() {
    if (cur < 0 || !gm.hidden || curtain.classList.contains('on')) return;
    if (mode.skip) setSkip(false);
    const s = steps[cur];
    if (s.k === 'credits') { toTitle(); return; }
    if (timer) { finishType(); return; }
    if (nextPage()) return;
    if (passable(s)) go(cur + 1);
  }

  // ---------- credits: the cast roll ----------
  // The characters pass upward over the black stage (the card `credits`, scenario.py): each with a portrait, the name,
  // the caption and who played him; the logo last. A click or a key skips it; at the end, the title screen.
  const roll = $('roll');
  let rollAnim = null;
  // The portrait of a character: his first look (the one worn) in its `original` emotion, the figure at Z of its stage
  // size, placed so the face centre — 28 % of the stage height for the whole cast (CH top/h, measure_faces.py) — sits
  // a little below the middle of the frame: room for the cap above, the shoulders below (the organizer, 16.10: at 0.72
  // with the face in the middle the heads were «приплюснуты», crammed into the frame). A shadow (Wrangel) stays a shadow.
  const FRAME_H = 44, PORTRAIT_Z = 1.0, FACE_AT = 0.5;  // cqh; the figure's scale; where in the frame the face centre sits
  function portraitOf(who) {
    const c = CH[who];
    if (!c || !(c.looks || c.shade)) return null;
    const sh = !c.looks && c.shade, src = sh ? sh.from : who;
    const got = spriteFor(src, Object.keys(CH[src].looks)[0]);
    if (!got.sprite) return null;
    const emos = got.sprite.emotions, e = (sh && emos[sh.e]) ? sh.e : (emos.original ? 'original' : Object.keys(emos)[0]);
    const placeAt = CH[src].looks[got.look] || { top: 5, h: 100 }, pt = got.sprite.pt || 0;
    const full = placeAt.h / (1 - pt), top = placeAt.top - pt * full;
    return { src: emos[e], cls: (sh ? ' shade' : '') + (sh && sh.flip ? ' flip' : ''), h: PORTRAIT_Z * full, w: PORTRAIT_Z * full * (got.sprite.ar || 0.8), top: FRAME_H * FACE_AT - PORTRAIT_Z * (28 - top) };
  }
  function rowHTML(r) {
    if (r.h !== undefined) return '<li class="cr-h">' + esc(r.h) + '</li>';
    if (r.t !== undefined) return '<li class="cr-t">' + esc(r.t) + '</li>';
    const c = CH[r.l], p = c ? portraitOf(r.l) : null, role = c ? roleOf(cur, r.l) : '';
    if (!p) return '<li class="cr nopic"><span class="cr-nm plain">' + esc(c ? c.n : r.l) + '</span><span class="cr-pl">' + esc(r.r) + '</span></li>';
    // photos go left, right, left… and lean a little differently each time, as prints laid out on a table
    const n = rowN++, tilt = [-3.4, 2.8, -2.2, 3.6][n % 4];
    const photo = '<figure class="ph" style="--tilt:' + tilt + 'deg"><div class="ph-img' + p.cls + '"><img alt="" src="' + p.src + '" style="height:' + p.h.toFixed(2) + 'cqh;width:' + p.w.toFixed(2) + 'cqh;top:' + p.top.toFixed(2) + 'cqh"></div>'
      + '<figcaption class="ph-sig">' + esc(c.n) + '</figcaption></figure>';
    // beside it: the full name from the script (or the surname), the caption, and who voiced him (the organizer, 16.10:
    // «снизу будет написано Ружик, справа — имя персонажа, его должность и кто его озвучивал»)
    // the full name is split: the given name and patronymic small above, the surname large (a lowercase particle, «фон», stays
    // with the surname); without a full name the surname alone
    const words = (r.f || c.n).trim().split(/\s+/), sur = [words.pop()];
    while (words.length && /^[a-zа-яё]/.test(words[words.length - 1])) sur.unshift(words.pop());
    const text = '<div class="cr-txt">' + (words.length ? '<span class="cr-given">' + esc(words.join(' ')) + '</span>' : '')
      + '<span class="cr-nm" style="--c:' + c.c + '">' + esc(sur.join(' ')) + '</span>' + (role ? '<span class="cr-role">' + esc(role) + '</span>' : '')
      + '<span class="cr-pl">' + esc(r.r) + '</span></div>';
    return '<li class="cr' + (n % 2 ? ' r' : '') + '">' + photo + text + '</li>';
  }
  let rowN = 0;
  function rollCredits(s) {
    stopAll();
    // the game is played through: the autosave goes, so the title offers only «Начать» (the organizer, 16.10: «Продолжить»
    // after the credits would only lead back into the credits)
    store.drop('auto');
    const done = store.get('done', {}); done[CHAPTERS[0].id] = true; store.set('done', done);  // the shelf shows «пройдено»
    music.set(musicOf(cur));
    rowN = 0;
    roll.innerHTML = '<ul class="roll-list">' + (s.title ? '<li class="cr-title">' + esc(s.title) + '</li>' : '') + s.rows.map(rowHTML).join('')
      + (LOGO ? '<li class="cr-logo"><img src="' + LOGO + '" alt="Second Empire"></li>' : '') + '</ul>';
    stage.classList.add('roll-on');
    const list = roll.firstElementChild;
    const run = () => {
      if (steps[cur] !== s || !stage.classList.contains('roll-on')) return;
      const H = stage.clientHeight, dist = list.offsetHeight + H;  // from under the stage to above it
      if (!H) return;
      // the roll climbs 12 % of the stage height a second: a character on screen for about eight seconds (17 % in the first
      // version was «слишком быстро», 16.10); never under 30 s
      rollAnim = list.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(' + (-dist) + 'px)' }],
        { duration: Math.max(30000, dist / H / 0.12 * 1000), easing: 'linear', fill: 'forwards', delay: 900 });
      rollAnim.onfinish = () => { rollAnim = null; if (steps[cur] === s) toTitle(); };
    };
    // the pictures set the list's height: wait for them, but not for long
    const imgs = Array.from(roll.querySelectorAll('img'));
    Promise.race([Promise.all(imgs.map((im) => im.decode().catch(() => {}))), new Promise((ok) => setTimeout(ok, 1500))]).then(run);
  }
  function leaveRoll() {
    if (!stage.classList.contains('roll-on') && !roll.innerHTML) return;
    if (rollAnim) { rollAnim.cancel(); rollAnim = null; }
    stage.classList.remove('roll-on');
    roll.innerHTML = '';
  }

  // ---------- game menu: history, settings, back to the title ----------
  const gm = $('gm'), gmBody = $('gmBody');
  let gmTab = null;
  function openGM(tab) {
    setSkip(false); clearTimeout(autoTimer); finishTypeQuiet();
    gmTab = tab; gm.hidden = false; stage.classList.add('gm-open'); drawGM();
  }
  function finishTypeQuiet() { if (timer) { stopType(); const el = $('tx'); if (el) el.textContent = full; const m = $('more'); if (m) m.hidden = false; } }
  function closeGM() {
    if (gm.hidden) return;
    gm.hidden = true; stage.classList.remove('gm-open'); gmTab = null;
    if (mode.auto && cur >= 0) scheduleAuto();
  }
  function drawGM() {
    gm.querySelectorAll('[data-gm]').forEach((b) => {
      b.classList.toggle('on', b.dataset.gm === gmTab);
      b.hidden = (cur < 0 && ['history', 'scenes', 'title'].includes(b.dataset.gm))  // on the title itself these make no sense
        || (gmTab === 'bios' && b.dataset.gm !== 'close');  // «Персонажи» is its own screen from the title: only «Вернуться» beside it
    });
    if (gmTab === 'history') {
      const rows = hist.concat([cur]).filter((i) => i >= 0).map((i) => {
        const s = steps[i];
        if (s.k === 'say') return s.w ? '<p class="hl"><b style="--c:' + CH[s.w].c + '">' + esc(CH[s.w].n) + '</b>' + esc(s.t) + '</p>' : '<p class="hl narr">' + esc(s.t) + '</p>';
        if (CARD_HINT[s.k] || s.k === 'choice') return '<p class="hl card">' + esc(lineText(s)) + '</p>';
        return '';
      }).join('');
      gmBody.innerHTML = '<h2 class="gm-h">История</h2><div class="hist">' + (rows || '<p class="hl narr">Пока пусто.</p>') + '</div>';
      gmBody.scrollTop = gmBody.scrollHeight;
      return;
    }
    gmBody.classList.toggle('fixed', gmTab === 'bios');  // the card fills the body; only its text column scrolls
    if (gmTab === 'bios') { drawBios(); return; }
    if (gmTab === 'scenes') {  // jump straight to a scene instead of clicking through (17.10: was a drop-down at the top)
      const now = sceneNow();
      // reached = its first step has been read (the `seen` marks); the current scene always counts
      const reached = (sc) => !LOCKED || sc.id === now || seen.has(steps[at(sc.id)].h);
      gmBody.innerHTML = '<h2 class="gm-h">Сцены</h2><div class="scenes">'
        + (mark >= 0 && mark !== cur ? '<button type="button" class="sc mark" data-scene="__mark">← Туда, где остановился</button><span style="flex-basis:100%"></span>' : '')
        + SCRIPT.scenes.map((sc, n) => reached(sc)
          ? '<button type="button" class="sc' + (sc.id === now ? ' on' : '') + '" data-scene="' + esc(sc.id) + '">' + esc(sc.label) + '</button>'
          : '<button type="button" class="sc off" disabled aria-label="Сцена ' + (n + 1) + ', ещё не открыта">' + (n + 1) + ' · · ·</button>').join('') + '</div>';
      const on = gmBody.querySelector('.sc.on'); if (on) on.scrollIntoView({ block: 'center' });
      return;
    }
    // settings
    gmBody.innerHTML = '<h2 class="gm-h">Настройки</h2>'
      + '<label class="pref"><span>Скорость текста</span><input type="range" min="1" max="10" step="1" data-pref="speed" value="' + prefs.speed + '"></label>'
      + '<label class="pref"><span>Задержка авточтения</span><input type="range" min="1" max="10" step="1" data-pref="auto" value="' + prefs.auto + '"></label>'
      + '<label class="pref"><span>Громкость музыки</span><input type="range" min="0" max="10" step="1" data-pref="music" value="' + prefs.music + '"></label>'
      + '<label class="pref chk"><input type="checkbox" data-pref="mute"' + (prefs.mute ? ' checked' : '') + '><span>Без музыки</span></label>'
      + '<label class="pref chk"><input type="checkbox" data-pref="skipUnseen"' + (prefs.skipUnseen ? ' checked' : '') + '><span>Пропускать и непрочитанный текст</span></label>'
      + ((document.fullscreenEnabled || (TG && TG.requestFullscreen)) ? '<button type="button" class="pg" data-act="fullscreen">' + ((document.fullscreenElement || (TG && TG.isFullscreen)) ? 'Выйти из полного экрана' : 'Полный экран') + '</button>' : '');
  }
  gm.addEventListener('click', (e) => {
    e.stopPropagation();
    const nav = e.target.closest('[data-gm]');
    if (nav) {
      const t = nav.dataset.gm;
      if (t === 'close') closeGM(); else if (t === 'title') { if (cur < 0) closeGM(); else toTitle(); } else { gmTab = t; drawGM(); }
      return;
    }
    const bw = e.target.closest('[data-bio]'), bl = e.target.closest('[data-look]'), be = e.target.closest('[data-emo]');
    if (bw) { bioSel.who = bw.dataset.bio; bioSel.look = null; bioSel.e = 'original'; drawBios(); return; }
    if (bl) { bioSel.look = bl.dataset.look; drawBios(); return; }
    if (be) { bioSel.e = be.dataset.emo; drawBios(); return; }
    const sc = e.target.closest('[data-scene]');
    if (sc) {  // a jump through the loading curtain; the place left behind is kept for «Туда, где остановился»
      closeGM(); stopAll(); const i = at(sc.dataset.scene);
      if (sc.dataset.scene === '__mark') { const m = mark; mark = -1; loadThen(() => go(m)); }
      else { if (cur >= 0 && i !== cur) mark = cur; loadThen(() => go(i)); }
      stage.focus(); return;
    }
    const act = e.target.closest('[data-act="fullscreen"]');
    if (act) {
      if (TG && TG.requestFullscreen) { if (TG.isFullscreen) { try { TG.exitFullscreen(); } catch (e) {} } else { prefs.fullscreen = true; goFull(); } }
      else if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else { prefs.fullscreen = true; goFull(); }
      setTimeout(drawGM, 300);
      return;
    }
  });
  gm.addEventListener('input', (e) => {
    const k = e.target.dataset.pref;
    if (!k) return;
    prefs[k] = e.target.type === 'checkbox' ? e.target.checked : +e.target.value;
    store.set('prefs', prefs);
    if (k === 'music' || k === 'mute') {
      $('qm').querySelector('[data-q="sound"]').classList.toggle('muted', !!prefs.mute);
      music.sync();
    }
  });

  // ---------- quick menu ----------
  $('qm').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b || cur < 0) return;
    e.stopPropagation();
    const q = b.dataset.q;
    if (q === 'back') back();
    else if (q === 'history') openGM('history');
    else if (q === 'scenes') openGM('scenes');
    else if (q === 'skip') setSkip(!mode.skip);
    else if (q === 'auto') setAuto(!mode.auto);
    else if (q === 'hide') { stage.classList.add('clean'); clearTimeout(autoTimer); }
    else if (q === 'sound') setMute(!prefs.mute);
    else if (q === 'prefs') openGM('prefs');
  });

  // ---------- mouse and keys ----------
  stage.addEventListener('click', (e) => {
    if (stage.classList.contains('clean')) { stage.classList.remove('clean'); if (mode.auto) scheduleAuto(); return; }
    if (e.target.closest('button, a, select, .layer, .gm, .qm, .sh')) return;
    advance();
  });
  // A click on a card is the card's alone: advancing replaces the card, and the stage's handler below would no longer
  // see the click as one inside the card (its target is gone from the page) and advance a second time — every
  // card that followed a card was skipped (the second OGPU order, 14.10).
  layer.addEventListener('click', (e) => { e.stopPropagation(); if (!e.target.closest('button, a')) advance(); });
  stage.addEventListener('contextmenu', (e) => { e.preventDefault(); if (!gm.hidden) closeGM(); else if (cur >= 0) openGM('prefs'); });
  let wheelAt = 0;
  stage.addEventListener('wheel', (e) => {
    if (!gm.hidden || cur < 0) return;
    const now = Date.now();
    if (now - wheelAt < 250) return;
    wheelAt = now;
    if (e.deltaY < 0) back(); else if (e.deltaY > 0) advance();
  }, { passive: true });
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.key === 'Escape') { e.preventDefault(); if (!gm.hidden) closeGM(); else if (cur >= 0) openGM('prefs'); else if (shelfOpen) shelfToTitle(); return; }
    if (!gm.hidden) return;
    if (stage.classList.contains('clean')) { e.preventDefault(); stage.classList.remove('clean'); return; }
    if (cur < 0 && shelfOpen) {
      if (e.key === 'ArrowLeft') shelfMove(-1); else if (e.key === 'ArrowRight') shelfMove(1);
      else if ((e.key === ' ' || e.key === 'Enter') && !(e.target.closest && e.target.closest('button'))) { const b = sh.querySelector('.sh-btn'); if (b) b.click(); }
      else return;
      e.preventDefault(); return;
    }
    if (cur < 0) { if ((e.key === ' ' || e.key === 'Enter') && $('tm').querySelector('.tm-gate')) { e.preventDefault(); goFull(); titleScreen(); } return; }
    const onControl = e.target.closest && e.target.closest('button, a');
    const key = e.key.toLowerCase();
    if ((e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'PageDown') && !onControl) { e.preventDefault(); advance(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'Backspace') { e.preventDefault(); back(); }
    else if (e.key === 'Tab') { e.preventDefault(); setSkip(!mode.skip); }
    else if (e.key === 'Control' && !e.repeat && !mode.skip) { setSkip(true); mode.ctrl = true; }
    else if (key === 'a' || key === 'ф') setAuto(!mode.auto);
    else if (key === 'h' || key === 'р') { stage.classList.add('clean'); clearTimeout(autoTimer); }
    else if (key === 'm' || key === 'ь') setMute(!prefs.mute);
  });
  document.addEventListener('keyup', (e) => { if (e.key === 'Control' && mode.ctrl) setSkip(false); });
  window.addEventListener('blur', () => { if (mode.ctrl) setSkip(false); });

  $('qm').querySelector('[data-q="sound"]').classList.toggle('muted', !!prefs.mute);

  // deep link for testing: #<scene id> opens that scene
  const deep = location.hash.slice(1);
  if (deep && at(deep) >= 0) cur = at(deep);
  render();
})();
</script>
