<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Second Empire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bad+Script&family=IBM+Plex+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Old+Standard+TT:wght@400;700&display=swap">
<!-- Telegram Mini App (16.10): inside Telegram this gives window.Telegram.WebApp — full screen, swipes, «Выйти»; in a browser it is inert -->
<script src="https://telegram.org/js/telegram-web-app.js?58"></script>
<style>
/* Layout: a 16:9 stage letterboxed in the window — full-bleed backdrop, up to three characters standing in a row, a wide text box along the bottom, choices in the middle. Single dark look on purpose. Horizontal everywhere, as in any visual novel: a phone held upright shows the same stage at full width with dark bands above and below (see the media blocks at the end). */
:root{
  color-scheme: dark;
  --bg:#070505; --fg:#ece4d6; --muted:#a59a8a; --line:rgba(236,228,214,.16);
  --gold:#cfa850; --steel:#93b4c8; --brick:#d26d52; --bone:#e6dfcf; --olive:#adc184; --plum:#b9a6d6; --cobalt:#8ea6e6;
  --sand:#d8b77f; --rose:#dc9fb4; --moss:#93c2a2; --rust:#cf8f62; --sky:#9ec6e8; --wheat:#e3cf8e; --lilac:#c7b3e8; --scarlet:#ea7f86;
  --panel:rgba(12,8,7,.84); --box:#0d0908; --box-0:rgba(13,9,8,0); --narr:#dcd2c2; --sil:#0d0908; --halo:rgba(233,184,103,.18); --veil:rgba(8,5,4,.6);
  --wall-bot:#140a09;
  --newsprint:#cfcabd; --news-ink:#1d1b17; --news-mute:#55514a; --dots:rgba(29,27,23,.10);
  --letter:#e6ddc6; --letter-ink:#2a2216; --rule:rgba(42,34,22,.13);
  --stamp:#a52a1f; --form:#c3cccb; --tape:#f0ead9; --shadow:rgba(0,0,0,.55);
  --f-display:"Old Standard TT", Georgia, "Times New Roman", serif;
  --f-body:"Literata", Georgia, "Times New Roman", serif;
  --f-hand:"Bad Script", "Segoe Script", "Literata", cursive;
  --f-mono:"IBM Plex Mono", "Courier New", monospace;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;padding-block:12px;padding-inline:16px;background:var(--bg);color:var(--fg);font-family:var(--f-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}

.stage{position:relative;width:min(100%, calc((100svh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 16 / 9));aspect-ratio:16/9;max-width:100%;container-type:size;font-size:3.5cqh;overflow:hidden;background:var(--wall-bot);border-radius:10px;box-shadow:0 0 0 1px var(--line);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
.stage:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
/* the picture: backdrop, illustration, cast and effects. Always 16:9 and its own size container, so whatever is
   inside it is laid out the same whatever the size of the stage around it */
.view{position:absolute;inset:0;container-type:size;overflow:hidden}

/* backdrop: the painted background from backgrounds/ */
.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.bgphoto{position:absolute;inset:0;background-size:cover;background-position:center;display:none}
.bgphoto.on{display:block}
.crowd{z-index:2;pointer-events:none;filter:blur(3px);opacity:.92}
.b-crowd{fill:var(--sil)}

/* characters */
.actor{position:absolute;bottom:0;height:88%;aspect-ratio:.76;left:var(--x,50%);transform:translateX(-50%);transition:left .45s ease, opacity .3s ease, filter .3s ease;color:var(--c,var(--gold));z-index:1}
.actor.off{opacity:0;pointer-events:none}
.actor.dim{filter:brightness(.5) saturate(.65)}
.actor.speak{z-index:2}
.actor.speak::before{content:"";position:absolute;inset:8% -8% 0;background:radial-gradient(closest-side at 50% 40%, var(--halo), transparent);z-index:-1}
.actor img{display:block;width:100%;height:100%}
.actor img{object-fit:contain;object-position:50% 0;filter:saturate(.88) brightness(.95)}
/* for a portrait whose source cuts the shoulders at the frame edge (look option cutSides): sides and bottom dissolve instead of ending in a hard line */
.actor.cut-sides img{
  -webkit-mask-image:linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%), linear-gradient(to top, transparent 0, #000 10%);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%), linear-gradient(to top, transparent 0, #000 10%);
  mask-composite:intersect}
/* a figure in shadow ("тень"): black, with light from behind along the outline. For people the game does
   not show, and as a stand-in for characters whose pictures are not drawn yet. */
.actor.shade img{filter:brightness(0) drop-shadow(0 0 1.2px rgba(255,214,150,.95)) drop-shadow(0 0 9px rgba(255,196,120,.45));opacity:.96}
.actor.flip img{transform:scaleX(-1)}
/* full-screen illustration (CG) with a slow drift */
.cg{position:absolute;inset:0;z-index:2;display:none;overflow:hidden;background:var(--wall-bot)}
.cg.on{display:block}
.cg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 20s ease-in-out infinite alternate}
.cg span{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);max-width:70cqw;text-align:center;font-family:var(--f-mono);font-size:2.2cqh;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);opacity:.6}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07) translate(-1%,-1%)}}
/* effects: particles over the scene, a white flash, a shake */
.fx{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
/* The curtain (15.10): into the game from the title, and between scenes when the place or the date changes, the
   stage goes black for a moment and the new place and date stand on the black. One element, CSS transitions, and
   timers that always lift it — the intertitles of 14.10 flickered or stuck black. Nothing between scenes of the
   same place and date, nothing when skipping or going back. */
.curtain{position:absolute;inset:0;z-index:15;background:#000;opacity:0;pointer-events:none;transition:opacity .9s ease-in}
.curtain.on{opacity:1;pointer-events:auto;transition:opacity .45s ease-out}
.curtain-t{position:absolute;left:8cqw;right:8cqw;top:50%;transform:translateY(-50%);margin:0;text-align:center;font-family:var(--f-display);font-size:4.4cqh;line-height:1.3;letter-spacing:.16em;text-transform:uppercase;color:var(--bone);text-wrap:balance;opacity:0;transition:opacity .5s}
.curtain-t.show{opacity:1}
.flash{position:absolute;inset:0;z-index:4;background:#fff8ec;opacity:0;pointer-events:none}
.flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.stage.shake .bgphoto,.stage.shake .art,.stage.shake .cg,.stage.shake #cast{animation:shake .55s linear}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-1.4%,.8%)}30%{transform:translate(1.2%,-1%)}45%{transform:translate(-.9%,-.6%)}60%{transform:translate(.8%,.9%)}75%{transform:translate(-.4%,.3%)}}
.stage.dim .actor{filter:brightness(.4) saturate(.6)}

/* top HUD; the scrim keeps it readable over bright backgrounds */
.scrim{position:absolute;left:0;right:0;top:0;height:18cqh;background:linear-gradient(var(--veil), transparent);z-index:5;pointer-events:none;transition:opacity .25s}
.stage.clean .scrim{opacity:0}
/* "look at the background": everything but the scene fades out until the next click */
.box,.menu,.layer{transition:opacity .25s}
#cast,.crowd{transition:opacity .25s}
.stage.clean .box,.stage.clean .menu,.stage.clean .layer,.stage.clean #cast,.stage.clean .crowd{opacity:0;pointer-events:none}
.stage.clean .veil{opacity:0}

/* veil for choices and cards */
.veil{position:absolute;inset:0;background:var(--veil);opacity:0;transition:opacity .3s;pointer-events:none;z-index:3}
.stage.dim .veil{opacity:1}

/* cards: newspaper, telegram, letter, archive note */
.layer{position:absolute;left:0;right:0;top:8cqh;bottom:36cqh;z-index:4;display:grid;place-items:center;padding:0 3cqw;overflow:auto}
.paper{width:62cqw;background-color:var(--newsprint);background-image:radial-gradient(var(--dots) .7px, transparent .8px);background-size:4px 4px;color:var(--news-ink);padding:2.6cqh 2.6cqw 3cqh;box-shadow:0 18px 40px var(--shadow);transform:rotate(var(--tilt,-1deg));animation:drop .35s ease-out}
.mast{font-family:var(--f-display);font-weight:700;font-size:calc(var(--k,1) * 4.4cqh);text-align:center;letter-spacing:.08em;padding-bottom:.4em;border-bottom:3px double var(--news-ink)}
.dl{font-family:var(--f-mono);font-size:calc(var(--k,1) * 1.9cqh);letter-spacing:.05em;color:var(--news-mute);display:flex;justify-content:space-between;gap:8px;margin:.6em 0 1em}
.hd{font-family:var(--f-display);font-weight:700;font-size:calc(var(--k,1) * 5.4cqh);line-height:1.1;text-transform:uppercase;text-wrap:balance;margin:0 0 .45em}
.bd{font-size:calc(var(--k,1) * 3.2cqh);line-height:1.45;margin:0}
.q{font-style:italic;margin:.5em 0 0;font-size:calc(var(--k,1) * 3.2cqh);line-height:1.45}
.wire{background-color:var(--form);background-image:none}
.wh{font-family:var(--f-display);font-weight:700;letter-spacing:.32em;text-align:center;color:var(--stamp);font-size:calc(var(--k,1) * 3.8cqh);padding-bottom:.5em;border-bottom:1px solid var(--news-mute)}
.fld{font-family:var(--f-mono);font-size:calc(var(--k,1) * 2cqh);display:grid;grid-template-columns:auto 1fr;gap:.3em 1em;margin:.8em 0 1em;color:var(--news-mute)}
.fld b{font-weight:500;color:var(--news-ink)}
.tape{display:block;width:fit-content;max-width:100%;background:var(--tape);color:var(--news-ink);font-family:var(--f-mono);font-weight:500;font-size:calc(var(--k,1) * 2.7cqh);letter-spacing:.04em;padding:.2em .6em;margin:.45em 0;box-shadow:0 1px 0 var(--dots)}
.tape:nth-child(even){margin-left:.6em}
.letter{width:64cqw;background-color:var(--letter);background-image:repeating-linear-gradient(to bottom, transparent 0 calc(1.5em - 1px), var(--rule) calc(1.5em - 1px) 1.5em);color:var(--letter-ink);font-family:var(--f-hand);font-size:calc(var(--k,1) * 3.5cqh);line-height:1.5;padding:2.4cqh 3cqw 2.8cqh;box-shadow:0 18px 40px var(--shadow);transform:rotate(var(--tilt,-.8deg));animation:drop .35s ease-out}
.letter .lh{margin:0 0 .3em;opacity:.8}
.letter p{margin:0 0 .25em}
.letter .sg{margin:.3em 0 0;text-align:right}
.stamp{display:inline-block;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--stamp);border:2.5px solid var(--stamp);border-radius:4px;padding:.25em .7em;transform:rotate(-4deg);margin:0 0 .8em;font-size:calc(var(--k,1) * 3.2cqh)}
/* official documents: laws and decrees */
.doc{width:72cqw;background-color:var(--letter);background-image:none;color:var(--letter-ink);font-family:var(--f-body)}
.doc-h{font-family:var(--f-display);font-weight:700;font-size:calc(var(--k,1) * 3.2cqh);line-height:1.2;text-align:center;text-wrap:balance;padding-bottom:.5em;margin-bottom:.6em;border-bottom:3px double var(--letter-ink)}
.doc-i{margin:0 0 .25em;font-size:calc(var(--k,1) * 2.35cqh);line-height:1.33}
/* documents and letters are read on a dimmed stage: the card may come down to just above the caption */
/* a card step: the card takes the stage, the text box shrinks to one caption line under it */
/* the card stands above the text box (z-index), so the box keeps the same height and shade as under the dialogue
   (the organizer, 15.10: a lower shade under the cards looked wrong); the caption sits at the bottom of the box */
.stage.cards .layer{top:9cqh;bottom:14cqh;z-index:6}
.stage.cards .box{padding-top:0;padding-bottom:6.5cqh;align-content:end}
.stage.cards .box .who{display:none}
.stage.cards .box .tx{font-size:2.7cqh}
/* Credits (16.10, the organizer: «как в фильме... вторые титры: портрет, кто отыгрывал, и оно так вверх идёт плавно»).
   After the end card the stage goes black and the cast passes upward: each character with a portrait (the face of
   his sprite, placed as on the stage), his name and caption, and on the right who played him; headings between
   groups; the logo last. A click or a key skips it; at the end, the title screen. The list is text in the script
   (the card `credits`, scenario.py), so the organizer edits the names himself. */
.roll{position:absolute;inset:0;z-index:9;background:#000;opacity:0;transition:opacity .7s;pointer-events:none;overflow:hidden;cursor:pointer}
.stage.roll-on .roll{opacity:1;pointer-events:auto}
.stage.roll-on .box,.stage.roll-on .qm,.stage.roll-on .layer,.stage.roll-on .menu,.stage.roll-on #cast{opacity:0;pointer-events:none}
.roll-list{position:absolute;left:0;right:0;top:100%;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;align-items:center;gap:4cqh;will-change:transform}
.cr-title{font-family:var(--f-display);font-size:5.2cqh;letter-spacing:.2em;text-transform:uppercase;color:var(--bone);margin:0 0 4cqh}
.cr-h{font-family:var(--f-mono);font-size:2.4cqh;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin:5cqh 0 1cqh}
.cr-t{font-family:var(--f-display);font-size:4cqh;letter-spacing:.12em;color:var(--narr);text-align:center;max-width:70cqw;margin:10cqh 0 6cqh}
/* A row is a photograph with a character's text beside it, the photo on the left and on the right in turn (the organizer's
   sketch, 16.10). Each row is as tall as the stage, so one character is on screen at a time: a photo leaves at the top as
   the next one comes in from below. The photo: a large print on thick paper with a wide bottom margin, tilted a few
   degrees, sepia, a soft vignette and grain, the surname written on the margin by hand. Beside it the given name and
   patronymic, the surname large in the character's colour, the caption, and under them the player, large and gold. */
.cr{display:flex;align-items:center;gap:5cqw;width:80cqw;height:96cqh}
.cr.r{flex-direction:row-reverse}
.cr-txt{flex:1;text-align:center;min-width:0}
.cr.nopic{height:auto;justify-content:center;gap:3cqw;margin:4cqh 0}
.ph{margin:0;flex:none;width:40cqh;padding:2cqh 2cqh 0;background:#ece6d6;box-shadow:0 2cqh 5cqh rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.5);transform:rotate(var(--tilt,-3deg))}
.ph-img{position:relative;width:100%;height:44cqh;overflow:hidden;background:#2a211b}
/* width and height are both set inline from the sprite's own ratio, and no outer rule may cap them: the page published as an
   artifact sits in a wrapper whose base styles reached the portraits and squashed them (the organizer's screenshot, 16.10) */
.ph-img img{position:absolute;left:50%;transform:translateX(-50%);max-width:none;max-height:none;object-fit:fill;filter:sepia(.55) contrast(1.06) brightness(.92) saturate(.85)}
.ph-img.shade img{filter:brightness(0) drop-shadow(0 0 1.2px rgba(255,214,150,.95)) drop-shadow(0 0 9px rgba(255,196,120,.45))}
.ph-img.flip img{transform:translateX(-50%) scaleX(-1)}
.ph-img::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 6cqh rgba(35,22,10,.8);background:repeating-radial-gradient(circle at 37% 23%, rgba(255,255,255,.04) 0 1px, transparent 1px 3px),linear-gradient(115deg, rgba(255,250,235,.09), transparent 45%)}
.ph-sig{font-family:var(--f-hand);font-size:4.6cqh;line-height:1.2;color:#2a2f52;text-align:center;padding:1cqh 0 1.2cqh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-given{display:block;font-family:var(--f-display);font-size:3.4cqh;letter-spacing:.22em;text-transform:uppercase;color:var(--narr);line-height:1.3}
.cr-nm{display:block;font-family:var(--f-display);font-weight:700;font-size:7cqh;letter-spacing:.1em;text-transform:uppercase;color:var(--c,var(--bone));line-height:1.1;text-wrap:balance;margin-top:.1em}
.cr-nm.plain{display:inline;font-weight:400;font-size:3cqh;letter-spacing:.06em;text-transform:none;color:var(--narr)}
.cr-role{display:block;font-family:var(--f-mono);font-size:2.5cqh;letter-spacing:.1em;color:var(--muted);margin-top:1.2cqh}
.cr-pl{font-family:var(--f-display);font-size:5.4cqh;letter-spacing:.06em;color:var(--gold);white-space:nowrap}
.cr-txt .cr-pl{display:block;margin-top:5cqh;white-space:normal;text-wrap:balance}
.cr-txt .cr-pl::before{content:"";display:block;width:12cqh;height:1px;margin:0 auto 3.4cqh;background:var(--gold);opacity:.55}
.cr-logo{margin:8cqh 0 0}
.cr-logo img{display:block;width:40cqw;height:auto;filter:drop-shadow(0 .5cqh 1.4cqh rgba(0,0,0,.7))}
/* The loading curtain (17.10): «Начать» on the title does not throw the reader into the game at once — the march fades,
   the curtain falls with a thin line filling up, then the chapter shelf opens. */
/* the loading curtain carries the game's logo (the organizer, 17.10: «лого пускай везде будет»), the line under it */
.curtain-load{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;gap:3.4cqh;font-family:var(--f-mono);font-size:2cqh;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
.curtain-load img{display:block;width:38cqw;height:auto;filter:drop-shadow(0 .5cqh 1.4cqh rgba(0,0,0,.7))}
.curtain-load.show{display:flex}
.curtain-load i{display:block;width:26cqw;height:2px;background:var(--line);position:relative;overflow:hidden}
.curtain-load i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gold);animation:load-fill .8s ease-in-out forwards}
@keyframes load-fill{to{width:100%}}
/* The chapter shelf (17.10, the organizer's sketch): one wide cover in the middle, arrows at the sides, the years and
   the progress under it, the buttons at the bottom. A cover is a finished picture with its own lettering — every chapter
   in its own style, as in the Henry Stickmin Collection — so nothing is drawn over it. Each chapter can bring its own
   music for the shelf (5th field of `title`); the title's march fades out on the way here. */
.sh{position:absolute;inset:0;z-index:8;display:none;background:radial-gradient(90cqw 80cqh at 50% 35%, #1b120e, #070505 85%)}
.stage.shelf .sh{display:block}
/* the label sits bottom right, away from the top strip Telegram draws its buttons on (the organizer, 17.10) */
.sh-h{position:absolute;right:3cqw;bottom:7cqh;margin:0;font-family:var(--f-mono);font-size:2.1cqh;letter-spacing:.36em;text-transform:uppercase;color:var(--muted)}
.sh-card{position:absolute;left:50%;top:15cqh;width:60cqw;aspect-ratio:16/9;transform:translateX(-50%);border-radius:1.2cqh;overflow:hidden;background:#120c0a;box-shadow:0 2cqh 6cqh rgba(0,0,0,.85),0 0 0 1px rgba(207,168,80,.4);cursor:pointer;animation:sh-in .5s ease-out both}
.sh-card img{display:block;width:100%;height:100%;object-fit:cover}
.sh-card.soon{display:grid;place-items:center;background:radial-gradient(60% 70% at 50% 45%, #241812, #0d0908 90%);box-shadow:0 2cqh 6cqh rgba(0,0,0,.85),0 0 0 1px var(--line);cursor:default}
.sh-card.soon span{font-family:var(--f-display);font-size:7cqh;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
@keyframes sh-in{from{opacity:0;transform:translateX(-50%) scale(.96)}to{opacity:1;transform:translateX(-50%) scale(1)}}
/* the arrows (17.10, redrawn): a thin chevron in a faint ring, only on the side there is a chapter to turn to */
.sh-arrow{position:absolute;top:calc(15cqh + 30cqh - 5.5cqh);width:11cqh;height:11cqh;display:grid;place-items:center;appearance:none;background:rgba(236,228,214,.04);border:1px solid var(--line);border-radius:50%;color:var(--bone);cursor:pointer;opacity:.75;transition:opacity .2s, border-color .2s, background .2s}
.sh-arrow svg{width:4.6cqh;height:4.6cqh;display:block}
.sh-arrow.l{left:4.5cqw}.sh-arrow.r{right:4.5cqw}
.sh-arrow:hover,.sh-arrow:focus-visible{opacity:1;border-color:var(--gold);background:rgba(207,168,80,.12);outline:none}
.sh-info{position:absolute;left:0;right:0;top:78.5cqh;margin:0;text-align:center;font-family:var(--f-mono);font-size:2.2cqh;letter-spacing:.1em;color:var(--muted)}
.sh-info b{font-weight:500;color:var(--fg)}
.sh-nav{position:absolute;left:0;right:0;bottom:5cqh;display:flex;justify-content:center;gap:2.4cqw}
.sh-btn{appearance:none;background:none;border:1px solid var(--line);border-radius:999px;color:var(--fg);font-family:var(--f-display);font-size:3.4cqh;line-height:1.2;padding:.35em 1.3em;cursor:pointer}
.sh-btn:hover,.sh-btn:focus-visible{border-color:var(--gold);color:var(--gold);outline:none}
.sh-btn.ghost{color:var(--muted)}
.sh-back{position:absolute;left:3cqw;bottom:7cqh;z-index:1;appearance:none;background:none;border:0;font-family:var(--f-mono);font-size:2.1cqh;letter-spacing:.1em;color:var(--muted);cursor:pointer}
.sh-back:hover,.sh-back:focus-visible{color:var(--fg);outline:none}

/* Main menu (15.10): the organizer's cabinet backdrop in full, drifting slowly, dust in the air. The logo top left
   with a soft shadow, the buttons bottom right over the dark folder, the version in the corner.
   Two soft shadows in those corners keep the type readable; the cap, the order and the tower stay in the light.
   The scene lives a little (15.10, evening, to match the march on the title): the room comes out of the dark, a
   burst of light and a gold glint over the logo, the buttons one after another; motes of dust drift and twinkle
   in the room (the fx kind `motes`, denser and livelier than the scenes' dust), the lamp on the right breathes.
   Tried and dropped the same evening by the organizer: the camera creeping in, the logo and buttons drifting, the
   glow pulsing with the music («светится противно»), snow outside the window (not visible once made subtle).
   The backdrop is shown a touch larger, anchored to the bottom: the red star on the tower's spire (the top 4 % of
   the picture) stays out of the frame — an empire has no red star; the organizer's file is untouched. */
.tm{position:absolute;inset:0;z-index:8;display:none}
.stage.title .tm{display:block}
.stage.title .bgphoto{background-size:auto 104.5%;background-position:50% 100%}
/* the first entry waits for a click: browsers allow sound only after a gesture, and the organizer wants the march
   from the first frame. Returning from the game, the title opens at once. */
.tm-gate{position:absolute;inset:0;z-index:4;background:#000;display:grid;place-items:center;cursor:pointer}
.tm-gate span{font-family:var(--f-mono);font-size:2.2cqh;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);animation:tm-blink 2.4s ease-in-out infinite}
@keyframes tm-blink{0%,100%{opacity:.35}50%{opacity:1}}
.tm-lamp{position:absolute;inset:0;background:radial-gradient(30cqw 48cqh at 96% 28%, rgba(255,205,135,.75), rgba(255,190,110,.25) 45%, rgba(255,200,130,0) 72%);mix-blend-mode:screen;animation:tm-lamp 4.5s ease-in-out infinite alternate}
@keyframes tm-lamp{from{opacity:.6}to{opacity:1}}
.tm-vig{position:absolute;inset:0;box-shadow:inset 0 0 16cqw rgba(0,0,0,.9);opacity:.4}
.tm-fade{position:absolute;inset:0;z-index:3;background:#000;pointer-events:none;animation:tm-fade 1.8s ease-out both}
@keyframes tm-fade{from{opacity:1}to{opacity:0}}
.tm-scrim{position:absolute;inset:0;background:radial-gradient(64cqw 58cqh at 0 0, rgba(8,5,4,.72), rgba(8,5,4,0) 100%),radial-gradient(56cqw 62cqh at 100% 100%, rgba(8,5,4,.82), rgba(8,5,4,0) 100%)}
.tm-h{position:absolute;left:4cqw;top:4cqh;width:42cqw;margin:0;z-index:1;animation:tm-in 1.3s .6s ease-out both}
.tm-burst{position:absolute;left:-12%;top:-30%;width:124%;height:160%;border-radius:50%;background:radial-gradient(closest-side, rgba(255,240,210,.8), rgba(233,184,103,.3) 45%, rgba(233,184,103,0));pointer-events:none;z-index:-1;animation:tm-burst 1.2s .9s ease-out both}
@keyframes tm-burst{0%{opacity:0;transform:scale(.4)}35%{opacity:.7}100%{opacity:0;transform:scale(1.5)}}
.tm-glint{position:absolute;inset:0;background:linear-gradient(105deg, rgba(255,240,200,0) 42%, rgba(255,240,200,.8) 50%, rgba(255,240,200,0) 58%);background-size:300% 100%;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;pointer-events:none;animation:tm-glint 9s 1.5s ease-in-out infinite}
@keyframes tm-glint{0%{background-position:130% 0}13%{background-position:-30% 0}100%{background-position:-30% 0}}
/* the logo of 15.10 (evening) has gold and silver lettering: a soft dark shadow lifts it off the room, no halo */
.tm-logo{display:block;width:100%;height:auto;filter:drop-shadow(0 .5cqh 1.4cqh rgba(0,0,0,.7))}
.tm-name{font-family:var(--f-display);font-weight:700;font-size:11cqh;line-height:1;color:var(--fg);text-shadow:0 2px 8px var(--shadow)}
.tm-nav{position:absolute;right:6cqw;bottom:11cqh;display:flex;flex-direction:column;align-items:flex-end;gap:1.6cqh}
.tm-btn{appearance:none;background:none;border:0;padding:.2em 0;font-family:var(--f-display);font-size:5.6cqh;line-height:1.1;letter-spacing:.06em;color:var(--fg);text-shadow:0 1px 4px var(--shadow),0 0 16px var(--shadow);cursor:pointer;display:flex;align-items:center;gap:0;transition:color .2s,gap .3s;animation:tm-in 1s ease-out both}
.tm-btn::after{content:"";display:block;width:0;height:.09em;background:var(--gold);box-shadow:0 0 8px var(--halo);transition:width .3s}
.tm-btn:hover,.tm-btn:focus-visible{color:var(--gold);gap:1.4cqw;outline:none}
.tm-btn:hover::after,.tm-btn:focus-visible::after{width:4cqw}
.tm-btn:nth-child(1){animation-delay:1.6s}.tm-btn:nth-child(2){animation-delay:1.85s}.tm-btn:nth-child(3){animation-delay:2.1s}.tm-links{position:absolute;left:4cqw;bottom:3.6cqh;z-index:2;margin:0;display:flex;align-items:center;gap:1cqw;font-family:var(--f-mono);font-size:1.9cqh;letter-spacing:.12em;color:var(--muted);animation:tm-in 1.3s 2.9s ease-out both}
.tm-link{appearance:none;background:none;border:0;padding:.2em 0;font:inherit;letter-spacing:inherit;color:var(--muted);cursor:pointer}
.tm-link:hover,.tm-link:focus-visible{color:var(--fg);outline:none}
.tm-btn:nth-child(4){animation-delay:2.35s}.tm-btn:nth-child(5){animation-delay:2.6s}.tm-btn:nth-child(6){animation-delay:2.85s}  /* up to six: Продолжить, Начать, Персонажи, Настройки, Выйти (the fifth and sixth used to pop in at once, 17.10) */
@keyframes tm-in{from{opacity:0;transform:translateY(1.5cqh)}to{opacity:1;transform:none}}
.stage.title .scrim{opacity:0;pointer-events:none}
.stage.title .box{display:none}
/* the version, in the bottom right corner of the title screen and of the game menu */
.ver{position:absolute;right:2.2cqw;bottom:2.2cqh;z-index:21;margin:0;font-family:var(--f-mono);font-size:1.9cqh;letter-spacing:.1em;color:var(--muted);opacity:.7;pointer-events:none;display:none}
.stage.title .ver,.stage.gm-open .ver{display:block}
.note-h{font-family:var(--f-display);font-weight:700;font-size:calc(var(--k,1) * 5cqh);line-height:1.15;margin:0 0 .4em;text-wrap:balance}

/* choices in the middle of the screen */
.menu{position:absolute;left:50%;top:10cqh;bottom:36cqh;transform:translateX(-50%);width:66cqw;z-index:4;display:flex;flex-direction:column;justify-content:center;gap:1.8cqh}
.opt{appearance:none;text-align:center;font:inherit;font-size:3.7cqh;line-height:1.3;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1.8cqh 2.4cqw;cursor:pointer;transition:border-color .2s, background .2s}
.opt:hover,.opt:focus-visible{border-color:var(--gold);outline:none}
.opt.ghost{color:var(--muted)}

/* text box: a shade rising from the bottom edge, solid in its lower part. Sprites are cut at the
   knees; the cut lines sit inside the solid part, so nothing ends in mid-air. */
/* Text sits in a centred column of ~60-65 characters; the name and the first line start at the
   same height on every line, so the eye does not hunt for them when a line is longer or shorter. */
/* The box holds three lines of speech; a longer line is shown in parts (see paginate). Every size on the stage is a
   share of its height or width (cqh/cqw), never pixels: the picture is the same on a monitor and on a phone, only
   smaller — the organizer wants one layout for everyone (15.10). */
.box{--col:70cqw;position:absolute;left:0;right:0;bottom:0;height:36cqh;z-index:5;background:linear-gradient(to top, var(--box) 0, var(--box) 62%, var(--box-0) 100%);
  display:grid;grid-template-columns:1fr var(--col) 1fr;align-content:start;row-gap:1cqh;padding-top:9cqh}
.box > *{grid-column:2;min-width:0}
.who{display:flex;align-items:baseline;gap:1.4cqw;min-height:1.2em;font-size:2.3cqh;font-family:var(--f-mono);text-shadow:0 1px 3px var(--shadow),0 0 8px var(--shadow)}
.nm{font-weight:500;font-size:3.3cqh;letter-spacing:.16em;text-transform:uppercase;color:var(--c,var(--gold))}
.role{font-size:2cqh;color:var(--muted)}
.tx{font-size:3.5cqh;line-height:1.45;margin:0;text-wrap:pretty;hyphens:auto;-webkit-hyphens:auto;text-shadow:0 1px 3px var(--shadow)}
/* the part of the line not typed yet: laid out but invisible, so words never jump to the next line while typing */
.tx .rest{visibility:hidden}
.tx.narr{font-style:italic;color:var(--narr)}
.more{position:absolute;right:calc((100% - var(--col)) / 2);bottom:6.4cqh;color:var(--gold);font-size:2.6cqh;animation:blink 1.1s steps(2) infinite}
.hint{font-size:2cqh;letter-spacing:.06em;color:var(--muted)}
.who .pl{margin-left:auto;font-size:1.9cqh;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.stage.decide .who .pl{display:none}
.row{display:flex;gap:1.2cqw;flex-wrap:wrap;margin-top:auto}
/* under a fork or an end card the buttons stand centred (one button on the fork, 15.10) */
.stage.decide .row,.stage.decide .who{justify-content:center}
.row .opt{font-size:3.2cqh;padding:1.2cqh 2cqw}
/* quick menu under the text, as in Ren'Py games */
.qm{position:absolute;left:0;right:0;bottom:.8cqh;z-index:7;display:flex;justify-content:center;flex-wrap:wrap;gap:0 2.4cqw;font-family:var(--f-mono);transition:opacity .25s}
.qm button{appearance:none;background:none;border:0;padding:.7em .2em;font:inherit;font-size:1.95cqh;letter-spacing:.06em;color:var(--muted);opacity:.85;cursor:pointer}
.qm button:hover,.qm button:focus-visible{color:var(--fg);opacity:1;outline:none}
.qm button.on{color:var(--gold);opacity:1}
.qm button.muted{text-decoration:line-through;opacity:.55}
.stage.title .qm,.stage.clean .qm{opacity:0;pointer-events:none}
/* game menu: history, settings, back to the title */
.gm{position:absolute;inset:0;z-index:20;display:grid;grid-template-columns:24cqw 1fr;background:rgba(8,5,4,.94);color:var(--fg);cursor:default}
.gm[hidden]{display:none}
.gm-nav{display:flex;flex-direction:column;justify-content:center;gap:1.4cqh;padding:0 2.6cqw;border-right:1px solid var(--line)}
.gm-nav button{appearance:none;background:none;border:0;text-align:left;font-family:var(--f-display);font-size:3.8cqh;color:var(--muted);cursor:pointer;padding:.2em 0}
.gm-nav button:hover,.gm-nav button:focus-visible{color:var(--fg);outline:none}
.gm-nav button.on{color:var(--gold)}
.gm-nav button[hidden]{display:none}
.gm-body{min-width:0;overflow:auto;padding:7cqh 4cqw 5cqh}
.gm-body.fixed{overflow:hidden}
.gm-h{font-family:var(--f-display);font-weight:700;font-size:5.6cqh;margin:0 0 3cqh;color:var(--gold)}
.hist{display:flex;flex-direction:column;gap:1.8cqh;max-width:62cqw}
.hl{margin:0;font-size:3cqh;line-height:1.45}
.hl b{display:block;font-family:var(--f-mono);font-weight:500;font-size:2cqh;letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--gold));margin-bottom:.15em}
.hl.narr{font-style:italic;color:var(--narr)}
.hl.card{font-family:var(--f-mono);font-size:2.2cqh;color:var(--muted)}
.scenes{display:flex;flex-wrap:wrap;gap:1.4cqh 1.2cqw;max-width:70cqw}
.sc{appearance:none;background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-family:var(--f-mono);font-size:2.3cqh;padding:.45em 1.1em;cursor:pointer;text-align:left}
.sc:hover,.sc:focus-visible{color:var(--fg);border-color:var(--muted);outline:none}
.sc.on{color:var(--gold);border-color:var(--gold)}
.sc.off{opacity:.45;cursor:default;letter-spacing:.2em}
.sc.mark{color:var(--fg);border-style:dashed}
/* «Персонажи» (17.10): the characters met so far, each with a card — the figure with its emotions to try on (as the
   sprite gallery of «Бесконечное лето»), the full name, the caption and the biography by chapters. */
/* the card fills the menu's body; only the text column scrolls (the organizer, 17.10), the figure and the list stay */
.bio{display:grid;grid-template-columns:16cqw 1fr;gap:3cqw;align-items:start;height:calc(100cqh - 7cqh - 5cqh)}
.bio-h{margin:0 0 1.6cqh;line-height:1.1;font-size:4.6cqh;white-space:nowrap}
.bio-list{display:flex;flex-direction:column;gap:.4cqh;max-height:100%;overflow:hidden auto}
.bio-who{appearance:none;background:none;border:0;text-align:left;font-family:var(--f-display);font-size:3.1cqh;line-height:1.3;color:var(--muted);cursor:pointer;padding:.1em 0}
.bio-who:hover,.bio-who:focus-visible{color:var(--fg);outline:none}
.bio-who.on{color:var(--gold)}
.bio-card{display:grid;grid-template-columns:22cqw 1fr;gap:2.6cqw;align-items:start;height:100%;min-height:0}
.bio-text{height:100%;overflow:auto;padding-right:1.2cqw;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.bio-fig{position:relative;height:56cqh;border-radius:1cqh;overflow:hidden;background:radial-gradient(70% 60% at 50% 40%, #241812, #0d0908 95%);box-shadow:0 0 0 1px var(--line)}
.bio-fig img{position:absolute;left:50%;top:0;height:100%;width:auto;max-width:none;transform:translateX(-50%);filter:saturate(.88) brightness(.95)}
.bio-fig.flip img{transform:translateX(-50%) scaleX(-1)}
.bio-emos{display:flex;flex-wrap:wrap;gap:.7cqh .5cqw;margin-top:1.2cqh}
.bio-emo{appearance:none;background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-family:var(--f-mono);font-size:1.8cqh;padding:.3em .8em;cursor:pointer}
.bio-emo:hover,.bio-emo:focus-visible{color:var(--fg);border-color:var(--muted);outline:none}
.bio-emo.on{color:var(--gold);border-color:var(--gold)}
.bio-nm{font-family:var(--f-display);font-weight:700;font-size:4.6cqh;letter-spacing:.06em;color:var(--c,var(--gold));margin:0}
.bio-full{font-family:var(--f-mono);font-size:2.1cqh;letter-spacing:.06em;color:var(--muted);margin:.4em 0 2cqh}
.bio-ch{font-family:var(--f-mono);font-size:1.9cqh;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin:2.4cqh 0 1cqh}
.bio-p{font-size:2.7cqh;line-height:1.5;color:var(--narr);margin:0 0 1em;max-width:46cqw}
.bio-sub{font-family:var(--f-display);font-weight:700;font-size:3cqh;color:var(--fg);margin:2cqh 0 .8cqh}
.bio-none{font-size:2.7cqh;color:var(--narr);font-style:italic}
.pg{appearance:none;background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-family:var(--f-mono);font-size:2.1cqh;padding:.35em 1em;cursor:pointer}
.pg:hover,.pg:focus-visible{color:var(--fg);border-color:var(--muted);outline:none}
.pref{display:grid;grid-template-columns:26cqw 1fr;align-items:center;gap:2cqw;max-width:62cqw;margin:0 0 3cqh;font-size:3cqh}
.pref input[type=range]{width:100%;accent-color:var(--gold)}
.pref.chk{grid-template-columns:auto 1fr;justify-content:start}
.pref input[type=checkbox]{width:1.1em;height:1.1em;margin:0;accent-color:var(--gold)}
/* «Открыта биография»: a plate that slides in from the left edge just above the text box and slides back (the
   organizer's sketch, 17.10) */
.bio-toast{position:absolute;left:0;bottom:37.5cqh;z-index:7;max-width:46cqw;padding:1.2cqh 2.2cqw 1.2cqh 1.8cqw;background:var(--panel);border:1px solid var(--line);border-left:.4cqw solid var(--gold);border-radius:0 .9cqh .9cqh 0;font-family:var(--f-mono);font-size:2.1cqh;letter-spacing:.06em;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translateX(-105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.bio-toast.show{transform:translateX(0)}
.bio-toast b{color:var(--gold);font-weight:500}
.toast{position:absolute;left:50%;top:11cqh;transform:translateX(-50%);z-index:25;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.5em 1.3em;font-family:var(--f-mono);font-size:2.1cqh;color:var(--fg);pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* The same layout on every screen, as on a desktop. A phone on its side: no margins round the stage, every pixel
   goes to the game. A phone held upright: the stage keeps its 16:9 at the full width of the screen, upright, with
   dark bands above and below, like any widescreen video. No rotation: the page follows the phone's own orientation. */
@media (orientation: landscape) and (max-height: 500px){
  body{padding:0;gap:0}
  .stage{width:min(100%, calc((100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 16 / 9));border-radius:0;box-shadow:none}
}
@media (orientation: portrait){
  body{padding:0;gap:0}
  .stage{width:100%;border-radius:0;box-shadow:none}
}

@keyframes drop{from{opacity:0;transform:translateY(-14px) rotate(var(--tilt,-1deg))}to{opacity:1;transform:rotate(var(--tilt,-1deg))}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.curtain,.curtain-t{transition:none}.paper,.letter,.more,.cg img,.flash.go,.tm-h,.tm-btn,.tm-lamp,.tm-fade,.tm-burst,.tm-glint{animation:none}.stage.shake *{animation:none!important}.actor,.veil{transition:none}}
</style>

<div class="stage" id="stage" lang="ru" tabindex="0" aria-label="Сцена. Нажмите или пробел, чтобы продолжить">
  <div class="view" id="view">
  <div class="bgphoto" id="bgphoto"></div>
  <div class="cg" id="cg"><img id="cgImg" alt="" hidden><span id="cgPh"></span></div>

  <div id="cast"></div>
  <!-- the audience in the barn stands in front of the speaker -->
  <svg class="art crowd" id="crowdLayer" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display:none"><g id="crowd"></g></svg>
  <canvas class="fx" id="fx" aria-hidden="true"></canvas>
  </div>
  <div class="veil"></div>
  <div class="flash" id="flash"></div>
  <div class="curtain" id="curtain" aria-live="polite"><p class="curtain-t" id="curtainText"></p><div class="curtain-load" id="curtainLoad"><i></i></div></div>
  <div class="sh" id="sh" aria-label="Выбор главы"></div>
  <div class="roll" id="roll" aria-label="Титры"></div>

  <div class="scrim"></div>
  <div class="layer" id="layer" hidden></div>
  <div class="menu" id="menu" hidden></div>
  <div class="box" id="box"></div>
  <div class="tm" id="tm" hidden></div>
  <nav class="qm" id="qm" aria-label="Быстрое меню">
    <button type="button" data-q="back">Назад</button>
    <button type="button" data-q="history">История</button>
    <button type="button" data-q="scenes">Сцены</button>
    <button type="button" data-q="skip">Пропуск</button>
    <button type="button" data-q="auto">Авто</button>
    <button type="button" data-q="hide">Скрыть</button>
    <button type="button" data-q="sound">Звук</button>
    <button type="button" data-q="prefs">Меню</button>
  </nav>
  <div class="gm" id="gm" hidden>
    <nav class="gm-nav">
      <button type="button" data-gm="close">Вернуться</button>
      <button type="button" data-gm="history">История</button>
      <button type="button" data-gm="scenes">Сцены</button>
      <button type="button" data-gm="prefs">Настройки</button>
      <button type="button" data-gm="title">Главное меню</button>
    </nav>
    <section class="gm-body" id="gmBody"></section>
  </div>
  <p class="ver" id="ver"></p>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="bio-toast" id="bioToast" role="status" aria-live="polite"></div>
</div>

<script>
(() => {
  // Pictures are separate files next to the page (img/...), written by build.py; below are their addresses.
  // Sprites come from sprites/<character>/<set>_<emotion>.png, named by the organizer (the set is usually

  // Character biographies (scenario/bio/<who>.txt, 17.10): { who: { full, sections: [{ ch, paras }] } }. A card opens
  // the first time the character stands on the stage; its chapters open as the reader reaches them.
  const BIOS = {"chapaev": {"full": "Марк Максимович Ческидов", "sections": [{"ch": "Пролог", "paras": ["Официальная история такова. В село Шокпартогай пришёл человек, которого крестьяне вытащили из реки и выходили. Он назвался Марком, бывшим генералом красной дивизии, и сказал, что после бегства Ленина в большевиках разочаровался и хочет служить новому московскому правительству. Его взяли в Генеральный штаб под надзор, и в первые же месяцы он показал себя замечательным стратегом.", "По документам — Марк Максимович Ческидов. Год рождения, образование и прежняя служба в бумагах не значатся. Командовал дивизией, потом армией; харизма и навык делают его карьеру быстрее, чем бумаги.", "Среди старых офицеров ходят догадки, кто он на самом деле. Табуретов однажды в сердцах назвал его при всех совсем другим именем."]}]}, "glug": {"full": "Юзеф Владислав фон Глюг", "sections": [{"ch": "Пролог", "paras": ["???"]}]}, "kashubski": {"full": "Владимир Петрович Кашубский", "sections": [{"ch": "Пролог", "paras": ["Родился в 1885 году в Архангельской губернии. Настоящая фамилия — Иванов; русский с украинскими, белорусскими, польскими и сербскими корнями, на четверть еврей и на четверть кашуб. Отслужил в императорской армии в 1907–1910 годах, в Великую войну с 1915-го доброволец, в конце 1916-го тяжело ранен.", "От обиды на Николая, на Временное правительство и на собственную бедность месяц-другой пробыл в Красной армии, потом по убеждениям ушёл к белым; в 1919-м побывал в плену. В 1920 году граната разворотила ему ноги: полгода госпиталя, полтора года на костылях, и пока он учился ходить, в Москве произошёл путч. Два Георгиевских креста — за ту войну и за эту.", "К путчу отнёсся прохладно, но реформы его переубедили: «Крюков спас страну». Несмотря на больные ноги, выдвинулся в Думу; оппозиционер, который не станет поддерживать никого, кто против Крюкова. Псевдоним взял, когда в Данциге поднялись кашубы."]}]}, "kryukov": {"full": "Алексей Сергеевич Крюков", "sections": [{"ch": "Пролог", "paras": ["Уроженец Новочеркасска, из Области Войска Донского. В Гражданскую войну шёл вместе с Деникиным, но довольно скоро собрал собственную силу — Российскую Национальную Гвардию. Белым он был по убеждению, а не по выгоде: в дележе власти после победы над Лениным участвовать не собирался, и это заметили.", "Когда большевики были разбиты, а белые генералы сцепились между собой, Крюков сделал то, чего не ждал никто: его гвардия вошла в Москву без единого выстрела. К ней перешли донские казаки и крестьяне, ещё вчера стоявшие за красных, — им обещали землю, выборы и защиту. Разбитые войска Врангеля влились в ту же гвардию.", "Объявил Московское правительство единственным в России, себя — его временным главой, красным офицерам, сложившим оружие, дал амнистию. Называет себя регентом. Обещает свободные выборы и реформы; ходит слух, что хочет Россию национальную, но на демократических началах. По телефону с подчинёнными не церемонится."]}]}, "lunenko": {"full": "Юрий Александрович Луненко", "sections": [{"ch": "Пролог", "paras": ["Родился в 1890 году в селе на Волыни. Отец, Александр Луненко, русский человек до мозга костей, воспитал сына в убеждении, что Волынь — неотъемлемая часть России. В 1915 году край заняли Центральные державы; семья осталась и устраивала диверсии против оккупантов.", "После войны Волынь отошла Польше, и за верность России начали преследовать. Для Луненко Россия — не географическое понятие, а справедливость, дом и великий идеал. Переворот Крюкова он увидел как шанс для Волыни и с тех пор поднимает подполье за присоединение к новой России.", "Женат на Марии Владимировне, урождённой Мавричевой; познакомились в 1915-м, обвенчались в 1920-м, детей пока нет. Жена в политику не лезет, но мужа держит."]}]}, "markov": {"full": "Сергей Леонидович Марков", "sections": [{"ch": "Пролог", "paras": ["Родился в 1878 году. Профессиональный военный: японская война, Великая война, зимнее окружение в Карпатах. В семнадцатом пошёл с Корниловым, хотя знал, что это путь к гибели; один из отцов Белой гвардии, прошёл льды Дона, много раз ранен, выходил из десятков окружений. Основатель Марковской дивизии, которую ставят на самые трудные рубежи.", "Переворот Крюкова поддержал сразу: «он сегодня — это власть Единой России». Но против ареста Врангеля возражал и сам уговаривал барона служить новой власти, потому что Россия не должна терять такой талант. Считает, что его дивизия вернёт Петроград за пять дней, а если понадобится, дойдёт и до Варшавы.", "Храбрость, военный талант и доблесть отмечают даже недруги. Любимая присказка: «Веду бой на все четыре стороны света, так трудно, что даже весело». Пьёт чай, когда другие пьют что покрепче."]}]}, "pavlov": {"full": "Александр Васильевич Павлов", "sections": [{"ch": "Пролог", "paras": ["Родился в 1885 году в семье потомственных учителей. Сибиряк, родной город — Красноярск. Прошёл японскую войну, в Великую — кавалерист.", "Революцию встретил с возмущением, вернулся в Красноярск и поднял кампанию «Свобода Великой Сибири». Всей душой верил в Романовых; узнав об их бегстве, разозлился на всех разом и объявил Сибирь свободным государством, воюя и с белыми, и с красными. Правил ею в 1919–1920 годах, до Московского путча.", "Новой власти подчинился сам, и Сибирь вернулась в Россию; с тех пор служит ей, как он говорит, верой и правдой. Англичанам и французам не верит ни на грош: у России должен быть свой курс. В словах и решениях непоколебим."]}]}, "ross": {"full": "Александер Константинович Росс", "sections": [{"ch": "Пролог", "paras": ["Родился 17 октября 1874 года в Великом княжестве Финляндском, в семье промышленника и потомственного дворянина. Юрист, выпускник Петербургского университета, сторонник конституционной монархии: за нелестные слова об Александре III в 1893 году сослан, стараниями отца не в Сибирь, а в Прибалтику. В Николае II видел надежду, пока не случилась Ходынка. Дальше молчал и работал: грозный голос и знание законов сделали его известным адвокатом балтийских губерний.", "После Манифеста 17 октября — кадет и депутат первой Думы, прямой и жёсткий в дебатах. Великую войну назвал «ненужной Отечественной» и, узнав о готовящемся аресте, переждал её в Швеции. После Февраля вернулся главным уличным оратором кадетов; Октябрь встретил с яростью и отчаянием. Когда Финляндия отделилась, встал за белых, представлял её в Европе и познакомился с Маннергеймом, а в 1919-м сам уговорил эстонцев идти на Петроград вместе с Северным корпусом. Город взяли, и Росс стал де-факто главой Северо-Западной армии.", "К 1922 году — хозяин Петрограда. Крюкова поддержать отказался, собрал северных добровольцев в Северную Армию России, увёл её из Прибалтики и признал независимость прибалтийских республик. Выбор народа признаёт, хотя, по его словам, ему от этого тошно."]}]}, "ruzhik": {"full": "Владислав Фёдорович Ружик", "sections": [{"ch": "Пролог", "paras": ["Родился 11 июня 1888 года в Кракове. Учился на историка в Петербургском университете; в 1905 году арестован за участие в гапоновской демонстрации и отпущен. Депутат Государственной думы трёх созывов от кадетов.", "В Февральскую революцию был в первых рядах, Временное правительство прочило его послом в Польшу. Октябрь встретил прохладно, ушёл к эсерам, после Брестского мира — к Колчаку. В Учредительном собрании в изгнании выступил против Колчака как Верховного правителя и попал под арест; вышел, когда белые принялись делить власть, уехал в родной Краков. В Россию вернулся из тюрьмы — его выпустили указом Крюкова среди шести тысяч политических.", "Самый молодой человек в окружении регента; Росс так его и зовёт — «молодой человек». Убеждён, что стране нужна твёрдая рука, но ещё нужнее крепкий парламент, который не прогибается под одного человека."]}]}, "taburetov": {"full": "Владислав Михайлович Табуретов", "sections": [{"ch": "Пролог", "paras": ["Родился в 1876 году в старинной дворянской семье Смоленской губернии. Пажеский корпус, потом Николаевская академия Генерального штаба, где заслужил репутацию умного и решительного офицера. В Великую войну — Юго-Западный фронт и Брусиловский прорыв, несколько тяжёлых ранений. После Февраля остался верен присяге и открыто выступал против разложения армии.", "В Гражданскую водил кавалерийские корпуса против красных и эсеров и вышел из неё генералом. Когда белые начали делить победу, оказался одним из немногих, кто не встал ни на чью сторону, — а потом первым признал Крюкова, называя его то новым Петром, то спасителем святой Руси. Его армия на юге, от Туркестана до Омска, перешла к Москве целиком. Это его солдаты взяли в Омске атамана Краснова, и Табуретов сам привёз его поездом в столицу.", "Суровая дисциплина, личная отвага, бескомпромиссность к врагам и верность друзьям; любит военную историю и шутку. Кличка, как уверяют, пошла от легендарной рубки, которую он провёл «вися на табурете». Цитирует Суворова: «Пуля — дура, штык — молодец», — и добавляет, что хороший табурет всегда под рукой. Семья богата, родовое имение под Смоленском."]}]}, "zaryvalov": {"full": "Николай Александрович Зарывалов", "sections": [{"ch": "Пролог", "paras": ["Родился в Москве в 1879 году в семье зажиточного рабочего. Болезненного мальчика увезли на Кавказ к тётке, в семь лет вернули в Москву и отдали в военное училище в Петрограде. В 1904 году вместе с училищем попал на японскую войну, прошёл Ляоян и Мукден, где чудом выжил, и вернулся с двумя Георгиевскими крестами. Кадровый военный, служил в Москве.", "С 1914 года на фронте, третий Георгий. В февральские дни семнадцатого погибли его родители. После революции открыто выступал против продолжения войны и уцелел только потому, что в частях царил хаос. В Гражданскую пошёл к Деникину, а когда белые перессорились, примкнул к Московскому путчу и был среди тех, кто брал власть в Москве.", "Крюков обращается к нему «товарищ Зарывалов» и доверяет то, что другим не доверяет. В приёмной у него с 1922 года сидит майор госбезопасности Луньков."]}]}};

  const SCRIPT = {"title": {"name": "Пролог", "span": "ноябрь 1922 — осень 1923", "music": "Main Menu", "cover": "prolog", "theme": ""}, "scenes": [{"id": "start", "label": "Пролог: газеты"}, {"id": "kremlin", "label": "Кремль: съезд"}, {"id": "dantsig", "label": "Поморье: девять дней"}, {"id": "pokusheniya", "label": "Москва: покушения"}, {"id": "parizh", "label": "Париж: Росс и Барту"}, {"id": "partii", "label": "Москва: созыв Думы"}, {"id": "tkachenko", "label": "Москва: Закон №1"}, {"id": "ogpu", "label": "Лубянка: ОГПУ"}, {"id": "film", "label": "Москва: «9 дней в Кашубии»"}, {"id": "ssha", "label": "Вашингтон: Росс и Колби"}, {"id": "kresy", "label": "Волынь: беспорядки"}, {"id": "pered_soborom", "label": "Канун собора"}, {"id": "sobor", "label": "Смоленск: собор"}, {"id": "choice_tron", "label": "Смоленск: корона"}, {"id": "vladivostok", "label": "Владивосток: Росс узнаёт последним"}, {"id": "ukazy", "label": "Смоленск: первые указы"}, {"id": "vzryv", "label": "Смоленск: взрыв"}, {"id": "vokzal", "label": "Москва: вокзал"}, {"id": "mid", "label": "МИД: Росс и британцы"}, {"id": "pavlov", "label": "Москва: Павлов"}, {"id": "sentyabr", "label": "Генштаб: нападение"}, {"id": "kulidzh", "label": "Кремль: Кулидж"}, {"id": "getsberg", "label": "Генштаб: последний звонок"}, {"id": "rossi_kryukov", "label": "Кремль: Росс и Крюков"}, {"id": "duma", "label": "Дума: Закон №2"}, {"id": "mongoliya", "label": "Вокзал: Ческидов"}, {"id": "berlin", "label": "Кремль: Берлин"}, {"id": "kellog", "label": "Вашингтон: контракт"}, {"id": "krasnoyarsk", "label": "Красноярск: нож"}, {"id": "lubyanka_pavlov", "label": "Лубянка: Павлов"}, {"id": "vostok", "label": "Кремль: Восток"}, {"id": "volyn", "label": "Волынь: амбар"}, {"id": "varshava", "label": "Варшава: Грабский и Пилсудский"}], "steps": [{"k": "paper", "t": "Россия, 1918–1922. Нажмите, чтобы листать газеты.", "src": 66, "mast": "Ведомости России", "date": "3 марта 1918 г.", "hd": "Позорный мир в Брест-Литовске", "bd": ["Большевики подписали сепаратный мир с Центральными державами. Россия признаёт независимость Польши, Литвы, Украины и Финляндии, а Турции отдаёт Карс, Ардаган и Батум. Судьба Курляндии и Лифляндии отныне в руках Германии."], "q": [], "p": "Пролог, 1918–1922", "bg": "kremlin_zal", "on": [], "x": {}, "fx": "none", "cg": "", "id": "start", "h": "e8408194"}, {"k": "paper", "src": 69, "mast": "Ведомости России", "date": "1919 г.", "hd": "Ленин и Троцкий бежали", "bd": ["Деникин взял Царицын и идёт на Москву, Юденич стоит у Петрограда. ВЧК разгромлена, последние отряды чекистов истреблены."], "q": ["«Гражданская война окончена! Россия вздыхает свободно!»"], "p": "Пролог, 1918–1922", "h": "3ac30a4c"}, {"k": "paper", "src": 70, "mast": "Ведомости России", "date": "1919 г.", "hd": "Победители не поделили победу", "bd": ["Колчак провозглашён Верховным правителем, но у Врангеля на юге и Юденича на северо-западе свои планы. Страна, только что освобождённая от красных, снова на грани распада."], "q": [], "p": "Пролог, 1918–1922", "h": "6b9209ad"}, {"k": "paper", "src": 71, "mast": "Ведомости России", "date": "Юг России", "hd": "Гвардия Крюкова против Врангеля", "bd": ["Российская Национальная Гвардия вступила в бой с войсками Врангеля на юге. На сторону атамана А. С. Крюкова перешли донские казаки и крестьяне, которым обещаны демократизация и социальная помощь."], "q": [], "p": "Пролог, 1918–1922", "h": "3babc9dd"}, {"k": "paper", "src": 78, "mast": "Ведомости России", "date": "Юг России", "hd": "Врангель разбит", "bd": ["Войска Петра Врангеля полностью разбиты, остатки примкнули к Национальной Гвардии. Открыт путь на Малороссию и Кавказ."], "q": [], "p": "Пролог, 1918–1922", "h": "26445d31"}, {"k": "paper", "src": 192, "mast": "Ведомости России", "date": "Петроград", "hd": "Северо-Западная армия отказывает Крюкову", "bd": ["Северо-Западная армия не поддержит Крюкова: в Петрограде не дают покоя большевистские ячейки, а за спиной стоит финская армия Маннергейма. Юденич, Бермондт-Авалов и Родзянко делят власть между собой."], "q": ["«— А. К. Росс»"], "p": "Пролог, 1918–1922", "h": "141015ed"}, {"k": "paper", "src": 201, "mast": "Ведомости России", "date": "Москва", "hd": "РНГ взяла Москву без боя", "bd": ["Московское правительство расформировано. Крюков обратился к стране:"], "q": ["«У нас одна Родина от Петрограда до Владивостока, мы не можем стрелять друг в друга. Призываю всех солдат и их начальство — капитулировать!»"], "p": "Пролог, 1918–1922", "h": "e8f50eb6"}, {"k": "paper", "src": 211, "mast": "Ведомости России", "date": "Петроград", "hd": "Северная армия России", "bd": ["Северо-Западная и Западная добровольческая армии объединены в Северную армию России во главе с Александером Россом. Армия уходит из Прибалтики на русские земли и подписывает с новыми государствами пакт о ненападении."], "q": [], "p": "Пролог, 1918–1922", "h": "5e6fbc35"}, {"k": "paper", "src": 315, "mast": "Ведомости России", "date": "Екатеринбург", "hd": "Табуретов переходит к Крюкову", "bd": ["Армия генерала Табуретова на юге и в Туркестане, от Хивы до Омска, объявила о переходе на сторону Крюкова."], "q": ["«Он спаситель и возродитель моей Родины. Но не той, что увязла в болотах Петербурга, а совершенно новой. За новую Империю!»"], "p": "Пролог, 1918–1922", "h": "bbbeb511"}, {"k": "paper", "src": 357, "mast": "Ведомости России", "date": "Омск", "hd": "Арестован атаман Краснов", "bd": ["Солдаты Табуретова опознали в Омске разыскиваемого атамана Петра Краснова. Попытка бегства не удалась. Табуретов лично везёт его в Москву."], "q": [], "p": "Пролог, 1918–1922", "h": "00772a96"}, {"k": "paper", "src": 366, "mast": "Ведомости России", "date": "Москва", "hd": "Крюков — глава правительства", "bd": ["Крюков объявил Московское правительство центральным, а себя временным главой. Красным генералам и офицерам, сдавшимся добровольно, обещана амнистия. В декабре соберётся Учредительное собрание."], "q": [], "p": "Пролог, 1918–1922", "h": "79365b31"}, {"k": "paper", "src": 376, "mast": "Ведомости России", "date": "Петроград", "hd": "Финская орда отбита", "bd": ["Армия Маннергейма в 300 тысяч штыков пыталась взять Петроград и потеряла 50 тысяч. Росс признаёт правительство Крюкова на трёх условиях: равенство армий, Учредительное собрание в Таврическом дворце, никаких чужих войск в Петрограде."], "q": ["«Мы. Не. Хотим. Воевать! — А. К. Росс»"], "p": "Пролог, 1918–1922", "h": "387d6d11"}, {"k": "say", "t": "Марков добился встречи с бароном Врангелем.", "src": 390, "p": "Пролог, 1918–1922", "on": ["markov", "wrangel"], "x": {}, "music": "Спокойные дни военного", "h": "006cf32a"}, {"k": "say", "t": "Пётр Николаевич, я понимаю, вы обижены этой властью и держите в душе эту обиду. Но поймите: служить нынешней власти — единственный выход.", "src": 390, "w": "markov", "e": {"markov": "original"}, "p": "Пролог, 1918–1922", "h": "3c50d58e"}, {"k": "say", "t": "Эта власть — возрождение той России, за которую мы с вами проливали кровь. К тому же ваш талант полководца незаменим для Родины.", "src": 390, "w": "markov", "e": {"markov": "thinking"}, "p": "Пролог, 1918–1922", "h": "d0bde5ee"}, {"k": "say", "t": "Родина и страна — разные понятия. Я готов служить России лишь потому, что эта власть не уничтожает, а защищает Россию.", "src": 390, "w": "wrangel", "p": "Пролог, 1918–1922", "h": "9916b741"}, {"k": "paper", "src": 413, "mast": "Ведомости России", "date": "Москва", "hd": "Ответ Петрограду", "bd": [], "q": ["«Мы получили сообщение от Росса из Петрограда и отклоняем его. Мы призываем его присягнуть новому правительству, либо он будет объявлен врагом единой России. Северная столица будет освобождена. — А. С. Крюков»"], "p": "Пролог, 1918–1922", "on": [], "x": {}, "h": "0ea78848"}, {"k": "paper", "src": 524, "mast": "Ведомости России", "date": "Москва", "hd": "Раунд реабилитаций", "bd": ["Специальным указом из-под стражи выпущены свыше шести тысяч политических заключённых, в том числе бывший депутат Государственной думы Владислав Ружик. Они пополнят ряды нового правительства."], "q": [], "p": "Пролог, 1918–1922", "h": "ca3d1ad6"}, {"k": "paper", "src": 566, "mast": "Ведомости России", "date": "Москва", "hd": "Возвращение белой легенды", "bd": ["Генерал Врангель официально изъявил готовность служить Второй Империи."], "q": [], "p": "Пролог, 1918–1922", "h": "d8bbb992"}, {"k": "paper", "src": 711, "mast": "Ведомости России", "date": "31 октября 1922 г.", "hd": "Сенсация из Рима", "bd": ["Король Италии поручил сформировать правительство вождю «фашистов» Бенито Муссолини. Европа встревожена: многие видят в «походе на Рим» опасный пример для прочих держав."], "q": [], "p": "Пролог, 1918–1922", "h": "c5b971f7"}, {"k": "paper", "src": 719, "mast": "Ведомости России", "date": "Москва, 1922 г.", "hd": "Указы Московского правительства", "bd": ["Социальные реформы, восьмичасовой рабочий день и прогрессивный налог. Северной столице возвращено имя Санкт-Петербург. Столица перенесена в Москву, создаётся Государственная Дума."], "q": ["«Объявлен курс на восстановление Российской Империи. Кандидат на трон ещё не найден. Регентом объявлен А. С. Крюков»."], "p": "Пролог, 1918–1922", "h": "12628a82"}, {"k": "wire", "src": 744, "from": "В. М. Табуретов", "to": "А. С. Крюкову, Кремль", "tape": ["ПРЕДЛАГАЮ ПРОВЕСТИ ЧТО-ТО ВРОДЕ ЗЕМСКОГО СОБОРА", "У МЕНЯ В РЕЗИДЕНЦИИ В СМОЛЕНСКЕ", "ПОСЛЕ БЕСЕДЫ В КРЕМЛЕ ТЧК"], "p": "Пролог, 1918–1922", "h": "8faeb5eb"}, {"k": "wire", "src": 567, "from": "В. М. Табуретов", "to": "всем, кто владеет русской землёй", "tape": ["16 НОЯБРЯ 10:00 КРЕМЛЬ", "ЯВИТЬСЯ ДОЛЖНЫ ВСЕ", "ГРАЖДАНИН РОСС ТОЖЕ", "ИНАЧЕ ВОЙНУ ПОЛУЧИТЕ НЕЗАМЕДЛИТЕЛЬНО ТЧК"], "p": "Пролог, 1918–1922", "h": "434d0e48"}, {"k": "say", "t": "Кремль. Десять утра.", "src": 757, "p": "Кремль, 16 ноября 1922", "bg": "kremlin_zal", "on": [], "x": {}, "fx": "dust", "cg": "", "id": "kremlin", "h": "05a4b6b9"}, {"k": "say", "t": "В глубине зала, под красным балдахином, стоит трон. Пустой: кандидата на него ещё не нашли.", "added": true, "p": "Кремль, 16 ноября 1922", "h": "135a8ba0"}, {"k": "say", "t": "Юденич и Бермондт-Авалов молча садятся за стол. Росс к столу не идёт. Он встаёт у трибуны.", "src": 757, "p": "Кремль, 16 ноября 1922", "on": ["ross"], "x": {}, "e": {"ross": "unhappy"}, "h": "5cb8058b"}, {"k": "say", "t": "Господа офицеры. Я буду максимально честным, но попробую себя сдерживать.", "src": 757, "w": "ross", "e": {"ross": "original"}, "p": "Кремль, 16 ноября 1922", "h": "13279c96"}, {"k": "say", "t": "Так понимаю, что против Крюкова пошёл я один, а остальные присягнули ему без всяких условий…", "src": 757, "w": "ross", "e": {"ross": "unhappy"}, "p": "Кремль, 16 ноября 1922", "h": "5a8c532d"}, {"k": "say", "t": "Но я не верю, что никто из вас не хотел оказаться на его месте. Я знаю, что значит дать военному хоть каплю абсолютной власти…", "src": 757, "w": "ross", "e": {"ross": "thinking"}, "p": "Кремль, 16 ноября 1922", "h": "8dbe6388"}, {"k": "say", "t": "Эти двое меня достали своими играми за власть в Прибалтике и Петрограде. Поэтому я опасался и до сих пор опасаюсь, что Крюков будет крайне недееспособным лидером.", "src": 757, "w": "ross", "e": {"ross": "unhappy"}, "p": "Кремль, 16 ноября 1922", "h": "7cb757f9"}, {"k": "say", "t": "Скажете, что я тоже хочу власти? Будете абсолютно правы. Но у меня есть смелость этого не скрывать.", "src": 757, "w": "ross", "e": {"ross": "happy"}, "p": "Кремль, 16 ноября 1922", "h": "ab1b92f5"}, {"k": "say", "t": "Тот самый акт я отправил вам, Крюков. Вы его отклонили и заявили, что пойдёте на меня и мою армию силой. Недавно господин Табуретов сказал практически то же самое.", "src": 757, "w": "ross", "e": {"ross": "unhappy"}, "p": "Кремль, 16 ноября 1922", "h": "2e539da0"}, {"k": "say", "t": "У меня вопрос: вы до сих пор считаете себя спасителями нации, после того как пригрозили русскому народу на подконтрольных мне землях?", "src": 757, "w": "ross", "e": {"ross": "angry"}, "p": "Кремль, 16 ноября 1922", "h": "d4343f88"}, {"k": "say", "t": "Да, вы пригрозили именно народу, а не мне! Вы хотели пролить ещё русской крови? Вам мало было войны с большевиками?!", "src": 757, "w": "ross", "e": {"ross": "angry"}, "p": "Кремль, 16 ноября 1922", "h": "5ca9a48c"}, {"k": "say", "t": "Ладно, признаю: с моей стороны акт был дерзкий и… злобный. Но вы не могли пойти со мной на связь?..", "src": 757, "w": "ross", "e": {"ross": "embarassed"}, "p": "Кремль, 16 ноября 1922", "h": "4fa75c25"}, {"k": "say", "t": "Сейчас в этой комнате нет человека, включая меня, который может достойно управлять Россией.", "src": 757, "w": "ross", "e": {"ross": "sad"}, "p": "Кремль, 16 ноября 1922", "h": "33bb11a4"}, {"k": "say", "t": "Ах да, мы же совершили ещё одно маленькое дельце: отбили столицу Российской Империи и защитили её два раза… У Северной армии всё.", "src": 757, "w": "ross", "e": {"ross": "unhappy"}, "p": "Кремль, 16 ноября 1922", "h": "45692c84"}, {"k": "say", "t": "Господин Росс, мы понимаем ваши опасения. Но скажите мне на милость: у нас идёт война, вы присылаете чёртов ультиматум, а потом обвиняете нас в агрессии?!", "src": 764, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Кремль, 16 ноября 1922", "on": ["kryukov", "ross"], "x": {}, "h": "9362f211"}, {"k": "say", "t": "Мы хотим быстрее закончить войну. И когда все согласились прекратить огонь, только вы решили пойти против воли русского народа.", "src": 764, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Кремль, 16 ноября 1922", "h": "2f2d0b39"}, {"k": "say", "t": "Если вы не собираетесь останавливаться, вы будете объявлены диссидентом и предателем, который хочет, чтобы война продолжалась.", "src": 764, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Кремль, 16 ноября 1922", "h": "bc83ebca"}, {"k": "say", "t": "Я требую, чтобы вы не строили из себя незаконно осуждённого героя. Просто сложите оружие, а дальше… а дальше русский народ сделает свой выбор!", "src": 764, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Кремль, 16 ноября 1922", "h": "12ce96fc"}, {"k": "say", "t": "Если мы приехали сюда, значит, мы согласились на условия мира. Я признаю выбор народа. Но мне в любом случае будет тошно.", "src": 766, "w": "ross", "e": {"ross": "sad"}, "p": "Кремль, 16 ноября 1922", "h": "be89279f"}, {"k": "say", "t": "Господа! Хватит нам молчать, пора действовать! Мы боремся за будущее нашего народа. Мы должны договориться, или начнётся третий раунд войны!", "src": 767, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Кремль, 16 ноября 1922", "on": ["taburetov", "kryukov", "ross"], "x": {}, "h": "24c04a68"}, {"k": "say", "t": "Мои люди потеряли много близких! И вы не нападайте на нас, товарищ Росс. Вы тоже не сахар!", "src": 767, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Кремль, 16 ноября 1922", "h": "debde01a"}, {"k": "say", "t": "Господин Росс, если вам тошно, сходите в уборную.", "src": 775, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Кремль, 16 ноября 1922", "h": "4f3fec08"}, {"k": "say", "t": "Я взял Москву, остановил развал России на Кавказе и отбил у британцев желание посягать на нашу землю. От чего же вам тошно? От того, что я дал людям свободу? Интересно…", "src": 775, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Кремль, 16 ноября 1922", "h": "002262bf"}, {"k": "say", "t": "Марковская дивизия при поддержке некоторых соединений за пять дней сможет вернуть Петроград.", "src": 778, "w": "markov", "e": {"markov": "unhappy"}, "p": "Кремль, 16 ноября 1922", "on": ["markov", "kryukov", "ross"], "x": {}, "h": "fcdbc1ac"}, {"k": "say", "t": "Тошно? Тошните! Но не в этом зале! Крюков освободил Москву, Кавказ, Дон, я взял Урал и всю Среднюю Азию!", "src": 779, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Кремль, 16 ноября 1922", "on": ["taburetov", "kryukov", "ross"], "x": {}, "h": "388e62ab"}, {"k": "say", "t": "Я в Брусиловском прорыве жертвовал всем, что мог, ради своих. А вы где в это время были?!", "src": 779, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Кремль, 16 ноября 1922", "h": "c48806ac"}, {"k": "say", "t": "Не волнуйтесь, товарищ Марков. Мы с Крюковым можем и за три.", "src": 781, "w": "taburetov", "e": {"taburetov": "happy"}, "p": "Кремль, 16 ноября 1922", "h": "d6fdb12b"}, {"k": "say", "t": "Господин Росс, сейчас у вас выбор: Россия или смерть. Что вы выберете?", "src": 782, "w": "markov", "e": {"markov": "angry"}, "p": "Кремль, 16 ноября 1922", "on": ["markov", "kryukov", "ross"], "x": {}, "h": "35542027"}, {"k": "say", "t": "Табуретов делает глоток чая.", "src": 783, "p": "Кремль, 16 ноября 1922", "on": ["taburetov", "kryukov", "ross"], "x": {}, "h": "769df4bf"}, {"k": "say", "t": "Если смерть, то вы уже смотрите ей в глаза. Нас тут три облика смерти для врагов.", "src": 783, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Кремль, 16 ноября 1922", "h": "ad5dd9b9"}, {"k": "say", "t": "Господа! Тише! Не надо никому желать смерти. Бог накажет. Надо его выслушать.", "src": 784, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Кремль, 16 ноября 1922", "h": "d08f66d9"}, {"k": "say", "t": "Я был в дерьме! Мы взяли Петроград без вашей помощи! Мы отбили орду финнов, которая шла на вторую столицу!", "src": 785, "w": "ross", "e": {"ross": "angry"}, "p": "Кремль, 16 ноября 1922", "h": "b8d2dd3e"}, {"k": "say", "t": "И как я мог прийти на юг, если все войска стояли на севере, а перебросить их к вам было невозможно?!", "src": 785, "w": "ross", "e": {"ross": "angry"}, "p": "Кремль, 16 ноября 1922", "h": "f5dbaad8"}, {"k": "say", "t": "…А теперь, когда мы выяснили, чьи подвиги лучше, предлагаю закончить наш «любовный разговор» и послушать других.", "src": 785, "w": "ross", "e": {"ross": "unhappy"}, "p": "Кремль, 16 ноября 1922", "h": "fe8f438a"}, {"k": "say", "t": "Так. Мы тут не меряемся подвигами. Мы сражались за общую Родину, за Россию.", "src": 786, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Кремль, 16 ноября 1922", "h": "ecaf4efe"}, {"k": "say", "t": "Мы хотим услышать от вас одно, господин Росс. Вы хотите продолжать бессмысленное побоище или хотите объединить нашу Отчизну?", "src": 786, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Кремль, 16 ноября 1922", "h": "88870a35"}, {"k": "say", "t": "А я в горах! Колчак, Деникин, уральские националисты, сибиряки! Я сражался за Империю, за Родину! Мы все тут за неё!", "src": 787, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Кремль, 16 ноября 1922", "h": "0c658e4a"}, {"k": "say", "t": "Тихо!", "src": 788, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Кремль, 16 ноября 1922", "h": "b6e88119"}, {"k": "say", "t": "Марков делает глоток чая.", "src": 789, "p": "Кремль, 16 ноября 1922", "on": ["markov", "kryukov", "ross"], "x": {}, "h": "a4f3e8cd"}, {"k": "say", "t": "Я сражался в окружении в Карпатских горах, зимой. В семнадцатом пошёл с Корниловым, хотя знал, что это путь к гибели.", "src": 789, "w": "markov", "e": {"markov": "sad"}, "p": "Кремль, 16 ноября 1922", "h": "c7157364"}, {"k": "say", "t": "Я один из отцов Белой гвардии, прошёл льды Дона, был много раз ранен, выходил из десятков окружений. И что же, мне теперь захватывать какую-нибудь русскую землю и удерживать её?", "src": 789, "w": "markov", "e": {"markov": "thinking"}, "p": "Кремль, 16 ноября 1922", "h": "106acbc5"}, {"k": "say", "t": "Так помолчите!", "src": 790, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Кремль, 16 ноября 1922", "on": ["taburetov", "kryukov", "ross"], "x": {}, "h": "7730109e"}, {"k": "say", "t": "…Северная армия России готова сложить оружие.", "src": 792, "w": "ross", "e": {"kryukov": "original", "ross": "sad"}, "p": "Кремль, 16 ноября 1922", "on": ["kryukov", "ross"], "x": {}, "id": "canon", "h": "99172798"}, {"k": "say", "t": "Единственное попрошу: быть аккуратнее с народом, который живёт на наших землях. В Петрограде, Пскове и Новгороде он слишком консервативен. Реформы он будет принимать тяжело.", "src": 792, "w": "ross", "e": {"ross": "original"}, "p": "Кремль, 16 ноября 1922", "h": "aedae5f7"}, {"k": "say", "t": "Наконец-то! Россия, моя Россия снова едина!", "src": 794, "w": "taburetov", "e": {"taburetov": "happy"}, "p": "Кремль, 16 ноября 1922", "on": ["taburetov", "kryukov", "ross"], "x": {}, "h": "07a8bcef"}, {"k": "say", "t": "Товарищ Росс, успокойтесь. Мы хотим только разоружения и вхождения вашей армии в состав наших вооружённых сил.", "src": 795, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Кремль, 16 ноября 1922", "h": "00d8b4c6"}, {"k": "say", "t": "Насчёт вашего народа… Это не ваш народ, это наш народ. Не волнуйтесь, мы о нём позаботимся. А вас мы перенаправим в Санкт-Петербург, там будете временным главой.", "src": 795, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Кремль, 16 ноября 1922", "h": "5656429d"}, {"k": "say", "t": "Марков допивает чай.", "src": 797, "p": "Кремль, 16 ноября 1922", "on": ["markov", "kryukov", "ross"], "x": {}, "h": "412c3414"}, {"k": "say", "t": "Не зря кровь проливал… Россия. Без старого, ставшего родным царя, без многих людей… Но Россия. Не германская, не большевистская, а русская.", "src": 797, "w": "markov", "e": {"markov": "sad"}, "p": "Кремль, 16 ноября 1922", "h": "9e72cfa2"}, {"k": "say", "t": "Господин Крюков, выведите Русь из пропасти. Выведите и дайте ей взлететь!", "src": 797, "w": "markov", "e": {"markov": "happy"}, "p": "Кремль, 16 ноября 1922", "h": "92089856"}, {"k": "paper", "t": "Табуретову приносят свежие газеты. «Кашубских Ребят» печатают русофилы в Вольном городе Данциге.", "src": 769, "mast": "Кашубские Ребята", "date": "Данциг, 15 ноября 1922 г.", "hd": "Кашубия восстала!", "bd": ["С тех пор как Крюков взял Москву, по польским сёлам ходят слухи: в России раздают землю, вводят восьмичасовой день и прощают недоимки. А в Поморье — новые налоги, дороговизна и чиновники из Галиции. Под Картузами крестьяне прогнали сборщиков и разоружили пост полиции."], "q": ["«Это не поляки, это кашубы! Кашубия хочет свободы!»"], "p": "Кремль, 16 ноября 1922", "on": ["taburetov", "kryukov", "markov"], "x": {}, "h": "39d9fc05"}, {"k": "say", "t": "Господа… Тут русские люди восстают в Кашубии.", "src": 798, "w": "taburetov", "e": {"taburetov": "thinking"}, "p": "Кремль, 16 ноября 1922", "h": "d607ecdf"}, {"k": "say", "t": "Нас ждёт большая работа. Мне ещё принимать бывших красных офицеров и генералов, которых обманул Ульянов.", "src": 799, "w": "kryukov", "e": {"kryukov": "thinking"}, "p": "Кремль, 16 ноября 1922", "h": "4cd48ba8"}, {"k": "say", "t": "Отправьте мою дивизию, и Варшава вновь станет русской.", "src": 800, "w": "markov", "e": {"markov": "happy"}, "p": "Кремль, 16 ноября 1922", "h": "77714c83"}, {"k": "say", "t": "Мы можем помочь лишь оружием. Нам не нужна новая война. Однако когда-нибудь Кашубия будет свободна.", "src": 801, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Кремль, 16 ноября 1922", "h": "71727c47"}, {"k": "say", "t": "Да и самого Ульянова с Троцким не помешало бы найти.", "src": 802, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Кремль, 16 ноября 1922", "h": "44808724"}, {"k": "say", "t": "Я должен удалиться на полчаса. Поговорите пока без меня.", "src": 803, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Кремль, 16 ноября 1922", "h": "22bdab35"}, {"k": "say", "t": "Я тоже отправлю добровольцев.", "src": 804, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Кремль, 16 ноября 1922", "on": ["taburetov", "markov", "ross"], "x": {}, "h": "37a2204b"}, {"k": "say", "t": "Марков диктует обращение к русским в Польше.", "src": 807, "p": "Кремль, 16 ноября 1922", "h": "a9b476c5"}, {"k": "say", "t": "Господа! Думаю, вы меня знаете. Я Сергей Марков, русский генерал. И я иду вам на выручку. Нас двадцать пять тысяч, и мы идём разбираться, почему поляки творят беспредел!", "src": 807, "w": "markov", "e": {"markov": "angry"}, "p": "Кремль, 16 ноября 1922", "h": "2606a83c"}, {"k": "say", "t": "Я отказываюсь от предложенной мне должности. Предлагаю отдать её молодому человеку, Владиславу Ружику.", "src": 808, "w": "ross", "e": {"ross": "thinking"}, "p": "Кремль, 16 ноября 1922", "h": "7d170b96"}, {"k": "say", "t": "Я же стану временным министром иностранных дел. Надо восстановить отношения со странами Антанты и попробовать договориться с меньшевиками и другими демократическими левыми партиями.", "src": 808, "w": "ross", "e": {"ross": "original"}, "p": "Кремль, 16 ноября 1922", "h": "8b46ae00"}, {"k": "say", "t": "Вернулся. Как изволите, господин Росс.", "src": 810, "w": "kryukov", "e": {"kryukov": "happy"}, "p": "Кремль, 16 ноября 1922", "on": ["kryukov", "ross"], "x": {}, "music": "Донской бальзам", "h": "9dbc3bba"}, {"k": "say", "t": "У меня хорошие новости. В Киеве Гвардия скинула правительство Скоропадского. Киев — наш, русский!", "src": 811, "w": "kryukov", "e": {"kryukov": "happy"}, "p": "Кремль, 16 ноября 1922", "h": "7b88fc9e"}, {"k": "say", "t": "Ура! Я вернусь туда, где меня крестили!", "src": 813, "w": "taburetov", "e": {"taburetov": "happy"}, "p": "Кремль, 16 ноября 1922", "on": ["taburetov", "kryukov", "ross"], "x": {}, "h": "373f4be0"}, {"k": "say", "t": "Осталась одна встреча, господа. Жду вас в Смоленске, на соборе. Будем выбирать царя.", "src": 794, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Кремль, 16 ноября 1922", "h": "36e2d521"}, {"k": "say", "t": "В тот же час под Картузами уже стреляли.", "src": 791, "p": "Кремль, 16 ноября 1922", "on": [], "x": {}, "music": "", "h": "1c7f047e"}, {"k": "paper", "t": "«Кашубские Ребята» — листок русофильского кружка Святослава Кашубы. Его печатают в Данциге: польская цензура в Вольном городе не действует.", "src": 791, "mast": "Кашубские Ребята", "date": "Картузы", "hd": "Первая кровь", "bd": ["Под Картузами полиция стреляла в толпу, которая не давала описывать скот за недоимки. Убиты семеро крестьян, среди них женщина и подросток. Трое полицейских ранены, один умер в больнице."], "q": ["«Кашубы поднялись! Братья-славяне, Россия с вами!»"], "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "bg": "kashub_selo", "on": [], "x": {}, "fx": "smoke", "cg": "", "music": "Волынянка", "id": "dantsig", "h": "6fad5e95"}, {"k": "say", "t": "Пришли описывать коров за налог. Бабы встали у хлевов, мужики с вилами… Потом стреляли. Кто первый — не знаю.", "src": 796, "w": "witness", "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "385a121c"}, {"k": "say", "t": "Иван Новак, грузчик из данцигского порта, пишет для «Кашубских Ребят».", "added": true, "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "03932129"}, {"k": "say", "t": "Это не восстание. Это бунт голодных деревень, а в русских газетах уже рисуют на карте «Кашубию»… Люди устали от налогов и боятся всех.", "src": 806, "w": "novak", "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "125c74ac"}, {"k": "say", "t": "Но раз Россия протягивает руку — надо её брать. Слава России! Свободу Кашубии!", "src": 809, "w": "novak", "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "4b2ed033"}, {"k": "paper", "src": 805, "mast": "Кашубские Ребята", "date": "Данциг", "hd": "Русские идут на помощь", "bd": ["В Петрограде записываются добровольцы — ехать на помощь «братьям-кашубам»."], "q": ["«Наше дело правое: помочь братьям-славянам, которые требуют свободы и простых человеческих прав»."], "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "0c699c58"}, {"k": "paper", "t": "Польская газета Вольного города.", "mast": "Газета Гданьска", "date": "Данциг", "hd": "Никакой «Кашубии» нет", "bd": ["Бунт под Картузами подняли польские крестьяне, доведённые налогами и дороговизной. Кашубы — поляки, а «кашубское восстание» придумано в Москве и в русофильском листке на московские деньги."], "q": ["«Что кашубское, то польское». — старый лозунг кашубских деятелей"], "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "842b7840"}, {"k": "wire", "src": 812, "from": "генерал В. М. Табуретов", "to": "«Кашубским Ребятам», Данциг", "tape": ["ДОРОГИЕ КАШУБЫ", "ВАС УГНЕТАЮТ КАК ВО ВРЕМЕНА РЕЧИ ПОСПОЛИТОЙ", "ОТПРАВЛЯЮ ВАМ ДОБРОВОЛЬЦЕВ И ОРУЖИЕ МОРЕМ", "СЛАВА
