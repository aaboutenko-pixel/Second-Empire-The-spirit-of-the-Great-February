 РОССИИ ТЧК"], "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "f6b05e37"}, {"k": "paper", "t": "Немецкая газета Вольного города.", "src": 821, "mast": "Данцигер Нойесте Нахрихтен", "date": "Данциг, 17 ноября 1922 г.", "hd": "Сенат просит защиты у Лиги Наций", "bd": ["В сёлах под Картузами стоят польская армия и полиция, идут аресты. В данцигском порту бастуют грузчики. Сенат Вольного города требует от Верховного комиссара Лиги Наций не пустить в город «русскую авантюру»: армии у Данцига нет, только полиция. Варшава требует от Москвы объяснений за обращение генерала Маркова."], "q": ["«Единственный способ устоять — говорить с теми, кто просит хлеба, а не флагов». — британский дипломат в Данциге"], "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "8b8f4e8d"}, {"k": "paper", "src": 831, "mast": "Кашубские Ребята", "date": "Москва", "hd": "Ветеран собрал отряд", "bd": ["Владимир Петрович Иванов, ветеран Великой и Гражданской войн, дважды кавалер Георгиевского креста, взял себе имя Кашубский и набрал в Петрограде отряд — триста с лишним добровольцев. Пароход ушёл в Данциг под видом рабочих для верфи."], "q": ["Москва заявляет, что ничего о нём не знает."], "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "ab258c5d"}, {"k": "paper", "src": 835, "mast": "Ведомости России", "date": "Санкт-Петербург", "hd": "Марков и Табуретов", "bd": ["Вслед за Кашубским ушёл пароход с ротой марковцев: из полка их уволили «по собственному желанию»."], "q": ["Пароход с людьми Табуретова попал в шторм и затонул в Финском заливе. Не все выжили, есть раненые. Следующий отправят не раньше чем через месяц."], "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "2da76c24"}, {"k": "say", "t": "Мы пришли помочь кашубам, полякам и всем, кто борется за свои права и свободу!", "src": 838, "w": "kashubski", "e": {"kashubski": "happy"}, "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "on": ["kashubski"], "x": {}, "h": "c7c7768e"}, {"k": "say", "t": "Отряд высаживается ночью на Висленской косе. Это земля Вольного города: армии здесь нет, а польским войскам сюда хода нет.", "added": true, "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "101cf36c"}, {"k": "say", "t": "Тигенхоф. Пост данцигской полиции сдаётся без единого выстрела, жители сидят по домам.", "src": 841, "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "53ca2666"}, {"k": "say", "t": "Под Данцигом — первая перестрелка с полицией Вольного города и немецкой «самообороной».", "src": 843, "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "7119332f"}, {"k": "say", "t": "Бой за станцию в Праусте. Отряд Дмитрия Ткаченко теряет одиннадцать человек. Станцию берут.", "src": 845, "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "de1b58ee"}, {"k": "say", "t": "До сёл, ради которых они плыли, полдня пути. Но спасать там уже некого: бунт подавлен, на границе стоит польская дивизия.", "added": true, "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "d21c267c"}, {"k": "paper", "t": "В Польше «Кашубских Ребят» запретили, редакцию в Данциге ищет полиция Вольного города.", "src": 834, "mast": "Кашубские Ребята", "date": "Данциг", "hd": "Шестой день", "bd": ["На польской границе у Картуз — первые выстрелы между добровольцами и пограничной стражей. Добровольцев всё больше: одни плывут пароходами, другие едут поездом через Литву и Восточную Пруссию. Дай Бог им здоровья!"], "q": [], "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "38ea7891"}, {"k": "say", "t": "Заявление из Москвы.", "src": 856, "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "bg": "kabinet_emperor", "on": ["kryukov"], "x": {}, "fx": "none", "cg": "", "music": "Императорские проблемы", "h": "5b6942ee"}, {"k": "say", "t": "Россия не посылала за границу ни одного солдата. Все добровольческие отряды за границей сворачиваются. Мы не можем сейчас воевать.", "src": 856, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "e636bdb7"}, {"k": "say", "t": "Добровольцы, сложите оружие перед властями Вольного города. Жители Поморья, идите на мир, иначе Польша вас раздавит.", "src": 856, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "c1a1c60e"}, {"k": "say", "t": "Мы пока слабы. Но мы вернёмся, как будем готовы. Нам нужна передышка после Гражданской войны.", "src": 856, "w": "kryukov", "e": {"kryukov": "sad"}, "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "3e75a418"}, {"k": "paper", "src": 860, "mast": "Московская Правда", "date": "Москва", "hd": "Польско-русский договор", "bd": ["Уполномоченный русский поляк договорился с правительством Юзефа Пилсудского: Россия и Польша признают друг друга и нынешнюю границу, Россия отказывается от поддержки «повстанцев». Добровольцев разоружит полиция Вольного города, а Верховный комиссар Лиги Наций вывезет их морем. Арестованным крестьянам обещана амнистия."], "q": ["Во благо мира! Но… точно ли этот мир будет крепким?"], "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "68c9aab2"}, {"k": "wire", "src": 861, "from": "В. М. Табуретов", "to": "Владимиру Кашубскому", "tape": ["ПРОСТИТЕ ЧТО НЕ СМОГЛИ ПОСТАВИТЬ СОЛДАТ", "ПРЕДЛАГАЕМ ВАМ И ВАШИМ ЛЮДЯМ УБЕЖИЩЕ ОТ ПОЛЬСКОГО ПРАВИТЕЛЬСТВА", "КОРАБЛИ ПРИПЛЫВУТ ЗАВТРА ЖДИТЕ ТЧК"], "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "53065aa7"}, {"k": "wire", "src": 862, "from": "В. М. Табуретов", "to": "А. С. Крюкову", "tape": ["Я ХОЧУ ПРЕДОСТАВИТЬ КАШУБАМ УБЕЖИЩЕ", "ДАЖЕ С АМНИСТИЕЙ ИХ УБЬЮТ", "ЭТО ПОЛЯКИ АЛЕКСЕЙ ТЧК"], "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "df414f74"}, {"k": "say", "t": "Господин Табуретов. Мы не в силах им помочь в данную секунду. Кто хочет бежать — пусть бегут в Россию, их тут ждут. Но кто бы помог сейчас нам?", "src": 865, "w": "kryukov", "e": {"kryukov": "sad"}, "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "2c963113"}, {"k": "wire", "src": 866, "from": "В. М. Табуретов", "to": "А. С. Крюкову", "tape": ["Я ПОМОГУ ИМ", "ТОЧНЕЕ МОИ БРИТАНСКИЕ ДРУЗЬЯ С ИХ КОРАБЛЯМИ", "ОНИ ОТВЕЗУТ ИХ В ПЕТЕРБУРГ", "ЭВАКУАЦИЯ УЖЕ НАЧАТА ТЧК"], "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "30703214"}, {"k": "paper", "mast": "Ведомости России", "date": "Санкт-Петербург", "hd": "Добровольцы вернулись", "bd": ["Британский пароход, нанятый Лигой Наций, доставил из Данцига 287 разоружённых добровольцев и около сотни беженцев из поморских сёл — тех, кому дома грозил суд."], "q": [], "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "21da9bbe"}, {"k": "wire", "src": 873, "from": "Владимир Кашубский", "to": "регенту Алексею Сергеевичу Крюкову", "tape": ["Я УЖЕ ВОЗВРАЩАЮСЬ В РОССИЮ", "УВИДИМСЯ В МОСКВЕ ТЧК"], "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "5678ad35"}, {"k": "paper", "t": "Девять дней в Кашубии закончились.", "src": 886, "mast": "Ведомственные Вести", "date": "Москва", "hd": "Встреча в Кремле", "bd": ["Владимир Кашубский, Дмитрий Ткаченко и Алексей Крюков встретились в Кремле, без журналистов: официально Москва к «походу» отношения не имеет. Добровольцы и беженцы зачислены в батальон «Кашубия» в составе Национальной Гвардии России."], "q": [], "p": "Польское Поморье и Вольный город Данциг, ноябрь 1922", "h": "7b0aecee"}, {"k": "paper", "src": 846, "mast": "Экстренное сообщение", "date": "Москва", "hd": "Покушение на генерала Табуретова", "bd": ["В подмосковном имении Табуретовых устроен поджог, часть дома сгорела. По дороге в больницу в машину генерала бросили гранату. Граната не попала, но задела машину. Табуретов в тяжёлом состоянии."], "q": ["Предположительно покушение связано с реформами, которые готовил Табуретов: армия, образование, экономика."], "p": "Москва, ноябрь 1922", "bg": "bolnitsa", "on": [], "x": {}, "role": {"ross": "временный министр иностранных дел"}, "fx": "none", "cg": "", "music": "Ужас ужасный", "id": "pokusheniya", "h": "5a0b058a"}, {"k": "say", "t": "В палату заходит Марков. Он принёс апельсины.", "src": 847, "p": "Москва, ноябрь 1922", "on": ["markov", "taburetov"], "x": {}, "music": "Финская водка", "e": {"markov": "happy", "taburetov": "original"}, "h": "9fc1a018"}, {"k": "say", "t": "Табуретов быстро идёт на поправку.", "src": 848, "p": "Москва, ноябрь 1922", "h": "d53087b1"}, {"k": "say", "t": "Помимо армии, образования и экономики придётся браться и за медицину.", "src": 848, "w": "taburetov", "e": {"taburetov": "thinking"}, "p": "Москва, ноябрь 1922", "h": "6365d8fe"}, {"k": "wire", "src": 858, "from": "Владимир Кашубский", "to": "В. М. Табуретову", "tape": ["ЗДРАВИЯ ЖЕЛАЮ", "УСЛЫШАЛ О ПОКУШЕНИИ НА ВАШУ ЖИЗНЬ", "ДОЛГИХ И СЧАСТЛИВЫХ ЛЕТ", "НАДЕЮСЬ УБИЙЦ НАЙДУТ И ОНИ ПОНЕСУТ ОТВЕТСТВЕННОСТЬ ТЧК"], "p": "Москва, ноябрь 1922", "h": "c858f410"}, {"k": "wire", "src": 863, "from": "А. С. Крюков", "to": "В. М. Табуретову", "tape": ["МНЕ ДОЛОЖИЛИ О ПОКУШЕНИИ ЭТО ОЧЕНЬ ПЛОХО", "Я НОЧЬ НЕ СПАЛ ДУМАЛ ОБ ЭТОМ", "ПОПРОШУ ГОСПОДИНА РУЖИКА РАССЛЕДОВАТЬ ТЕРАКТ ТЧК"], "p": "Москва, ноябрь 1922", "music": "Императорские проблемы", "h": "b5dcdfd3"}, {"k": "paper", "src": 875, "mast": "Московская Правда", "date": "Москва", "hd": "Новости на сегодняшний день", "bd": ["Крюков неофициально признал Литву, Латвию, Эстонию и Финляндию.", "В Грузии пойман бывший большевик Иосиф Джугашвили (Сталин). Его доставили в Тифлис для разбирательства.", "Объявлено о начале индустриализации и плане ГОЭЛРО.", "Создана Государственная Дума. Главой Думы станет молодой политик, бывший депутат старой Думы и временный глава Санкт-Петербурга Владислав Ружик."], "q": ["Официального названия у державы до сих пор нет, но инсайдеры сообщают об идее Крюкова вернуть монархию."], "p": "Москва, ноябрь 1922", "bg": "kabinet_emperor", "on": [], "x": {}, "cg": "", "h": "4a5f5858"}, {"k": "wire", "src": 891, "from": "В. Ф. Ружик", "to": "А. С. Крюкову", "tape": ["НЕСКАЗАННО БЛАГОДАРЕН ЗА НАЗНАЧЕНИЕ ГЛАВОЙ ДУМЫ", "ПРЕВРАЩУ ДУМУ В ТО ЧЕМ ОНА ДОЛЖНА БЫЛА БЫТЬ С САМОГО НАЧАЛА", "ФОРМИРУЕТСЯ ГРУППА ЛУЧШИХ СЛЕДОПЫТОВ ДЛЯ РАССЛЕДОВАНИЯ ПОКУШЕНИЯ", "ДА ЗДРАВСТВУЕТ ЗАКОН И ПОРЯДОК ТЧК"], "p": "Москва, ноябрь 1922", "h": "823d19d2"}, {"k": "paper", "src": 878, "mast": "Россия", "date": "Москва", "hd": "Реформы, реформы и ещё раз реформы!", "bd": ["Образование: школа становится почти бесплатной, университеты строятся от Владивостока до Киева, от Хивы и Бухары до Петербурга.", "Экономика: индустриализация, изучение ресурсов Сибири. «Аграрная Россия — пережиток прошлого, теперь индустрия!»", "Медицина: новые больницы, курорты на море и в горах, обучение врачей.", "Армия: чёткое командование, новые технологии и легион «Возрождение Руси Святой»."], "q": [], "p": "Москва, ноябрь 1922", "h": "182de82e"}, {"k": "paper", "src": 901, "mast": "Радио «Русь Матушка»", "date": "17 декабря 1922 г.", "hd": "Пожар в Смоленском театре", "bd": ["В 13:23 загорелся Смоленский драматический театр, часть здания сгорела. В этот день туда собирался Табуретов с товарищами и семьёй, но из-за долгой дороги они опоздали и сдали билеты."], "q": ["«Я лично оплачу восстановление и даже крупное обновление театра за свой счёт. Это моя вина. Расследование ведёт глава Думы Ружик, он уже набирает детективов». — Табуретов"], "p": "Москва, ноябрь 1922", "h": "bdc75cf8"}, {"k": "say", "t": "Государственная Дума. Инаугурационная речь Ружика.", "src": 906, "p": "Москва, ноябрь 1922", "bg": "gosduma", "on": ["ruzhik"], "x": {}, "role": {"ruzhik": "глава Думы"}, "cg": "", "h": "23c36bd6"}, {"k": "say", "t": "Дума, ещё не успевшая засесть впервые за пять лет, обсуждает лишь один вопрос — безопасность.", "src": 906, "w": "ruzhik", "e": {"ruzhik": "original"}, "p": "Москва, ноябрь 1922", "h": "7b29716d"}, {"k": "say", "t": "Ещё не начала работу первая группа по расследованию покушения на главу нашего молодого государства, как уже на второго правительственного деятеля совершено покушение!", "src": 906, "w": "ruzhik", "e": {"ruzhik": "unhappy"}, "p": "Москва, ноябрь 1922", "h": "8538f932"}, {"k": "say", "t": "Данная ситуация недопустима! Дума и Верховный главнокомандующий должны немедленно принять закон об ужесточении безопасности в стране!", "src": 906, "w": "ruzhik", "e": {"ruzhik": "angry"}, "p": "Москва, ноябрь 1922", "h": "4a2f0e76"}, {"k": "say", "t": "Некоторые могут сомневаться. Им я задам простой вопрос, после которого у здравомыслящих людей не останется сомнений. По-вашему, что это — совпадение или измена?", "src": 906, "w": "ruzhik", "e": {"ruzhik": "thinking"}, "p": "Москва, ноябрь 1922", "h": "75a3bcf9"}, {"k": "paper", "src": 945, "mast": "Радио «Загадки России»", "date": "Москва", "hd": "Убит секретарь Табуретова", "bd": ["В 7:23 у самых дверей кабинета генерала Табуретова выстрелом из револьвера убита его секретарь, Анна Павловна Мещенко. Неужели её приняли за жену Табуретова? Они ведь и правда похожи."], "q": [], "p": "Москва, ноябрь 1922", "bg": "genshtab", "on": [], "x": {}, "cg": "", "music": "Ужас ужасный", "h": "26e7e344"}, {"k": "say", "t": "Господин Ружик, ваше мнение? Как думаете, кто следующий?", "src": 946, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Москва, ноябрь 1922", "on": ["taburetov"], "x": {}, "h": "b38a80b0"}, {"k": "say", "t": "Париж. Министр иностранных дел России у Луи Барту.", "src": 958, "p": "Париж, январь 1923", "bg": "french_kabinet", "on": ["ross"], "x": {}, "fx": "none", "cg": "", "music": "Московские вечера РП", "id": "parizh", "h": "fab615e0"}, {"k": "say", "t": "Да вы понимаете, что русские делают первый шаг к нормализации отношений, узнав все планы Антанты по разделу моей Родины?! Не вы, западные «союзнички», а мы!", "src": 958, "w": "ross", "e": {"ross": "angry"}, "p": "Париж, январь 1923", "h": "79e8909d"}, {"k": "say", "t": "Говорите аккуратнее, господин Росс. Вы хотите восстановить отношения с Французской республикой или ухудшить?", "src": 958, "w": "barthou", "p": "Париж, январь 1923", "h": "d780686a"}, {"k": "say", "t": "Я могу понять ваш гнев. Мне самому неприятна одна мысль о разделе моей страны. Но мне, как патриоту и члену правительства, приятна перспектива новой колонии и увеличения влияния!", "src": 958, "w": "barthou", "p": "Париж, январь 1923", "h": "89785e1e"}, {"k": "say", "t": "Что ж… Я тоже могу вас понять. Но это не отменяет того, что вы предали своего союзника.", "src": 958, "w": "ross", "e": {"ross": "unhappy"}, "p": "Париж, январь 1923", "h": "dbe49a02"}, {"k": "say", "t": "Ладно… Вы знаете, что в Германии появилась партия фашистов, вроде итальянской? НСДАП, если не ошибаюсь.", "src": 958, "w": "ross", "e": {"ross": "thinking"}, "p": "Париж, январь 1923", "h": "ed67567a"}, {"k": "say", "t": "Знаю, но… Стоп. Вы пришли наладить отношения с Антантой из-за радикально правой партии в одном из самых слабых государств Европы? Вы шутите?", "src": 958, "w": "barthou", "p": "Париж, январь 1923", "h": "c680bdb8"}, {"k": "say", "t": "Я не шучу. Знаете, почему Италия отдалась этому «дуче»? Правительство было неэффективным, экономика в упадке, а война принесла, по сути, одни убытки. И это Италия — победитель.", "src": 958, "w": "ross", "e": {"ross": "original"}, "p": "Париж, январь 1923", "h": "40da69d0"}, {"k": "say", "t": "А теперь вспомните, какие невозможные условия Антанта наложила на Германию, на главного проигравшего. У неё те же проблемы, только намного хуже.", "src": 958, "w": "ross", "e": {"ross": "angry"}, "p": "Париж, январь 1923", "h": "54c22fe1"}, {"k": "say", "t": "Представьте, что будет, если в Германии придёт к власти такой же фашистский диктатор, а под рукой у него будет ещё более разгневанный народ.", "src": 958, "w": "ross", "e": {"ross": "thinking"}, "p": "Париж, январь 1923", "h": "db91d6d1"}, {"k": "say", "t": "Что ж… Чего вы хотите?", "src": 958, "w": "barthou", "p": "Париж, январь 1923", "h": "adb936af"}, {"k": "say", "t": "Россия предлагает расширение торговли, пакт о ненападении со странами Антанты и самые добрые отношения. Со стороны Антанты — то же самое.", "src": 958, "w": "ross", "e": {"ross": "original"}, "p": "Париж, январь 1923", "h": "aad1c574"}, {"k": "say", "t": "Мы принимаем условия.", "src": 958, "w": "barthou", "p": "Париж, январь 1923", "h": "abad6557"}, {"k": "say", "t": "Вернувшись из Франции, Росс берётся за вторую цель: уговорить вождей старых партий прийти на созыв Думы.", "src": 969, "p": "Москва, январь 1923", "bg": "kabinet_mid", "on": ["ross"], "x": {}, "fx": "none", "cg": "", "id": "partii", "h": "7766bc57"}, {"k": "say", "t": "Виктор Михайлович, вы как лидер ПСР должны понимать, что русский народ сейчас не в лучшем состоянии.", "src": 969, "w": "ross", "e": {"ross": "original"}, "p": "Москва, январь 1923", "h": "dc543a30"}, {"k": "say", "t": "Даже наше военное правительство проводит реформы, чтобы людям жилось лучше. Но чтобы провести их успешно, нам нужны левые идеологи. Как вы.", "src": 969, "w": "ross", "e": {"ross": "thinking"}, "p": "Москва, январь 1923", "h": "4b021f6b"}, {"k": "say", "t": "Александер Константинович, я хочу участвовать в созыве Думы, но… Боюсь, эсеры больше не носят титул «социал-демократов». Из-за Савинкова мы несём бремя «террористов».", "src": 969, "w": "chernov", "p": "Москва, январь 1923", "h": "dc41d3d3"}, {"k": "say", "t": "Я попробую уговорить партию прийти. Но если на созыв придёт Савинков, ПСР немедленно уйдёт.", "src": 969, "w": "chernov", "p": "Москва, январь 1923", "h": "2ded2b3b"}, {"k": "say", "t": "Так тому и быть. Спасибо, Виктор Михайлович.", "src": 969, "w": "ross", "e": {"ross": "original"}, "p": "Москва, январь 1923", "h": "2dc42ea9"}, {"k": "say", "t": "Чуть позже.", "src": 969, "p": "Москва, январь 1923", "h": "d198a8ea"}, {"k": "say", "t": "Мария Александровна, я понимаю, что вы являетесь, фактически, одной из самых влиятельных революционерок. Но вы, как лидер левых эсеров, будете более сговорчивой политической фигурой, чем любой тоталитарный большевик.", "added": true, "w": "ross", "e": {"ross": "original"}, "p": "Москва, январь 1923", "h": "00ce0329"}, {"k": "say", "t": "Скоро созыв Думы. Чернов и ПСР согласны прийти. Вы не будете единственной левой партией.", "src": 969, "w": "ross", "e": {"ross": "happy"}, "p": "Москва, январь 1923", "h": "a4e43246"}, {"k": "say", "t": "…Хорошо. Но правительство должно с максимальным уважением относиться ко мне и моей партии. И без всяких сравнений нас с большевиками.", "src": 969, "w": "spiridonova", "p": "Москва, январь 1923", "h": "01001223"}, {"k": "say", "t": "Ради бога! Я договорюсь насчёт этого. Спасибо, что согласились.", "src": 969, "w": "ross", "e": {"ross": "happy"}, "p": "Москва, январь 1923", "h": "006ee15a"}, {"k": "say", "t": "Ещё чуть позже.", "src": 969, "p": "Москва, январь 1923", "h": "2c10cd3c"}, {"k": "say", "t": "Василий Витальевич, простите меня, но среди монархистов вы единственный вменяемый политик. Кого ещё звать? Черносотенцев, которые за царя буквально горы снесут?", "src": 969, "w": "ross", "e": {"ross": "embarassed"}, "p": "Москва, январь 1923", "h": "c9ca7e18"}, {"k": "say", "t": "Александер Константинович, все, как вы говорите, вменяемые — и черносотенцы, и мы. Монархисты не придут на созыв Думы, если не будут участвовать черносотенцы.", "src": 969, "w": "shulgin", "p": "Москва, январь 1923", "h": "cb87af55"}, {"k": "say", "t": "…Ладно, пусть так. Только попросите их не орать на весь зал монархические выкрики.", "src": 969, "w": "ross", "e": {"ross": "unhappy"}, "p": "Москва, январь 1923", "h": "d957afd5"}, {"k": "paper", "src": 947, "mast": "Московский Вестник", "date": "18 января 1923 г.", "hd": "Покушение на Дмитрия Ткаченко", "bd": ["Во время выступления в Москве в 15:34 неизвестный выстрелил в соратника Кашубского. Пуля попала в плечо, через десять минут раненого доставили в больницу. Стрелка ищут."], "q": [], "p": "Москва, январь 1923", "bg": "bolnitsa", "on": [], "x": {}, "fx": "none", "cg": "", "music": "Ужас ужасный", "id": "tkachenko", "h": "fb051182"}, {"k": "say", "t": "Табуретов приезжает в больницу.", "src": 948, "p": "Москва, январь 1923", "on": ["taburetov", "tkachenko"], "x": {}, "music": "Финская водка", "h": "c2cfddb7"}, {"k": "say", "t": "Мистер Ткаченко, здравствуйте! Как здоровье?", "src": 948, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Москва, январь 1923", "h": "0bbf2d57"}, {"k": "say", "t": "Нормально. Я просто ранен.", "src": 949, "w": "tkachenko", "p": "Москва, январь 1923", "h": "d6570601"}, {"k": "say", "t": "Ой, понятно… За вами тоже, что ли, охоту начали? Я уже из дома редко вылезаю, чтобы опять не сгореть или, как вы, пулю не словить. Только в лоб.", "src": 950, "w": "taburetov", "e": {"taburetov": "thinking"}, "p": "Москва, январь 1923", "h": "04668f5b"}, {"k": "say", "t": "Я не знаю, но вероятность есть. Меня однажды чуть не убили по дороге в Данциг, на восьмой день восстания, когда мы сражались с немцами и поляками.", "src": 951, "w": "tkachenko", "p": "Москва, январь 1923", "h": "7a8608b6"}, {"k": "say", "t": "А меня сколько раз уже пытались убить… Ой, не помню.", "src": 953, "w": "taburetov", "e": {"taburetov": "embarrased"}, "p": "Москва, январь 1923", "h": "c85d5912"}, {"k": "say", "t": "Как вы, коллега?", "src": 955, "w": "kashubski", "e": {"kashubski": "sad"}, "p": "Москва, январь 1923", "on": ["taburetov", "tkachenko", "kashubski"], "x": {}, "h": "548c6b4d"}, {"k": "say", "t": "Нормально.", "src": 956, "w": "tkachenko", "p": "Москва, январь 1923", "h": "14c17e41"}, {"k": "say", "t": "Хорошо, что вы выжили.", "src": 957, "w": "kashubski", "e": {"kashubski": "happy"}, "p": "Москва, январь 1923", "h": "85849976"}, {"k": "wire", "src": 959, "from": "Святослав Кашуба", "to": "Дмитрию Ткаченко", "tape": ["ЗДРАВСТВУЙТЕ КАК ВАШЕ САМОЧУВСТВИЕ", "НАДЕЮСЬ ВЫ ПОПРАВИТЕСЬ", "ПРОШУ ПЕРЕДАТЬ ВЛАДИМИРУ ПЕТРОВИЧУ ПРИВЕТ ОТ ВСЕХ КАШУБОВ ТЧК"], "p": "Москва, январь 1923", "on": [], "x": {}, "h": "67d9480d"}, {"k": "paper", "src": 970, "mast": "Московский Вестник", "date": "24 января 1923 г.", "hd": "Дмитрий Ткаченко вылечился!", "bd": ["Ему перелили кровь утром 19 января — группа подошла идеально, и на следующий день раненый почувствовал себя намного лучше. Сегодня Ткаченко выписан из больницы."], "q": [], "p": "Москва, январь 1923", "on": [], "x": {}, "h": "961a9b27"}, {"k": "paper", "src": 972, "mast": "Ведомственные Вести", "date": "5 февраля 1923 г.", "hd": "Полицейский предотвратил теракт", "bd": ["В Кеми патрульный Павел Глебович задержал подозрительного человека. Им оказался немецкий анархист Ганс Шнайдер, который в прошлом году заложил бомбу в продуктовом магазине в Архангельске. Его судят в Петрозаводске."], "q": [], "p": "Москва, январь 1923", "bg": "gosduma", "cg": "", "music": "Товарищ полицейский", "h": "0285bafb"}, {"k": "say", "t": "Готовится экстренное заседание Думы.", "src": 952, "p": "Москва, январь 1923", "on": ["ruzhik"], "x": {}, "h": "6a4509cc"}, {"k": "doc", "t": "Документ передан на подписание Верховному главнокомандующему.", "src": 973, "title": "Закон №1 от 1 февраля 1923 года. Принят в третьем чтении", "items": ["1. Приставить к каждому государственному служащему высших рангов личную охрану от двух человек; разрешено запрашивать больше охраны у местных участковых.", "2. Увеличить число полицейских во всех инстанциях в полтора раза.", "3. Запретить радикальные газеты и кружки, призывающие к экстремистским действиям.", "4. Разрешить всем судьям выдавать ордер на обыск любых помещений, вне зависимости от титула и ранга.", "5. Временно, на год, запретить митинги любого характера.", "6. Поставить на учёт всех осуждённых за политический терроризм или радикальную политическую деятельность."], "p": "Москва, январь 1923", "h": "ec26b0ab"}, {"k": "doc", "src": 973, "title": "Закон №1 от 1 февраля 1923 года (окончание)", "items": ["7. Создать Объединённое государственное политическое управление (ОГПУ) и назначить его руководителем Н. А. Зарывалова.", "7.1. Выдать ОГПУ чрезвычайные полномочия сроком на один год.", "7.2. Чрезвычайные полномочия формирует сам орган и передаёт на рассмотрение Думы.", "8. Дума вправе продлевать данные законы на неограниченный срок.", "8.1. Дума и Верховный главнокомандующий вправе вносить правки в документ без уведомления друг друга.", "9. Документ вступает в силу с подписанием Верховным главнокомандующим и прекращает действие отдельным актом."], "p": "Москва, январь 1923", "h": "a391eebe"}, {"k": "say", "t": "Лубянка. Николай Александрович Зарывалов, глава нового ведомства.", "added": true, "p": "Москва, Лубянка, февраль 1923", "bg": "kabinet_mgb", "on": ["zaryvalov"], "x": {}, "fx": "none", "cg": "", "id": "ogpu", "h": "cc6b7f30"}, {"k": "say", "t": "Кабинет председателя ОГПУ. К Зарывалову заходит Леонид Андреевич Антонов-Овсеенко.", "added": true, "p": "Москва, Лубянка, февраль 1923", "h": "45359a01"}, {"k": "say", "t": "Поздравляю вас с назначением, Николай Саныч!", "added": true, "w": "antonov_ovseenko", "p": "Москва, Лубянка, февраль 1923", "on": ["zaryvalov", "antonov_ovseenko"], "x": {}, "h": "58b81081"}, {"k": "say", "t": "Благодарю, конечно, только вот врагу не пожелаешь в таком положении да на такой должности наводить порядок. Потому вы, Леонид Андреевич, будете обязаны мне помочь в наведении порядка.", "added": true, "w": "zaryvalov", "e": {"zaryvalov": "unhappy"}, "p": "Москва, Лубянка, февраль 1923", "h": "aabe9992"}, {"k": "say", "t": "О чём разговор, господин Зарывалов! Конечно же, помогу и сделаю всё, что в моих силах!", "added": true, "w": "antonov_ovseenko", "p": "Москва, Лубянка, февраль 1923", "h": "039b144f"}, {"k": "say", "t": "Помимо вас нам поможет ещё и Уржумов, я его тоже просил в наше новое министерство.", "added": true, "w": "zaryvalov", "e": {"zaryvalov": "original"}, "p": "Москва, Лубянка, февраль 1923", "h": "f89cd415"}, {"k": "say", "t": "Уржумова? Этот… Он нам сильно нужен?", "added": true, "w": "antonov_ovseenko", "p": "Москва, Лубянка, февраль 1923", "h": "38584b4d"}, {"k": "say", "t": "Конечно, нужен. Он толковый человек, не смотри, что краснопёрый. Или вы что, против имеете?", "added": true, "w": "zaryvalov", "e": {"zaryvalov": "unhappy"}, "p": "Москва, Лубянка, февраль 1923", "h": "74de6f61"}, {"k": "say", "t": "Нет-нет, Николай Саныч, вы что? Я только за.", "added": true, "w": "antonov_ovseenko", "p": "Москва, Лубянка, февраль 1923", "h": "b1d21c46"}, {"k": "say", "t": "Вот и отлично.", "added": true, "w": "zaryvalov", "e": {"zaryvalov": "happy"}, "p": "Москва, Лубянка, февраль 1923", "h": "c868945d"}, {"k": "say", "t": "Не сегодня — завтра с раннего утра необходимо провести совещание среди всех высокопоставленных офицеров, чтобы разобраться с нашими полномочиями. Их в Думу надо внести как можно скорее, в противном случае беспорядки выйдут на кардинально новый уровень. Нам этого не надо.", "added": true, "w": "zaryvalov", "e": {"zaryvalov": "thinking"}, "p": "Москва, Лубянка, февраль 1923", "h": "e8b9ecf0"}, {"k": "say", "t": "Утро. Первое собрание ОГПУ.", "added": true, "p": "Москва, Лубянка, февраль 1923", "on": ["zaryvalov"], "x": {}, "h": "fca0f07a"}, {"k": "say", "t": "Итак, господа. На наше новое министерство, Объединённое государственное политическое управление, взвалились огромные задачи и полномочия.", "added": true, "w": "zaryvalov", "e": {"zaryvalov": "original"}, "p": "Москва, Лубянка, февраль 1923", "h": "652eb33e"}, {"k": "say", "t": "То, что происходит сейчас на улицах городов России, — беспредел и бардак. И иного названия этому нет.", "added": true, "w": "zaryvalov", "e": {"zaryvalov": "angry"}, "p": "Москва, Лубянка, февраль 1923", "h": "1eee4cf7"}, {"k": "say", "t": "Наша с вами задача — навести порядок. Чтобы в первую очередь каждый гражданин и житель нашей страны был в безопасности. Чтобы ни одна падаль даже на метр не приблизилась с целью свержения нынешней власти.", "added": true, "w": "zaryvalov", "e": {"zaryvalov": "angry"}, "p": "Москва, Лубянка, февраль 1923", "h": "9d2bac83"}, {"k": "say", "t": "Ближайший год ОГПУ имеет чрезвычайные полномочия, каковые мы с вами сейчас должны составить и предоставить в Думу. В первую очередь ОГПУ будет нацелено на наведение порядка в Москве и Петербурге, а уже после — и в других городах России…", "added": true, "w": "zaryvalov", "e": {"zaryvalov": "original"}, "p": "Москва, Лубянка, февраль 1923", "h": "85f1aa62"}, {"k": "doc", "title": "Приказ ОГПУ №000001 от 2 февраля 1923 года", "items": ["Законом №1 от 01.02.1923 г. правительства принято решение:", "1. Создать Объединённое государственное политическое управление (ОГПУ) во главе с Зарываловым Николаем Александровичем.", "2. Выдать сроком на 1 год ОГПУ чрезвычайные полномочия.", "3. Сформировать органом ОГПУ чрезвычайные полномочия, предоставить их на рассмотрение правительству.", "На основе закона №1 от 01.02.1923 г. приказываю:", "1. Создать в составе ОГПУ отдел Всероссийской Чрезвычайной Комиссии (ВЧК).", "2. Назначить на должность руководителя ВЧК Уржумова К. А.", "3. Передать всю полноту полномочий над отделом ВЧК Уржумову К. А.", "4. Уржумову К. А. сформировать и предоставить чрезвычайные полномочия.", "5. Назначить Антонова-Овсеенко Л. А. на должность первого заместителя председателя ОГПУ.", "Председатель ОГПУ Зарывалов Н. А."], "p": "Москва, Лубянка, февраль 1923", "on": [], "x": {}, "h": "1192b7aa"}, {"k": "doc", "title": "Приказ ОГПУ №000002 от 3 февраля 1923 года", "items": ["Приказом №000001 от 02.02.1923 г. ОГПУ установлено создание Всероссийской Чрезвычайной Комиссии во главе с Уржумовым К. А.", "На основании приказа №000001 от 02.02.1923 г. ОГПУ приказываю: создать во всех областных центрах особые вооружённые отряды в составе ВЧК и наделить их следующими полномочиями и правами:", "1. Право временного заключения в концентрационный лагерь лиц, пойманных при попытке подрыва государственной власти путём диверсий, поджогов и иных действий, направленных на повреждение государственных учреждений и путей сообщения.", "2. Право ликвидации диверсантов, лиц, участвовавших в подрывах, поджогах, повреждении путей сообщения, и прочих действий, целью которых является подрыв государственной власти.", "3. Право ликвидации лиц, явно угрожающих существованию государства или явно угрожающих жизни и здоровью граждан, без решения судебных органов.", "Председатель ОГПУ Зарывалов Н. А."], "p": "Москва, Лубянка, февраль 1923", "h": "7d0eb7e2"}, {"k": "paper", "src": 979, "mast": "Ведомости России", "date": "13 февраля 1923 г.", "hd": "Стрелявший в Ткаченко расстрелян", "bd": ["Человека, стрелявшего в Дмитрия Ткаченко, нашли 7 февраля. Это Болеслав Ковальчук. Мотив политический: Ткаченко, Кашубского и Глюга он считал «москальскими агентами», и следующим должен был стать Кашубский. На суде Ковальчук отказывался говорить по-русски, кричал и бросался на полицейских. Психиатры признали его вменяемым. Приговор — расстрел."], "q": [], "p": "Москва, Лубянка, февраль 1923", "bg": "lubianka_prison", "on": [], "x": {}, "cg": "", "h": "aa5a6199"}, {"k": "paper", "src": 982, "mast": "Ведомости России", "date": "Москва", "hd": "Ленин и Троцкий пойманы!", "bd": ["После долгой и усердной работы беглые предатели Родины пойманы в Германии и доставлены в Россию. Граждане могут спать спокойно."], "q": [], "p": "Москва, Лубянка, февраль 1923", "h": "05970e5a"}, {"k": "paper", "src": 989, "mast": "Московская Правда", "date": "Москва", "hd": "Сдался Будённый", "bd": ["Семён Михайлович Будённый сдался в плен. Как и обещал Крюков, он будет реабилитирован: красных генералов и солдат, которые сдаются добровольно и присягают новому правительству, не преследуют."], "q": [], "p": "Москва, Лубянка, февраль 1923", "h": "4321577c"}, {"k": "paper", "src": 990, "mast": "Экстренное сообщение из Смоленска", "date": "Смоленск", "hd": "Третье покушение за год", "bd": ["Во время прогулки Табуретова с семьёй по Смоленску неизвестный открыл огонь. Личная охрана из легиона «ВРС» укрыла генерала в мясном магазине. Табуретов и его семья невредимы, охрана получила лёгкие ранения."], "q": [], "p": "Москва, Лубянка, февраль 1923", "bg": "sad_usadba_no_car", "cg": "", "music": "Ужас ужасный", "h": "a90b686f"}, {"k": "say", "t": "Третье покушение за год, а я всё ещё жив, ха!", "src": 990, "w": "taburetov", "e": {"taburetov": "happy"}, "p": "Москва, Лубянка, февраль 1923", "on": ["taburetov"], "x": {}, "music": "Ну полная Лодка!", "h": "71227d25"}, {"k": "paper", "src": 1017, "mast": "Национальная Гвардия", "date": "11 февраля 1923 г.", "hd": "Медаль «За участие в Кашубском восстании»", "bd": ["В батальоне «Кашубия» прошли первые награждения. Некоторым участникам вместе с медалью вручены Георгиевские кресты. Тела погибших добровольцев — их больше двадцати — везут из Данцига, их похоронят на поле недалеко от Москвы."], "q": [], "p": "Москва, Лубянка, февраль 1923", "on": [], "x": {}, "music": "", "h": "59e4b181"}, {"k": "paper", "src": 1025, "mast": "Россия", "date": "Москва", "hd": "Образование — всем!", "bd": ["Спустя пару месяцев после реформ Табуретова грамотность населения выросла на 16%. Профессора Оксфорда прогнозируют, что к 1930 году грамотными будут около 80% жителей России."], "q": [], "p": "Москва, Лубянка, февраль 1923", "h": "0cbe07e4"}, {"k": "paper", "src": 1037, "mast": "Ведомости России", "date": "Лос-Анджелес", "hd": "«9 дней в Кашубии»", "bd": ["Одна из американских студий снимет фильм о кашубском восстании с актёрами Голливуда и предлагает Владимиру Кашубскому участие в работе."], "q": [], "p": "Москва, февраль 1923", "bg": "kabinet_emperor", "on": [], "x": {}, "fx": "none", "cg": "", "music": "Финская водка", "id": "film", "h": "b0429655"}, {"k": "wire", "src": 1039, "from": "Владимир Кашубский", "to": "студии Льюиса Карлайна", "tape": ["ОДОБРЯЮ", "ГОТОВ ПРИСЛАТЬ ХРОНИКИ ИЗ АРХИВОВ", "А ЕСЛИ СОЧИНИТЕ ПЕСНЮ 9 ДНЕЙ В КАШУБИИ БУДЕТ ИДЕАЛЬНО ТЧК"], "p": "Москва, февраль 1923", "h": "572815c9"}, {"k": "wire", "src": 1053, "from": "Льюис Карлайн, глава студии", "to": "Владимиру Кашубскому", "tape": ["СПАСИБО ЖДЁМ ВАС В ЛОС-АНДЖЕЛЕСЕ С МИСТЕРОМ КРЮКОВЫМ НА СЪЁМКИ И ПОКАЗ", "НА ПОКАЗЕ ВОЗМОЖНО БУДЕТ ВИЦЕ-ПРЕЗИДЕНТ США", "ПЕСНЯ ТОЖЕ БУДЕТ ТЧК"], "p": "Москва, февраль 1923", "h": "0d4a5d19"}, {"k": "say", "t": "Кашубский приглашает на премьеру Крюкова, Табуретова, Маркова и Глюга.", "src": 1066, "p": "Москва, февраль 1923", "on": ["kryukov", "kashubski"], "x": {}, "music": "Московские вечера РП", "e": {"kryukov": "original", "kashubski": "original"}, "h": "ecb5ec4d"}, {"k": "say", "t": "Господин, я бы не был так рад кашубскому восстанию в Польше и в Данциге.", "src": 1068, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Москва, февраль 1923", "h": "52ec006a"}, {"k": "say", "t": "Если мы будем открыто поддерживать подобные события, от нас отвернётся весь мир. А нам ещё с Антантой восстанавливать отношения. Уверен, господин Росс со мной согласится.", "src": 1068, "w": "kryukov", "e": {"kryukov": "thinking"}, "p": "Москва, февраль 1923", "h": "ef6fecc6"}, {"k": "say", "t": "Я вас понял. Будет премьера документального фильма о тех событиях, только и всего.", "src": 1069, "w": "kashubski", "e": {"kashubski": "embarassed"}, "p": "Москва, февраль 1923", "h": "e2fadaf7"}, {"k": "say", "t": "Я не говорю, что рад восстанию. Это безусловно трагедия. Но в следующий раз не будем открыто поддерживать такие события.", "src": 1069, "w": "kashubski", "e": {"kashubski": "sad"}, "p": "Москва, февраль 1923", "h": "3791771b"}, {"k": "say", "t": "Я согласен с Крюковым. С Францией Россия наладила отношения, и то встреча была напряжённой. А когда весь мир узнает о Кашубии, нас могут счесть варварами, которые решают проблемы кулаками, а не словом.", "src": 1073, "w": "ross", "e": {"ross": "unhappy"}, "p": "Москва, февраль 1923", "on": ["kryukov", "kashubski", "ross"], "x": {}, "h": "d884cf9b"}, {"k": "say", "t": "Я скоро отправлюсь в Соединённые Штаты на встречу. Если не забуду, попробую уговорить их показать фильм…", "src": 1073, "w": "ross", "e": {"ross": "thinking"}, "p": "Москва, февраль 1923", "h": "e0672a2e"}, {"k": "letter", "src": 1091, "head": "Владимиру Кашубскому от В. М. Табуретова, Военная резиденция, Москва", "sign": "Табуретов", "body": ["Здравствуйте, Владимир! Я обязательно приехал бы, но, как вы знаете, на меня буквально открыли охоту. Выходить в свет опасно даже с охраной.", "Но фильм я обязательно посмотрю!"], "p": "Москва, февраль 1923", "h": "e0f32aa0"}, {"k": "say", "t": "Вашингтон. Белый дом.", "src": 1076, "p": "Вашингтон, 1923", "bg": "usa_president_kabinet", "on": ["ross"], "x": {}, "fx": "none", "cg": "", "id": "ssha", "h": "df08232d"}, {"k": "say", "t": "Итак, вы предлагаете Соединённым Штатам расширенную торговлю, пакт о ненападении и хорошие отношения. А взамен просите разорвать торговлю с Японией и прекратить давать деньги Германии.", "src": 1076, "w": "colby", "p": "Вашингтон, 1923", "h": "5084dc44"}, {"k": "say", "t": "Может, вы ещё попросите простить долги Антанте и вам? Между прочим, с Японией и Европой торговать намного выгоднее, чем с вами!", "src": 1076, "w": "colby", "p": "Вашингтон, 1923", "h": "76c1538f"}, {"k": "say", "t": "Вас интересуют только деньги и их экономия, а о последствиях вы не думаете! Милитаризация и амбиции Японской империи растут быстрыми темпами.", "src": 1076, "w": "ross", "e": {"ross": "angry"}, "p": "Вашингтон, 1923", "h": "78fa101c"}, {"k": "say", "t": "В Германии набирают силу реваншистские настроения, а вместе с ними и новая фашистская партия, вроде итальянской!", "src": 1076, "w": "ross", "e": {"ross": "angry"}, "p": "Вашингтон, 1923", "h": "5a71bf9e"}, {"k": "say", "t": "Господин Росс, Соединённые Штаты отказываются от вашего предложен…", "src": 1076, "w": "colby", "p": "Вашингтон, 1923", "h": "2eac3e12"}, {"k": "say", "t": "Стойте, пока вы не договорили! Россия сняла документальный фильм про события в Кашубии. Покажите его в ваших кинотеатрах.", "src": 1076, "w": "ross", "e": {"ross": "shocked"}, "p": "Вашингтон, 1923", "h": "7449ae19"}, {"k": "say", "t": "Мы рассмотрим эту просьбу. Что-то ещё?", "src": 1076, "w": "colby", "p": "Вашингтон, 1923", "h": "654dafae"}, {"k": "say", "t": "…Ах да. Выдайте на суд России Александра Фёдоровича Керенского.", "src": 1076, "w": "ross", "e": {"ross": "thinking"}, "p": "Вашингтон, 1923", "h": "bd1a4789"}, {"k": "paper", "src": 1080, "mast": "Московская Правда", "date": "Урга", "hd": "Монголия просит протекторат", "bd": ["Монголия объявила, что все укрывавшиеся в стране большевики разбиты. Официального правительства у страны нет, и она просит Россию взять её под протекторат и защитить от Китая, который не признаёт её независимости."], "q": [], "p": "Вашингтон, 1923", "bg": "kabinet_emperor", "on": [], "x": {}, "cg": "", "h": "7ec3bd33"}, {"k": "letter", "src": 1086, "head": "Секретно. Товарищу Иванову (Кашубскому) от Крюкова А. С.", "sign": "Крюков", "body": ["Пишу вам о том, что Кашубия и город Данциг могут стать отличной опорой нашей внешней политики.", "Вам надо тайно убеждать поляков, что они кашубы, отделяя эту ветвь польского народа. Напомню, большевики проводили коренизацию — политика интересная и кое в чём действенная.", "Также напомню, что там живёт огромное количество немцев, которых в кашубов уже не превратить. Учтите это. Кашубов мало, но надо сделать их больше."], "p": "Вашингтон, 1923", "h": "81ca3fbd"}, {"k": "wire", "src": 1090, "from": "Владимир Кашубский", "to": "Святославу Кашубе", "tape": ["ДАВАЙТЕ НА БАЗЕ ЖУРНАЛА КАШУБСКИЕ РЕБЯТА СДЕЛАЕМ ПОДПОЛЬНУЮ ГАЗЕТУ СВОБОДНАЯ КАШУБИЯ", "ТОЛЬКО НИКОМУ НЕ ГОВОРИТЕ", "ОНА ДОЛЖНА РАБОТАТЬ В ПОДПОЛЬЕ ТЧК"], "p": "Вашингтон, 1923", "h": "f776321b"}, {"k": "wire", "src": 1107, "from": "Святослав Кашуба", "to": "Владимиру Кашубскому", "tape": ["ПРИНИМАЮ ПРЕДЛОЖЕНИЕ БУДЕМ РАБОТАТЬ ВМЕСТЕ", "СОЗДАМ КАШУБСКОЕ ПОДПОЛЬНОЕ ДВИЖЕНИЕ ТЧК"], "p": "Вашингтон, 1923", "h": "1cbae4ef"}, {"k": "paper", "src": 1201, "mast": "Ведомости России", "date": "Калифорния", "hd": "«9 дней в Кашубии» вышел в прокат", "bd": ["Рейтинг фильма держится на отметке «хорошо», критики довольны, кассовые сборы растут. Российская делегация — Крюков, Кашубский, Ткаченко, Марков, Глюг и Иван Новак — хорошо оценила фильм и поблагодарила за показ."], "q": [], "p": "Вашингтон, 1923", "music": "Финская водка", "h": "2eb1e4ad"}, {"k": "paper", "src": 1528, "mast": "Варшавский Вестник", "date": "15 апреля 1923 г.", "hd": "Беспорядки на Восточных Кресах", "bd": ["В Волынском и Полесском воеводствах резко обострилась обстановка. Поступления налогов упали до критического уровня, сотни тысяч крестьян и рабочих бастуют, во Львове и Луцке учащаются теракты против польской администрации.", "Одной из центральных фигур движения называют Юрия Александровича Луненко, уроженца Волыни, — непримиримого агитатора за отделение от Польши, открыто симпатизирующего новому российскому лидеру Алексею Крюкову."], "q": ["Варшава призывает к спокойствию и обещает решительные меры."], "p": "Варшава, апрель 1923", "bg": "volhynia_ambar", "on": [], "x": {}, "fx": "none", "cg": "", "music": "Московские вечера РП", "id": "kresy", "h": "a7293343"}, {"k": "wire", "src": 1217, "from": "В. М. Табуретов", "to": "А. С. Крюкову", "tape": ["К ВЫБОРУ НОВОГО ИМПЕРАТОРА ВСЁ ГОТОВО", "ВСТРЕЧАЕМСЯ В СМОЛЕНСКЕ ПОСЛЕЗАВТРА", "СОБЕРУТСЯ ВСЕ ПРОМЫШЛЕННИКИ БЫВШИЕ КНЯЗЬЯ ГУБЕРНАТОРЫ АРИСТОКРАТЫ ВЫСШИЕ ЧИНЫ АРМИИ", "ВСЁ ПРОЙДЁТ В МОЁМ ИМЕНИИ ЗА ГОРОДОМ ТЧК"], "p": "Москва — Смоленск, конец августа 1923", "bg": "kabinet_emperor", "on": [], "x": {}, "fx": "none", "cg": "", "music": "Хитрость Табуретова", "id": "pered_soborom", "h": "7ed74a17"}, {"k": "wire", "src": 1221, "from": "А. С. Крюков", "to": "В. М. Табуретову", "tape": ["СКАЖИТЕ ПОЖАЛУЙСТА КАНДИДАТЫ ИМЕЮТСЯ", "КТО МОЖЕТ СТАТЬ НОВЫМ ИМПЕРАТОРОМ РОССИИ ТЧК"], "p": "Москва — Смоленск, конец августа 1923", "h": "3fa7319c"}, {"k": "wire", "src": 1232, "from": "В. М. Табуретов", "to": "А. С. Крюкову", "tape": ["Я ПИСАЛ НЕКОТОРЫМ ПОТОМКАМ РОМАНОВЫХ", "ЕСТЬ ПАРА КАНДИДАТОВ НО ОНИ СКОРЕЕ ВСЕГО ПРОИГРАЮТ", "ЕСТЬ АРИСТОКРАТЫ И ПРОМЫШЛЕННИКИ", "ТАК ЧТО СКОРЕЕ ВСЕГО ВЫ НОВЫЙ ПРАВИТЕЛЬ РОССИИ ТЧК"], "p": "Москва — Смоленск, конец августа 1923", "h": "a02efd7f"}, {"k": "wire", "src": 1239, "from": "А. С. Крюков", "to": "В. М. Табуретову", "tape": ["Я", "ВЫ ШО ГОСПОДИН", "Я НЕ ГОТОВ К ТИТУЛУ ИМПЕРАТОРА", "РОМАНОВЫ НАМ НЕ НУЖНЫ ЖАЛКИЕ ПРЕДАТЕЛИ РОДИНЫ", "БУДЕМ ИСКАТЬ ИНЫХ КАНДИДАТОВ ТЧК"], "p": "Москва — Смоленск, конец августа 1923", "h": "98e0d250"}, {"k": "wire", "src": 1245, "from": "В. М. Табуретов", "to": "А. С. Крюкову", "tape": ["ЭТО ВЫ БЕЗУМЕЦ КРЮКОВ", "ВЫ СЕЙЧАС ОТДАЁТЕ РОССИЮ КОМУ ПОПАЛО", "ВАШУ КАНДИДАТУРУ ВЫБЕРУТ ДАЖЕ ЕСЛИ НАЙДЁТЕ ЛУЧШЕГО", "ДАЖЕ ЕСЛИ ПРЕДЛОЖИТЕ МЕНЯ Я ОТКАЖУСЬ И ОТРЕКУСЬ ТЧК"], "p": "Москва — Смоленск, конец августа 1923", "h": "a3abfe72"}, {"k": "say", "t": "Ответа не было. Табуретов отправил телеграмму ещё раз.", "src": 1247, "p": "Москва — Смоленск, конец августа 1923", "h": "8a0659f3"}, {"k": "wire", "src": 1270, "from": "Глюг", "to": "В. М. Табуретову", "tape": ["Я МОГУ СТАТЬ НОВЫМ ИМПЕРАТОРОМ РОССИИ ТЧК"], "p": "Москва — Смоленск, конец августа 1923", "h": "3f56dd53"}, {"k": "wire", "src": 1271, "from": "В. М. Табуретов", "to": "Глюгу", "tape": ["ХОРОШО ТЧК"], "p": "Москва — Смоленск, конец августа 1923", "h": "4cd03666"}, {"k": "say", "t": "Табуретов звонит в Кремль.", "src": 1272, "p": "Москва — Смоленск, конец августа 1923", "on": ["taburetov", "kryukov"], "x": {}, "e": {"taburetov": "original", "kryukov": "original"}, "h": "ed81a1bc"}, {"k": "say", "t": "Крюков слушает.", "src": 1273, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Москва — Смоленск, конец августа 1923", "h": "613dde91"}, {"k": "say", "t": "Табуретов вздыхает и отпивает кофе.", "src": 1274, "p": "Москва — Смоленск, конец августа 1923", "h": "97b65c9f"}, {"k": "say", "t": "Здравствуйте, Крюков, это я, Табуретов. Как я понимаю, до вас не дошла моя телеграмма.", "src": 1274, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Москва — Смоленск, конец августа 1923", "h": "be9a9f58"}, {"k": "say", "t": "Дошла. Я не вижу смысла на неё отвечать.", "src": 1275, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Москва — Смоленск, конец августа 1923", "h": "52a2b3f3"}, {"k": "say", "t": "А я вижу! Вы отличный кандидат, Крюков. Я не для того к вам присоединялся и помогал вам, чтобы вы отказались от трона. А ведь мог помочь тому же Врангелю.", "src": 1276, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Москва — Смоленск, конец августа 1923", "h": "19b95c82"}, {"k": "say", "t": "Но не помог. Я не видел в нём потенциала. А в вас видел и вижу.", "src": 1277, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Москва — Смоленск, конец августа 1923", "h": "40871be8"}, {"k": "say", "t": "Мгм… Пусть народ России решит это. Кстати, Табуретов, отправьте, пожалуйста, пару казачьих полков в Монголию.", "src": 1278, "w": "kryukov", "e": {"kryukov": "thinking"}, "p": "Москва — Смоленск, конец августа 1923", "h": "e60e915e"}, {"k": "say", "t": "Хорошо, отправлю. Народ выбрал вас, Крюков. Послезавтра желаю видеть вас в Смоленске.", "src": 1279, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Москва — Смоленск, конец августа 1923", "h": "d5412307"}, {"k": "say", "t": "До свидания.", "src": 1280, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Москва — Смоленск, конец августа 1923", "h": "e43cf0a7"}, {"k": "say", "t": "Табуретов бросает трубку и закуривает.", "src": 1280, "p": "Москва — Смоленск, конец августа 1923", "h": "b238e4bd"}, {"k": "say", "t": "Вот собака… Я с него ещё возьму…", "src": 1282, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва — Смоленск, конец августа 1923", "on": ["kryukov"], "x": {}, "h": "38dac562"}, {"k": "say", "t": "Ружик выступает перед Думой.", "src": 1283, "p": "Москва — Смоленск, конец августа 1923", "bg": "gosduma", "on": ["ruzhik"], "x": {}, "cg": "", "h": "613a42f6"}, {"k": "say", "t": "Дума желает удачи всем участникам выборов нового императора. Сейчас твёрдая рука нам нужна как никогда!", "src": 1283, "w": "ruzhik", "e": {"ruzhik": "original"}, "p": "Москва — Смоленск, конец августа 1923", "h": "a1795e8f"}, {"k": "say", "t": "Однако не стоит забывать, что в нашей стране надо строить крепкий парламент, который не будет подчиняться воле одного человека. Да здравствует Россия!", "src": 1283, "w": "ruzhik", "e": {"ruzhik": "happy"}, "p": "Москва — Смоленск, конец августа 1923", "h": "72501ee0"}, {"k": "paper", "src": 1284, "mast": "Ведомости России", "date": "Урга", "hd": "Казаки идут в Монголию", "bd": ["Владислав Табуретов отправил в Монголию двадцать казачьих полков."], "q": [], "p": "Москва — Смоленск, конец августа 1923", "on": [], "x": {}, "h": "90cd5518"}, {"k": "paper", "src": 1303, "mast": "Новости из Смоленска", "date": "Смоленск, 1 сентября 1923 г.", "hd": "Созван собор для избрания императора", "bd": ["В исторических стенах имения семьи Табуретовых собрались выборные из всех городов и уделов. Пример взят из древней традиции Земских соборов — как в Смутное время, когда избрали Михаила Романова.", "Аристократы, дворяне, духовенство, купцы, промышленники и простой люд обсуждают кандидатуры: родовитые фамилии, герои войн, государственные деятели. Подписи участников соберут под итоговым постановлением."], "q": [], "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "bg": "taburetov_imenie_zal", "on": [], "x": {}, "fx": "dust", "cg": "", "music": "", "id": "sobor", "h": "c1f239a3"}, {"k": "say", "t": "10:15. Парадный зал имения: лестница на второй этаж, картины, гостиная. За длинным столом сидят люди со всей державы — от Востока до Запада, от Севера до Юга.", "src": 1311, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "on": ["taburetov"], "x": {}, "music": "Спокойные дни военного", "h": "0f994b59"}, {"k": "say", "t": "Сколько мне ждать этих кандидатов?!", "src": 1311, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "aa0f476c"}, {"k": "say", "t": "В имение входят трое в костюмах, с портфелями.", "src": 1365, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "648d9942"}, {"k": "say", "t": "Здравствуйте. Мы официальные послы Британской империи. Прибыли по приглашению Владислава Табуретова.", "src": 1365, "w": "getsberg", "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "424ced9d"}, {"k": "say", "t": "Это я. Рад вас видеть, Вильям! А кто ваши попутчики?", "src": 1365, "w": "taburetov", "e": {"taburetov": "happy"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "787c1560"}, {"k": "say", "t": "Альберт Вайдель справа, Александр Фальконе слева.", "src": 1365, "w": "getsberg", "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "06985e20"}, {"k": "say", "t": "Министерство иностранных дел внимательно ознакомилось с вашим предложением о сотрудничестве и просило передать вам это письмо.", "src": 1368, "w": "falcone", "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "79572286"}, {"k": "say", "t": "Фальконе протягивает конверт с печатью.", "src": 1368, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "6601cea0"}, {"k": "say", "t": "Нет-нет-нет, это передайте, пожалуйста, господину Россу. Он у нас министр иностранных дел.", "src": 1369, "w": "taburetov", "e": {"taburetov": "embarrased"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "79ad6fde"}, {"k": "say", "t": "Справа гостиная, там все.", "src": 1366, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "a2f3b07e"}, {"k": "say", "t": "В Смоленск прибывает Алексей Крюков.", "src": 1394, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "on": ["kryukov", "kashubski"], "x": {}, "music": "Императорские проблемы", "e": {"kryukov": "original", "kashubski": "original"}, "h": "65b0ed55"}, {"k": "say", "t": "Вы точно уверены, что не готовы к титулу императора?", "src": 1433, "w": "kashubski", "e": {"kashubski": "thinking"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "4fc5da55"}, {"k": "say", "t": "У меня вопрос: кто решил, что я буду императором? Я регент…", "src": 1438, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "1a496245"}, {"k": "say", "t": "Я понял, уважаемый регент.", "src": 1439, "w": "kashubski", "e": {"kashubski": "embarassed"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "aff54a09"}, {"k": "say", "t": "Входит Табуретов с итогами народного голосования.", "src": 1449, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "on": ["taburetov", "kryukov", "kashubski"], "x": {}, "h": "96b451f8"}, {"k": "say", "t": "Народ, Алексеюшка, народ!", "src": 1449, "w": "taburetov", "e": {"taburetov": "happy"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "ae462d43"}, {"k": "doc", "src": 1449, "title": "Итоги народного голосования", "items": ["Крюков — 67%", "Табуретов — 12%", "Росс — 8%", "И некоторые другие кандидаты."], "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "14650f98"}, {"k": "say", "t": "Боже Иисусе…", "src": 1457, "w": "kryukov", "e": {"kryukov": "shocked"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "eef447f9"}, {"k": "say", "t": "Да, Боже! Поздравляю! Ты выиграл! Народ тебя выбрал!", "src": 1459, "w": "taburetov", "e": {"taburetov": "happy"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "583352b9"}, {"k": "say", "t": "Ни фальсификаций, ни подкупа — ничего! Абсолютно чистые выборы!", "src": 1460, "w": "taburetov", "e": {"taburetov": "happy"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "959ae82e"}, {"k": "say", "t": "Табуретыч… Это слишком большая честь для меня… Тысячелетняя Россия — и теперь я монарх?", "src": 1461, "w": "kryukov", "e": {"kryukov": "embarassed"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "50ea415b"}, {"k": "choice", "ask": "Что ответит Крюков?", "src": 1461, "opts": [{"t": "Принять корону.", "go": "tron_canon"}, {"t": "«Я регент, а не царь».", "go": "tron_alt"}], "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "fx": "dust", "cg": "", "id": "choice_tron", "h": "c81e871f"}, {"k": "say", "t": "Нет. Я регент, а не царь. Ищите другого.", "fork": true, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "id": "tron_alt", "h": "7fa526a9"}, {"k": "say", "t": "Я могу стать новым императором России.", "fork": true, "w": "glug", "e": {"glug": "happy"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "on": ["taburetov", "glug"], "x": {}, "h": "59dfd781"}, {"k": "say", "t": "…Хорошо.", "fork": true, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "f1ec719d"}, {"k": "fork", "src": 1471, "stamp": "Так в игре не было", "buttons": [{"t": "Назад к выбору", "go": "choice_tron"}], "paras": ["Мирного решения не будет..."], "note": "", "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "f66d2cac"}, {"k": "say", "t": "Да, монарх!", "src": 1462, "w": "taburetov", "e": {"kryukov": "embarassed", "pavlov": "happy", "taburetov": "happy"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "on": ["taburetov", "kryukov", "pavlov"], "x": {}, "id": "tron_canon", "music": "Гимн Российской Империи Lite", "h": "71cb2e82"}, {"k": "say", "t": "За нового монарха! Боже, Царя храни!", "src": 1464, "w": "pavlov", "e": {"pavlov": "happy"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "46251af0"}, {"k": "say", "t": "Боже, Царя храни, господа и дамы! Народ выбрал лучшего из лучших — Алексея Крюкова! Да здравствует Российская Империя!", "src": 1468, "w": "taburetov", "e": {"taburetov": "happy"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "f4faf463"}, {"k": "say", "t": "Табуретов поднимает бокал.", "src": 1470, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "9781bd57"}, {"k": "say", "t": "Гуляем, господа! За Царя, Бога и Отечество!", "src": 1470, "w": "taburetov", "e": {"taburetov": "happy"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "1db3f242"}, {"k": "say", "t": "Крюков обращается к собору.", "src": 1471, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "on": ["kryukov"], "x": {}, "role": {"kryukov": "император"}, "h": "befd4fb2"}, {"k": "say", "t": "Это знаменательный день в истории нашего государства. Я поднял народ в трудную минуту и объединил нашу раздробленную страну под своей крепкой рукой.", "src": 1471, "w": "kryukov", "e": {"kryukov": "original"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "32b92f91"}, {"k": "say", "t": "Я клянусь в верности этой державе, которая породила всех нас. Богом клянусь! Да здравствует Вторая Российская Империя! Ура!", "src": 1471, "w": "kryukov", "e": {"kryukov": "happy"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "fbe3f81f"}, {"k": "say", "t": "Павлов поднимает бокал и запевает «Боже, Царя храни».", "src": 1473, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "on": ["taburetov", "kryukov", "pavlov"], "x": {}, "h": "81c5b7d0"}, {"k": "say", "t": "Сегодня свершилось то, чего я ждал с семнадцатого года. Свершилось в моём имении, на моих глазах! В Россию вернулся державный отец!", "src": 1481, "w": "taburetov", "e": {"taburetov": "happy"}, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "5e37d005"}, {"k": "say", "t": "По всей Руси-матушке начинаются народные гуляния.", "src": 1487, "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "8f580be6"}, {"k": "paper", "src": 1471, "mast": "Ведомости России", "date": "Смоленск", "hd": "Император Всероссийский — Крюков Алексей Сергеевич", "bd": ["После Смоленского собора новым монархом России избран А. С. Крюков под именем Алексея II."], "q": ["«Богом клянусь! Да здравствует Вторая Российская Империя!»"], "p": "Смоленск, имение Табуретовых, 1 сентября 1923", "h": "58aa8f48"}, {"k": "say", "t": "Ночь. Александер Росс сходит с корабля, закуривает и направляется к зданию правительства Владивостока.", "src": 1476, "p": "Владивосток, той же ночью", "bg": "port_night", "on": ["ross"], "x": {}, "fx": "rain", "cg": "", "music": "Спокойные дни военного", "id": "vladivostok", "h": "9f8df031"}, {"k": "say", "t": "Здравствуйте, господа чиновники. Могу ли я переночевать в этом славном городе и сделать ещё пару государственных дел?", "src": 1476, "w": "ross", "e": {"ross": "original"}, "p": "Владивосток, той же ночью", "h": "8ca8e9c4"}, {"k": "say", "t": "Здравствуйте, Александер Константинович. Вы ведь в курсе последних новостей?", "src": 1476, "w": "agaryov", "p": "Владивосток, той же ночью", "h": "cc39a477"}, {"k": "say", "t": "Нет. А есть что-то важное?", "src": 1476, "w": "ross", "e": {"ross": "thinking"}, "p": "Владивосток, той же ночью", "h": "fba64397"}, {"k": "say", "t": "Я вас понял. Возьмите эту газету и отправляйтесь на вокзал. Поезд будет в Москве через восемь часов. Поторопитесь.", "src": 1476, "w": "agaryov", "p": "Владивосток, той же ночью", "h": "081fd873"}, {"k": "say", "t": "Росс удивляется, но бегом бросается на вокзал, покупает билет и успевает вскочить в поезд за две минуты до отправления.", "src": 1476, "p": "Владивосток, той же ночью", "bg": "train", "fx": "none", "cg": "", "music": "Ну полная Лодка!", "h": "0383c084"}, {"k": "say", "t": "Итак… Давайте взглянем, что у нас произошло… Монголия теперь русская…", "src": 1476, "w": "ross", "e": {"ross": "thinking"}, "p": "Владивосток, той же ночью", "h": "9d0b7729"}, {"k": "say", "t": "ЧТО, ÄITISI?! Новый император в Смоленске?!", "src": 1476, "w": "ross", "e": {"ross": "shocked"}, "p": "Владивосток, той же ночью", "h": "c47adf29"}, {"k": "say", "t": "Как всегда, я узнаю всё последним… Надеюсь, успею…", "src": 1476, "w": "ross", "e": {"ross": "sad"}, "p": "Владивосток, той же ночью", "h": "85b50d28"}, {"k": "paper", "src": 1524, "mast": "Заявление Думы", "date": "Москва", "hd": "Дума поздравляет государя", "bd": ["Дума поздравляет нового государя Крюкова с избранием и надеется на продуктивный диалог: вместе мы построим великую Россию!"], "q": ["Документ председателя ОГПУ Зарывалова от 02.02.1923 принят и по пункту 8.1 Закона №1 включён в него как правка."], "p": "Смоленск, 2 сентября 1923, утро", "bg": "taburetov_imenie_zal", "on": [], "x": {}, "fx": "none", "cg": "", "music": "Гимн Российской Империи Lite", "id": "ukazy", "h": "3835299e"}, {"k": "paper", "src": 1531, "mast": "Радио «Русь Матушка»", "date": "Москва", "hd": "Три имперские короны России", "bd": ["Шапка Мономаха, Екатерининская корона — и третья, над которой ещё работают лучшие ювелиры мира."], "q": ["«Я потратил на неё кровные 780 000 долларов, и это только начальная цена! Но она будет самой великой короной Империи». — Табуретов"], "p": "Смоленск, 2 сентября 1923, утро", "h": "ed9e5d4a"}, {"k": "doc", "t": "Подписи: Император Алексей II. Министр обороны генерал-фельдмаршал В. М. Табуретов.", "src": 1602, "title": "Первые указы Императора Алексея II", "items": ["Император остаётся Верховным главнокомандующим армии и флота.", "1. Председателем Совета министров назначается В. Ф. Ружик. До первых выборов он же председатель Государственной думы.", "2. Министром обороны назначается В. М. Табуретов с производством в генерал-фельдмаршалы.", "3. Министром иностранных дел утверждается А. К. Росс; слово «временный» из его должности снимается.", "4. Председателем ОГПУ остаётся Н. А. Зарывалов.", "5. Генерал-фельдмаршалами назначаются Ю. В. Глюг и М. М. Ческидов, бывший красный начдив, перешедший на сторону правительства. Выдать фельдмаршальские погоны."], "p": "Смоленск, 2 сентября 1923, утро", "h": "1dc55b36"}, {"k": "say", "t": "Утро после собора. Гетсберг отводит Табуретова в сторону и шепчет ему, что было в письме.", "src": 1608, "p": "Смоленск, 2 сентября 1923, утро", "on": ["taburetov"], "x": {}, "role": {"taburetov": "министр обороны", "ross": "министр иностранных дел", "ruzhik": "премьер, глава Думы"}, "music": "Хитрость Табуретова", "h": "8554e3b8"}, {"k": "say", "t": "Ого-го! Так это что? Старые друзья снова вместе? Как в четырнадцатом?", "src": 1608, "w": "taburetov", "e": {"taburetov": "happy"}, "p": "Смоленск, 2 сентября 1923, утро", "h": "e54e397d"}, {"k": "say", "t": "Получается, что да.", "src": 1612, "w": "getsberg", "p": "Смоленск, 2 сентября 1923, утро", "h": "28524ece"}, {"k": "say", "t": "Москва — Париж — Лондон. Старые союзники снова вместе!", "src": 1612, "w": "taburetov", "e": {"taburetov": "happy"}, "p": "Смоленск, 2 сентября 1923, утро", "h": "a22a5a88"}, {"k": "say", "t": "Эх, наконец-то в России долгожданный покой и мир. Надеюсь, Алексей не допустит новой внутренней войны.", "src": 1616, "w": "pavlov", "e": {"pavlov": "thinking"}, "p": "Смоленск, 2 сентября 1923, утро", "on": ["taburetov", "pavlov"], "x": {}, "h": "e3163b14"}, {"k": "say", "t": "Но нельзя верить англо-французским мерзавцам. Это плохо кончится. Россия должна взять свой курс!", "src": 1616, "w": "pavlov", "e": {"pavlov": "unhappy"}, "p": "Смоленск, 2 сентября 1923, утро", "h": "1529e247"}, {"k": "say", "t": "Но первые цели нашей страны — восстановить отношения с Антантой, что сделано, индустриализация, что в процессе, и возвращение кровных территорий России, что тоже в процессе.", "src": 1620, "w": "taburetov", "e": {"taburetov": "thinking"}, "p": "Смоленск, 2 сентября 1923, утро", "h": "ba6366cc"}, {"k": "say", "t": "Нет, англо-французские ребята нам враги! Это было доказано не раз.", "src": 1621, "w": "pavlov", "e": {"pavlov": "angry"}, "p": "Смоленск, 2 сентября 1923, утро", "h": "a471e90a"}, {"k": "say", "t": "Кое в чём да. Но нельзя изолироваться от мира сего. Надо и сотрудничать, и внутри всё развивать.", "src": 1622, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Смоленск, 2 сентября 1923, утро", "h": "054ef41c"}, {"k": "say", "t": "Посмотрим.", "src": 1623, "w": "pavlov", "e": {"pavlov": "thinking"}, "p": "Смоленск, 2 сентября 1923, утро", "h": "6f07adc7"}, {"k": "say", "t": "Павлов медленно направляется к машине.", "src": 1623, "p": "Смоленск, 2 сентября 1923, утро", "h": "e6061de2"}, {"k": "say", "t": "Посмотрим, посмотрим, товарищ Павлов.", "src": 1708, "w": "taburetov", "e": {"taburetov": "thinking"}, "p": "Смоленск, 2 сентября 1923, утро", "h": "b64d9da8"}, {"k": "say", "t": "Дверь распахивается с грохотом. На пороге — Росс.", "src": 1707, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "bg": "taburetov_imenie_zal", "on": ["taburetov", "ross"], "x": {}, "fx": "none", "cg": "", "e": {"ross": "happy"}, "id": "vzryv", "h": "932f308f"}, {"k": "say", "t": "Здравствуйте, господа! Что я пропустил за восемь часов?", "src": 1707, "w": "ross", "e": {"ross": "happy"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "cc50a715"}, {"k": "say", "t": "Здравствуйте, Росс, рад вас видеть. Новости вы видели?", "src": 1709, "w": "taburetov", "e": {"taburetov": "happy"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "fcdccf5f"}, {"k": "say", "t": "Про императора? Да, поэтому и пришёл сюда. Так что, я что-то пропустил?", "src": 1710, "w": "ross", "e": {"ross": "original"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "8f212ff8"}, {"k": "say", "t": "Ну, раз видели, значит, половину уже знаете. Потом, после результатов голосования, были гуляния, праздник и…", "src": 1713, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "df0423ce"}, {"k": "say", "t": "Павлов открывает дверцу машины.", "src": 1711, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "bg": "sad_usadba_no_car", "on": [], "x": {}, "cg": "", "h": "069f0619"}, {"k": "say", "t": "Взрыв.", "src": 1711, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "bg": "sad_vzryv", "fx": "embers", "cg": "", "once": ["flash", "shake"], "music": "Ужас ужасный", "sfx": "explosion", "h": "73fe51e7"}, {"k": "say", "t": "Павлова отбрасывает на десять — пятнадцать метров.", "src": 1714, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "ed02b309"}, {"k": "say", "t": "Ёкарный тебя Чапай!", "src": 1716, "w": "taburetov", "e": {"taburetov": "shocked", "ross": "shocked"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "on": ["taburetov", "ross"], "x": {}, "fx": "smoke", "h": "ea2d9125"}, {"k": "say", "t": "Весело у вас… Это салют в честь нового императора?!", "src": 1715, "w": "ross", "e": {"ross": "shocked"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "15920bea"}, {"k": "say", "t": "Нет. Походу, хуже.", "src": 1718, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "55ab4d72"}, {"k": "say", "t": "Крюков выглядывает из окна.", "src": 1717, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "on": ["taburetov", "kryukov", "ross"], "x": {}, "e": {"kryukov": "shocked"}, "h": "3c96a0b7"}, {"k": "say", "t": "Господа, шо произошло?", "src": 1717, "w": "kryukov", "e": {"kryukov": "shocked"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "a3dda768"}, {"k": "say", "t": "Тут теракт! Покушение на Павлова!", "src": 1721, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "54b929ba"}, {"k": "say", "t": "В доме звонит телефон. Трубку берёт Росс.", "src": 1723, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "324d2a94"}, {"k": "say", "t": "Это я, Глюг. Я в Смоленске. Это салют, или кого-то опять взорвали?", "src": 1724, "w": "glug", "e": {"glug": "thinking"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "daf40888"}, {"k": "say", "t": "Попытка подорвать Павлова. Он жив, но сильно ранен.", "src": 1727, "w": "ross", "e": {"ross": "unhappy"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "69f44900"}, {"k": "say", "t": "Ясно. Может, ввести войска?", "src": 1728, "w": "glug", "e": {"glug": "unhappy"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "aee7df74"}, {"k": "say", "t": "Надо везти его в больницу! Срочно! Водитель! Готовьте транспорт!", "src": 1725, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "6fc7c52b"}, {"k": "say", "t": "Нет, мне нужно в Красноярск!", "src": 1726, "w": "pavlov", "e": {"pavlov": "shocked"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "1f8cc323"}, {"k": "say", "t": "Нет! Вы едете в больницу! И точка!", "src": 1729, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "0af2228a"}, {"k": "say", "t": "Крюков звонит по телефону.", "src": 1730, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "365ac719"}, {"k": "say", "t": "Алло?", "src": 1730, "w": "operator", "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "0ff62dab"}, {"k": "say", "t": "Соедините меня с товарищем Зарываловым.", "src": 1730, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "0cb68144"}, {"k": "say", "t": "Вы кто?", "src": 1730, "w": "operator", "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "ed370647"}, {"k": "say", "t": "Крюков. Соедините меня с Зарываловым, живо!", "src": 1730, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "2506347f"}, {"k": "say", "t": "Это шутка?", "src": 1730, "w": "operator", "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "7a477284"}, {"k": "say", "t": "Барышня, расстреляю! А ну живо!", "src": 1730, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "91d1359e"}, {"k": "say", "t": "В Москву его, в Москву!", "src": 1732, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "ad1fedb8"}, {"k": "say", "t": "Табуретов сажает Павлова в машину. Из дома выбегает Кашубский.", "src": 1733, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "on": ["taburetov", "kashubski", "pavlov"], "x": {}, "e": {"kashubski": "shocked", "pavlov": "sad"}, "h": "6575e811"}, {"k": "say", "t": "Будь прокляты террористы!", "src": 1735, "w": "kashubski", "e": {"kashubski": "angry"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "db97face"}, {"k": "say", "t": "Нет, нет, мне нужно в Красноярск!", "src": 1736, "w": "pavlov", "e": {"pavlov": "angry"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "b770f2c6"}, {"k": "say", "t": "Это не террористы… Британцы… британцы…", "src": 1737, "w": "pavlov", "e": {"pavlov": "sad"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "7ee41633"}, {"k": "say", "t": "Какой Красноярск? Вы что, с ума сошли?! Вам в больницу надо!", "src": 1738, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "5fcfc4be"}, {"k": "say", "t": "Причём тут британские дипломаты?! Они приехали ко мне, чтобы вернуться к сотрудничеству!", "src": 1740, "w": "taburetov", "e": {"taburetov": "shocked"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "c0915312"}, {"k": "say", "t": "Павлов теряет сознание.", "src": 1746, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "ae98e565"}, {"k": "say", "t": "Росс набирает номер московского правительства.", "src": 1741, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "on": ["taburetov", "ross"], "x": {}, "h": "7dab5b33"}, {"k": "say", "t": "Алло, это Александер Росс… Что?! Британцы?! Подготовьте гарнизон и держите его наготове. Это приказ!", "src": 1741, "w": "ross", "e": {"ross": "shocked"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "1df20944"}, {"k": "say", "t": "Господа, где можно взять машину?", "src": 1742, "w": "ross", "e": {"ross": "original"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "0e45017b"}, {"k": "say", "t": "В моём гараже!", "src": 1744, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "e9131ec4"}, {"k": "say", "t": "Через пять минут к имению подъезжает кортеж: четыре грузовика с солдатами и седан с генерал-фельдмаршалом Глюгом.", "src": 1747, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "d955427c"}, {"k": "say", "t": "Я с вами! Водитель, Павлова — в Москву, в больницу, понял?!", "src": 1748, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "0a308de2"}, {"k": "say", "t": "Росс хватает ключи из гаража и уезжает в сторону Москвы.", "src": 1750, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "533c3cf0"}, {"k": "say", "t": "Едем! Судьба страны в наших руках!", "src": 1752, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "23f9fc15"}, {"k": "say", "t": "Крюков звонит Ружику.", "src": 1758, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "on": ["kryukov"], "x": {}, "music": "Императорские проблемы", "h": "dbbb3932"}, {"k": "say", "t": "День добрый, кто на проводе?", "src": 1760, "w": "ruzhik", "e": {"ruzhik": "original"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "6ce0512d"}, {"k": "say", "t": "Товарищ Ружик, это Крюков. Срочно сообщите господину Зарывалову: у нас новый теракт в Смоленске. Это уже не смешно!", "src": 1761, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "9b040694"}, {"k": "say", "t": "Так точно, ваше высокопревосходительство! Павлов жив?", "src": 1763, "w": "ruzhik", "e": {"ruzhik": "shocked"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "1962e81c"}, {"k": "say", "t": "Жив. Я выезжаю в Москву. Коронацию отложить, у нас страна в террористах.", "src": 1765, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "679a0128"}, {"k": "say", "t": "Принял. Ввести военное положение и комендантский час в Петрограде?", "src": 1770, "w": "ruzhik", "e": {"ruzhik": "thinking"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "99d55f9f"}, {"k": "say", "t": "В Санкт-Петербурге, во-первых. А во-вторых — во всех крупных городах России. До свидания.", "src": 1773, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "e4d52fa2"}, {"k": "say", "t": "Крюков бросает трубку.", "src": 1773, "p": "Смоленск, имение Табуретовых, 2 сентября 1923", "h": "a89f9394"}, {"k": "say", "t": "Табуретов звонит британскому дипломату из машины.", "src": 1762, "p": "Москва, тот же день", "bg": "vokzal", "on": ["taburetov", "glug"], "x": {}, "fx": "smoke", "cg": "", "e": {"glug": "original"}, "id": "vokzal", "h": "970f2bda"}, {"k": "say", "t": "Алло? Это я, Влад! Вы на вокзале? Ждите! Ждите нас на Московском вокзале!", "src": 1762, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Москва, тот же день", "h": "39be72ef"}, {"k": "say", "t": "Московский вокзал.", "src": 1775, "p": "Москва, тот же день", "h": "cb7ce8eb"}, {"k": "say", "t": "Дипломаты! Они садятся в поезд!", "src": 1775, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Москва, тот же день", "h": "4f511425"}, {"k": "say", "t": "Рота, стройся на перроне!", "src": 1779, "w": "glug", "e": {"glug": "angry"}, "p": "Москва, тот же день", "h": "5c4ebf22"}, {"k": "say", "t": "Звонок. На проводе — Крюков.", "src": 1780, "p": "Москва, тот же день", "on": ["taburetov", "kryukov"], "x": {}, "h": "64b4fcd5"}, {"k": "say", "t": "Товарищ Табуретов, вы куда уехали?", "src": 1784, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Москва, тот же день", "h": "0fc62b01"}, {"k": "say", "t": "Мы за дипломатами! Они сейчас на первом пути!", "src": 1785, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Москва, тот же день", "music": "Хитрость Табуретова", "h": "e95658aa"}, {"k": "say", "t": "Какие ещё, мать твою, дипломаты?", "src": 1786, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, тот же день", "h": "1e26801b"}, {"k": "say", "t": "Британские, Крюков! Я договорился о встрече с ними!", "src": 1787, "w": "taburetov", "e": {"taburetov": "original"}, "p": "Москва, тот же день", "h": "8d48006c"}, {"k": "say", "t": "А почему я узнаю об этом последним? О чём вы собираетесь с ними разговаривать? Я не давал вам таких полномочий, господин министр обороны.", "src": 1789, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, тот же день", "h": "e9a0fa74"}, {"k": "say", "t": "Крюков, скоро выборы в британском парламенте, а там почему-то набирают популярность антирусские. Я их пригласил, чтобы нынешний парламент не обнулил решение!", "src": 1791, "w": "taburetov", "e": {"taburetov": "thinking"}, "p": "Москва, тот же день", "h": "5f9c7afe"}, {"k": "say", "t": "Какие ещё антирусские? Господин Табуретов, вы там, собаки, совсем охренели?! Такие вопросы пусть решают господин Ружик и Росс! Что вы себе позволяете?", "src": 1797, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, тот же день", "h": "ec6c3240"}, {"k": "say", "t": "Я вас разжалую! Отправьте туда Росса, а сами — в Генштаб!", "src": 1797, "w": "kryukov", "e": {"kryukov": "angry"}, "p": "Москва, тот же день", "h": "17b02c2b"}, {"k": "say", "t": "Вы что?! Вы совсем там, что ли? Я помочь России хотел, а вы меня разжаловать?! Вы знаете, сколько я уговаривал их приехать в Смоленск?!", "src": 1801, "w": "taburetov", "e": {"taburetov": "angry"}, "p": "Москва, тот же день", "h": "5cd878c3"}, {"k": "say", "t": "Хотите помочь России — выполняйте свою работу. Вы военный. У нас тут проблемы с Китаем, вот ваша задача. Отправляйте генерал-фельдмаршала Ческидова в Монголию.", "src": 1805, "w": "kryukov", "e": {"kryukov": "unhappy"}, "p": "Москва, тот же день", "h": "3fd5d0a2"}, {"k": "say", "t": "Крюков бросает трубку.", "src": 1805, "p": "Москва, тот же день", "h": "ad6b9bcf"}, {"k": "say", "t": "Вот собака. Как власть пришла, так сразу на меня как лев набросился. Он ещё о планах Британии насчёт интервенции не слышал…", "src": 1811, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Москва, тот же день", "on": ["taburetov"], "x": {}, "h": "90eecb69"}, {"k": "say", "t": "Ну ладно. В Генштаб так в Генштаб.", "src": 1811, "w": "taburetov", "e": {"taburetov": "unhappy"}, "p": "Москва, тот же день", "h": "68786334"}, {"k": "say", "t": "На перрон вбегает Росс.", "src": 1798, "p": "Москва, тот же день", "on": ["ross"], "x": {}, "music": "Спокойные дни военного", "h": "7884b289"}, {"k": "say", "t": "Чёрт… Постойте! Погодите, я глава МИДа!", "src": 1798, "w": "ross", "e": {"ross": "angry"}, "p": "Москва, тот же день", "h": "2afb99ab"}, {"k": "say", "t": "Дипломаты останавливаются и подходят ближе.", "src": 1798, "p": "Москва, тот же день", "h": "5e74e06f"}, {"k": "say", "t": "Фух… Простите… Здравствуйте. Я Александер Росс, министр иностранных дел России.", "src": 1798, "w": "ross", "e": {"ross": "embarassed"}, "p": "Москва, тот же день", "h": "9c86b8aa"}, {"k": "say", "t": "А, так это вы… Погодите, а почему вы здесь, а не во Владивостоке?", "src": 1798, "w": "getsberg", "p": "Москва, тот же день", "h": "a03a74be"}, {"k": "say", "t": "Я был там: возвращался из США… Что ж, может, пройдём в здание МИДа и обсудим то, чего вы хотите?", "src": 1798, "w": "ross", "e": {"ross": "original"}, "p": "Москва, тот же день", "h": "7969eb5d"}, {"k": "say", "t": "Мы согласны.", "src": 1798, "w": "getsberg", "p": "Москва, тот же день", "h": "fb518643"}, {"k": "say", "t": "Тогда идём!", "src": 1798, "w": "ross", "e": {"ross": "happy"}, "p": "Москва, тот же день", "h": "00b061d7"}, {"k": "paper", "t": "По приезде в Москву Крюков одобрил закон.", "src": 1813, "mast": "Питерский Рабочий", "date": "Санкт-Петербург, 2 сентября 1923 г.", "hd": "Военное положение", "bd": ["В связи с покушением на генерала Павлова в Санкт-Петербурге вводится военное положение и комендантский час с 23:00 до 06:00. Завтра экстренное заседание Думы рассмотрит, распространить ли его на все крупные города империи, а также расширение полномочий ОГПУ."], "q": [], "p": "Москва, тот же день", "bg": "genshtab", "on": [], "x": {}, "fx": "none", "cg": "", "h": "26f28081"}, {"k": "doc", "src": 1818, "title": "Указ Министра обороны Российской Империи генерал-фельдмаршала В. М. Табуретова", "items": ["Направить генерал-фельдмаршала Марка Ческидова в протекторат Монголия с целью защиты Монголии от китайской агрессии.", "Подпись: Министр обороны РИ. Печать: Министерство обороны РИ."], "p": "Москва, тот же день", "h": "9fc4563f"}, {"k": "say", "t": "Табуретов выходит из Генштаба на перекур. Кашляет. Задумывается.", "src": 1846, "p": "Москва, тот же день", "on": ["taburetov"], "x": {}, "h": "78b599ad"}, {"k": "say", "t": "А если покушение планировалось не на Павлова, а на меня?", "src": 1846, "w": "taburetov", "e": {"taburetov": "thinking"}, "p": "Москва, тот же день", "h": "a9df2354"}, {"k": "wire", "src": 1876, "from": "В. Ф. Ружик", "to": "А. К. Россу, МИД", "tape": ["КАК СИТУАЦИЯ С ДИПЛОМАТАМИ", "НИ В КОЕМ СЛУЧАЕ НЕ ОТПУСКАЙТЕ", "ЗАПРИТЕ ИХ В МЕТРОПОЛЕ И ДАВАЙТЕ ТОЛЬКО ПОДОБРАННЫЕ ГАЗЕТЫ", "ИМ НЕ СТОИТ ЗНАТЬ О ПОКУШЕНИИ ТЧК"], "p": "Москва, Министерство иностранных дел", "bg": "kabinet_mid", "on": [], "x": {}, "fx": "none", "cg": "", "music": "Спокойные дни военного", "id": "mid", "h": "2f269b17"}, {"k": "say", "t": "Росс и дипломаты входят в кабинет. Росс садится в своё кресло.", "src": 1891, "p": "Москва, Министерство иностранных дел", "on": ["ross"], "x": {}, "h": "a8925b43"}, {"k": "say", "t": "Итак, чего же Британия хочет от России?", "src": 1891, "w": "ross", "e": {"ross": "original"}, "p": "Москва, Министерство иностранных дел", "h": "c93db851"}, {"k": "say", "t": "Насколько я помню, Российская империя заняла у британской короны достаточно много денег. Если вы отдадите все деньги, Британия признает ваше правительство.", "src": 1891, "w": "getsberg", "p": "Москва, Министерство иностранных дел", "h": "20122244"}, {"k": "say", "t": "Мгм… И?", "src": 1891, "w": "ross", "e": {"ross": "thinking"}, "p": "Москва, Министерство иностранных дел", "h": "ec4e6060"}, {"k": "say", "t": "Ах да… Возместите ущерб, который вы нанесли нашим войскам на Кавказе и в Мурманске.", "src": 1891, "w": "getsberg", "p": "Москва, Министерство иностранных дел", "h": "d8e9efee"}, {"k": "say", "t": "То есть
